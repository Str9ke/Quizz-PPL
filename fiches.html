<li>Entraînement à l'atterrissage forcé (vol d'instruction) : hauteur ramenée à <b>50 m (150 ft)</b>, distance ≥ <b>150 m</b> maintenue en permanence</li>
<li>Aéronef survolant un État étranger : applique la règle la <b>plus restrictive</b> entre règles françaises et règles locales</li>
</ul>`},
{t:'Circuit d\'aérodrome', html:`
<ul>
<li>Ordre : montée → vent traversier → <b>vent arrière</b> (1000 ft AAL) → base → finale</li>
<li>Standard = virages à <b>gauche</b> ; flèche rouge = à droite</li>
<li>Intégration : par l'<b>extérieur</b> en début de vent arrière</li>
<li>AFIS hors horaires : passage <b>vertical</b> au-dessus, puis vent arrière</li>
<li>Point d'attente : 50 m piste revêtue, 30 m piste herbe</li>
</ul>`},
{t:'Priorités & évitement', html:`
<ul>
<li><b>Voir et éviter</b> incombe au CdB même en espace contrôlé</li>
<li>À droite = priorité ; mais : moteur cède aux <b>dirigeables → planeurs → ballons</b></li>
<li>Face à face : oblique vers la <b>droite</b></li>
<li>Dépassement : par la <b>droite</b></li>
<li>Atterrissage : plus bas = prioritaire (mais pas pour doubler)</li>
<li>En montagne : priorité à celui qui a la pente à sa <b>droite</b></li>
<li><b>Dépassement</b> = approche par l'arrière avec angle &lt; <b>70°</b> par rapport au plan de symétrie ; toujours par la <b>droite</b>, le dépassé garde cap et altitude</li>
<li>Aéronef remorquant (planeur, banderole) <b>prioritaire</b> sur les aéronefs motopropulsés</li>
<li>À l'approche, l'aéronef le <b>plus haut</b> cède le passage au plus bas, qui ne peut s'en prévaloir pour le doubler</li>
<li>Aéronef en <b>état d'urgence</b> déclaré : prioritaire sur tous à l'atterrissage</li>
<li>Aéronef roulant au sol cède toujours le passage à ceux qui décollent ou atterrissent</li>
</ul>`},
{t:'Signaux lumineux', html:`
<table>
<tr><th>Signal</th><th>En vol</th><th>Au sol</th></tr>
<tr><td class="ok">Vert continu</td><td>Atterrir autorisé</td><td>Décoller autorisé</td></tr>
<tr><td class="ok">Vert éclats</td><td>Revenez pour atterrir</td><td>Rouler autorisé</td></tr>
<tr><td class="danger">Rouge continu</td><td>Restez dans circuit</td><td>Arrêtez</td></tr>
<tr><td class="danger">Rouge éclats</td><td>Aérodrome dangereux</td><td>Dégagez piste</td></tr>
<tr><td>Blanc éclats</td><td>Atterrissez, gagnez trafic</td><td>Retournez au départ</td></tr>
</table>`},
{t:'Pistes & balisage', html:`
<table>
<tr><th>Feu</th><th>Couleur</th></tr>
<tr><td>Bord de piste</td><td>Blancs</td></tr>
<tr><td>Seuil</td><td class="ok">Verts</td></tr>
<tr><td>Extrémité</td><td class="danger">Rouges</td></tr>
<tr><td>Taxiway</td><td style="color:#42a5f5">Bleus</td></tr>
</table>
<ul>
<li><b>PAPI</b> : 2R + 2B = sur le plan ; plus de R = trop bas ; plus de B = trop haut</li>
<li>QFU = orientation magnétique piste /10 arrondi</li>
<li>Seuil décalé : atterrir après, décoller avant autorisé</li>
<li><b>ARP</b> (Aerodrome Reference Point) = point de référence géométrique de l'aérodrome</li>
<li>Altitude de référence aérodrome = altitude du point le <b>plus élevé</b> de l'aire d'atterrissage</li>
<li><b>PCN</b> : indice de résistance du revêtement de piste</li>
<li><b>TORA</b> = roulement dispo ; <b>TODA</b> = TORA + prolongement dégagé ; <b>ASDA</b> = TORA + prolongement d'arrêt ; <b>LDA</b> = distance d'atterrissage utilisable</li>
<li>Aire de manœuvre = pistes + taxiways ; aire de trafic = parkings/avitaillement/entretien ; aire de mouvement = les deux réunies</li>
<li>Indicatif OACI aérodrome = <b>4 lettres</b> (LF.. en France)</li>
<li>Pistes parallèles : <b>L</b> (gauche) / <b>C</b> (centrale) / <b>R</b> (droite)</li>
<li>Numéro de piste = orientation magnétique arrondie à la <b>dizaine</b> la plus proche (÷10)</li>
<li>Manche à air : force et direction du vent <b>au sol</b></li>
<li>Feux des véhicules de service = <b>jaunes</b> à éclats ; véhicules de sécurité (police/pompiers) = <b>bleus</b> à éclats</li>
<li>Balisage des obstacles (antennes, pylônes) = <b>blanc et rouge</b></li>
</ul>`},
{t:'Plan de vol (FPL)', html:`
<ul>
<li><b>Obligatoire</b> : franchissement frontière, survol maritime, VFR nuit non local, vol IFR</li>
<li>Dépôt : <b>60 min</b> (frontière) / <b>30 min</b> (national)</li>
<li>Case 9 : L (≤7t), M (7-136t), H (≥136t)</li>
<li>Case 15 : TAS en N0090 ou K0180</li>
<li>Validité FPL non contrôlé : <b>30 min</b> après EOBT</li>
<li>Clôture : par pilote si terrain non contrôlé</li>
<li>Case 9 (turbulence de sillage) : <b>L</b> (≤7t) / <b>M</b> (7-136t) / <b>H</b> (≥136t)</li>
<li>Case 10 (équipement) : <b>S</b>=standard, <b>N</b>=néant, <b>G</b>=GPS, <b>V/O/F</b>=VHF/VOR/radiocompas</li>
<li>Case 13/17 : <b>ZZZZ</b> = aérodrome sans indicatif OACI (nom en clair en case 18)</li>
<li>Case 15 : niveau = <b>F</b>+3 chiffres (FL) ou <b>A</b>+3 chiffres (centaines de ft) ; vitesse = <b>N</b>+4 chiffres (kt, TAS)</li>
<li>Case 16 (EET) : durée estimée du <b>décollage</b> jusqu'à la verticale de destination</li>
<li>Modification de l'autonomie ou du nombre de personnes à bord = <b>annulation</b> du FPL et nouveau dépôt</li>
<li>Activation du FPL : à l'heure du <b>décollage</b></li>
</ul>`},
{t:'Documents aéronef', html:`
<ul>
<li><b>CDI</b> (immatriculation) : pas de date validité, confère nationalité</li>
<li><b>CDN</b> (navigabilité) : validité illimitée</li>
<li><b>CEN/ARC</b> (examen navigabilité) : validité <b>1 an</b></li>
<li><b>LSA</b> : licence station aéronef, validité illimitée</li>
<li><b>Manuel de vol</b> : à bord pour tous les vols</li>
<li><b>Carnet de route</b> : rempli par CdB ; livrets cellule/moteur au <b>sol</b></li>
<li>Identification aéronef = marque de <b>nationalité</b> (F pour la France) + marque d'<b>immatriculation</b>, attribuées par l'État d'immatriculation</li>
<li><b>Plaque d'identité</b> : résistante au feu, indique nationalité et immatriculation (identification post-accident)</li>
<li><b>LSA</b> (licence station aéronef) : validité illimitée si aéronef certifié, <b>6 ans</b> si non certifié (ULM)</li>
<li>Carnet de route : rempli au plus tard en <b>fin de journée</b> ou à chaque changement de CdB ; y figure l'<b>APRS</b> (approbation pour remise en service), signée par le mécanicien agréé</li>
<li>Nationalité de l'aéronef = <b>État d'immatriculation</b>, indépendamment du lieu de construction ou du propriétaire</li>
<li>Certificat d'assurance RC et carnet de route à bord de chaque vol (sauf vols locaux : peuvent rester au bureau de piste)</li>
</ul>`},
{t:'Licence PPL & qualifications', html:`
<ul>
<li>PPL âge min : <b>17 ans</b> ; solo : <b>16 ans</b></li>
<li>Formation : <b>45 h</b> dont 25h DC, 10h solo (dont 5h campagne + 1 vol 150 NM + 2 atterrissages)</li>
<li>Médical classe 2 : &lt; 42 ans → <b>5 ans</b> ; 42-49 → <b>2 ans</b> ; ≥ 50 → <b>1 an</b></li>
<li>Expérience récente passagers : <b>3 décollages + 3 atterrissages / 90 jours</b></li>
<li>SEP validité : <b>24 mois</b> ; prorogation : 12h vol dont 6h CdB + 12 dec/att + 1h FI</li>
<li>Validité de l'examen théorique PPL : <b>24 mois</b> ; tous les modules doivent être réussis en ≤ <b>18 mois</b> sinon reprise complète</li>
<li>Épreuve pratique à réussir dans les <b>24 mois</b> suivant le dernier module théorique</li>
<li>Certificat provisoire (après réussite pratique) : valable <b>2 mois</b>, territoire national uniquement</li>
<li>Qualification <b>IR</b> : validité <b>12 mois</b></li>
<li>PPL/A multimoteur : ≥ <b>70 h CdB</b> exigées pour se présenter à l'épreuve pratique en multimoteur</li>
<li>Heures sur un autre brevet (planeur, hélico…) prises en compte : max <b>10 %</b> du total CdB, plafond <b>10 h</b></li>
<li>Instructeur habilité à former sur classe SEP : qualification <b>FI(A)</b></li>
<li><b>Vol supervisé</b> = vol solo de l'élève sous la responsabilité de l'instructeur</li>
</ul>`},
{t:'Services ATS & divers', html:`
<ul>
<li><b>TWR</b> : contrôle + info vol + alerte ; <b>AFIS</b> : info vol + alerte uniquement</li>
<li>« Autorisé » = uniquement par contrôleur pour décollage/atterrissage</li>
<li><b>Accident</b> = blessure grave/mortelle ou dommage important ; enquête <b>BEA</b> pour prévention</li>
<li>Phases SAR : <b>INCERFA → ALERFA → DETRESFA</b></li>
<li>Oxygène : max FL100 sans O₂ ; pilote &gt; 30 min FL100-130 ; tout le monde &gt; FL130</li>
<li><b>FIS</b> = service d'information de vol ; <b>VOLMET</b> = météo diffusée en continu ; <b>AIREP</b> = compte-rendu en vol ; <b>SIV</b> = service d'info de vol sectorisé ; <b>AFIL</b> = FPL déposé en vol</li>
<li>Fréquence par défaut si aérodrome sans fréquence publiée : <b>123,500 MHz</b></li>
<li>Référence horaire aviation = <b>UTC</b></li>
<li><b>PCL</b> (Pilot Controlled Lighting) : allumage du balisage piste par l'alternat radio, hors horaires de service</li>
<li><b>AIRPROX</b> : compte rendu de risque d'abordage, annoncé sur fréquence puis rapport écrit après le vol</li>
<li>Sanctions administratives possibles (ordre croissant) : avertissement, amende, retrait <b>temporaire</b> ou <b>définitif</b> des licences, emprisonnement</li>
<li>3 catégories d'événements (Annexe 13 OACI) : <b>incident</b>, <b>incident grave</b>, <b>accident</b> ; objectif d'une enquête = <b>prévention</b>, jamais la recherche de faute</li>
<li>Phase <b>ALERFA</b> en circuit d'aérodrome : déclenchée <b>5 min</b> après perte de contact confirmée</li>
<li>FIR France métropolitaine : <b>5</b> régions (Paris, Brest, Bordeaux, Marseille, Reims)</li>
</ul>`},
{t:'VFR on top, MEP & réglementation avancée', html:`
<ul>
<li><b>VFR on top</b> : vol VFR au-dessus d'une couche nuageuse, sans vue du sol</li>
<li>Conditions : maintenir VMC au-dessus, pouvoir redescendre en VMC</li>
<li><b>Qualification MEP</b> (Multi-Engine Piston) : validité <b>12 mois</b></li>
<li><b>Temps de vol</b> : dès que l'avion se déplace par ses propres moyens jusqu'à l'arrêt complet</li>
<li><b>Âge min premier vol double commande</b> : aucun minimum réglementaire</li>
<li><b>Commission de discipline</b> : peut suspendre ou révoquer une licence</li>
<li><b>Approche semi-directe</b> : rejoindre directement la base (sans vent arrière)</li>
<li><b>FIR</b> (Flight Information Region) : espace info vol, couvre tout le territoire</li>
<li>Survol rassemblement &gt; <b>100 000 personnes</b> = hauteur min <b>5000 ft AAL</b></li>
<li><b>Accident</b> : enquête dans le <b>pays où il se produit</b></li>
<li>Marquage axial piste = bande <b>discontinue blanche</b></li>
<li>Reconnaissance mutuelle licences entre <b>États membres OACI</b></li>
</ul>`},
{t:'Aire à signaux & signaleur', html:`
<table>
<tr><th>Signal</th><th>Signification</th></tr>
<tr><td><b>T</b> blanc</td><td>Direction atterrissage/décollage (barre = seuil)</td></tr>
<tr><td><b>Croix blanche</b></td><td>Piste inutilisable / aérodrome fermé</td></tr>
<tr><td>Flèche rouge</td><td>Sens circuit (virages à droite si présente)</td></tr>
<tr><td>Haltère blanc</td><td>Mouvements au sol sur pistes/voies de circulation uniquement</td></tr>
<tr><td>Haltère + bandes noires</td><td>Prudence à l'atterrissage (travaux)</td></tr>
<tr><td><b>C</b> noir/fond jaune</td><td>Bureau de piste (reporting office)</td></tr>
</table>
<ul>
<li><b>Signaleur (marshaller)</b> : guide au sol par gestes des bras</li>
<li>Bras levés en V = <b>venez vers moi</b> ; bras croisés = <b>stop</b></li>
<li>Bras droit tourné = <b>virez à droite</b> (du point de vue pilote)</li>
</ul>`},
{t:'AIP, NOTAM & information aéronautique', html:`
<ul>
<li><b>AIP</b> (Publication d'Information Aéronautique) en 3 parties : <b>GEN</b> (généralités), <b>ENR</b> (en-route : zones P/D/R, AWY), <b>AD</b> (aérodromes : horaires, carburant, secours)</li>
<li><b>NOTAM</b> (avis aux aviateurs) : information urgente et temporaire (obstacle nouveau, piste fermée, aide radio HS…)</li>
<li>Fermeture de piste programmée sur <b>1 an</b> : publiée uniquement à l'<b>AIP</b>, jamais en NOTAM</li>
<li><b>SNOWTAM</b> : état d'enneigement de l'aire de mouvement, validité <b>24 h</b></li>
<li><b>AIC</b> (circulaire d'information aéronautique) : information non urgente, absente des NOTAM et de l'AIP</li>
<li><b>PIB</b> (Pre-flight Information Bulletin) : présentation synthétique des NOTAM avant le vol</li>
<li>Carte <b>VAC</b> (Visual Approach Chart) : consignes particulières, RFFS, hotspots de l'aérodrome</li>
<li><b>Hotspot</b> (carte VAC) : zone à risque de collision/incursion de piste, vigilance renforcée</li>
</ul>`},
{t:'Calage altimétrique & niveaux de vol', html:`
<ul>
<li><b>QNH</b> : pression réduite au niveau de la mer → l'altimètre indique l'<b>altitude</b></li>
<li><b>QFE</b> : pression au niveau de l'aérodrome → l'altimètre indique la <b>hauteur</b>/aérodrome</li>
<li><b>QNE</b> : lecture altimètre calé <b>1013,25 hPa</b> (= niveau de vol)</li>
<li><b>Altitude de transition</b> : par défaut <b>5000 ft</b> (sauf indication carte 1/1M) ; en dessous = QNH</li>
<li><b>Niveau de transition</b> : 1er niveau de vol utilisable, ≥ 1000 ft au-dessus de l'altitude de transition</li>
<li><b>Couche de transition</b> = espace entre altitude et niveau de transition</li>
<li>Montée : calage <b>QNH → 1013,25</b> en passant l'altitude de transition</li>
<li>Descente : calage <b>1013,25 → QNH</b> en passant le niveau de transition</li>
<li>Espace <b>non contrôlé</b> : calage libre en dessous de <b>3000 ft ASFC</b> (QNH régional), <b>1013,25</b> au-dessus</li>
</ul>
<table>
<tr><th>Route magnétique</th><th>Niveaux IFR</th><th>Niveaux VFR</th></tr>
<tr><td>000°–179°</td><td>Impairs (FL30,50,70…)</td><td>Impairs+5 (FL35,55,75…)</td></tr>
<tr><td>180°–359°</td><td>Pairs (FL40,60,80…)</td><td>Pairs+5 (FL45,65,85…)</td></tr>
</table>
<ul>
<li>VFR interdit au <b>FL195</b> (limite FIR/UIR) ; un VFR ne peut jamais utiliser un niveau IFR</li>
<li>Espacement vertical IFR : <b>1000 ft</b> jusqu'au FL290, <b>2000 ft</b> au-dessus</li>
</ul>`},
{t:'Transpondeur, SSR & turbulence de sillage', html:`
<table>
<tr><th>Code</th><th>Signification</th></tr>
<tr><td class="danger">7500</td><td>Détournement / capture illicite</td></tr>
<tr><td class="danger">7600</td><td>Panne radio</td></tr>
<tr><td class="danger">7700</td><td>Détresse</td></tr>
</table>
<ul>
<li>Codes uniquement <b>0 à 7</b> par chiffre (jamais 8/9) → <b>4096</b> combinaisons</li>
<li>Modes : <b>A</b> (identification), <b>C</b> (+ altitude), <b>S</b> (mode S, données étendues)</li>
<li><b>SQUAWK IDENT</b> : intensifie l'écho sur l'écran radar du contrôleur</li>
<li>Transpondeur mode A+C obligatoire : classes <b>B, C, D</b>, VFR spécial, vol de nuit non local, RMZ/TMZ</li>
</ul>
<table>
<tr><th>Catégorie sillage</th><th>Masse max. décollage</th></tr>
<tr><td><b>L</b> (light)</td><td>≤ 7 t</td></tr>
<tr><td><b>M</b> (medium)</td><td>7 – 136 t</td></tr>
<tr><td><b>H</b> (heavy)</td><td>≥ 136 t</td></tr>
<tr><td><b>J</b> (super)</td><td>A380 uniquement</td></tr>
</table>
<ul>
<li>Espacement décollage/atterrissage d'un <b>L</b> derrière un <b>H</b> : <b>2 à 3 min</b></li>
</ul>`},
{t:'Vol de nuit', html:`
<ul>
<li><b>Nuit aéronautique</b> = 30 min après le coucher du soleil → 30 min avant le lever</li>
<li>Équipement obligatoire : feux de <b>position</b>, feu <b>anticollision</b>, phare(s) d'atterrissage</li>
<li>Feux de position allumés dès <b>30 min avant le coucher</b> du soleil ; feu anticollision dès la mise en route</li>
<li>Feu rouge = aile <b>gauche</b> (visible sous 110°) ; feu vert = aile droite ; feu blanc arrière (130°)</li>
<li>Hauteur min. VFR de nuit en espace non contrôlé : <b>300 m (1000 ft)</b></li>
<li>Minima météo voyage VFR de nuit : visi <b>5 km</b>, plafond &gt; 1500 ft, pas de nuages sous 1500 ft sur le trajet</li>
<li><b>Le VFR spécial de nuit n'existe pas</b></li>
<li>Qualification <b>vol de nuit</b> (ou IR) requise pour voler de nuit ; passagers de nuit : <b>3 décollages + 3 atterrissages de nuit dans les 3 mois</b> précédents</li>
<li>FPL obligatoire pour tout voyage VFR de nuit (hors tour de piste local)</li>
</ul>`},
{t:'Interception en vol', html:`
<ul>
<li><b>« Suivez-moi »</b> : battement d'ailes de l'intercepteur puis virage lent vers la nouvelle route</li>
<li><b>« Vous pouvez continuer »</b> : changement de cap brusque ≥ 90° avec montée, sans couper la trajectoire</li>
<li><b>« Posez-vous »</b> : l'intercepteur sort son train et effectue un passage bas devant vous</li>
<li>Pour refuser l'atterrissage imposé : survoler la piste à <b>1000 ft</b> en faisant clignoter les phares</li>
<li>Accusé de réception d'un signal (interception ou détresse au sol) : <b>battement des ailes</b> de jour</li>
</ul>`},
{t:'Zones à statut particulier & espaces réservés', html:`
<ul>
<li><b>Zone D</b> (dangereuse) : pénétration libre, mais activités dangereuses possibles (tir, essais…)</li>
<li><b>Zone R</b> (réglementée) : pas de règle fixe — parfois simple contact requis, parfois interdite si active</li>
<li><b>Zone P</b> (interdite) : pénétration interdite sauf autorisation ; entrée involontaire → quitter et atterrir sur l'aérodrome le plus proche <b>hors zone</b></li>
<li>VMC exigées dans une zone P/D/R = celles de l'<b>espace aérien</b> dans lequel elle se trouve (ce ne sont pas des classes d'espace)</li>
<li><b>TSA</b> (zone de ségrégation temporaire) et <b>CBA</b> (idem transfrontalière) : usage exclusif réservé pendant une durée déterminée</li>
<li><b>ZIT / ZRT</b> : zones interdites / réglementées <b>temporaires</b></li>
<li><b>RMZ</b> (Radio Mandatory Zone) : veille radio permanente obligatoire</li>
<li><b>TMZ</b> (Transponder Mandatory Zone) : transpondeur mode A/C ou S obligatoire</li>
</ul>`}
]},
/* ────────────────── 6. COMMUNICATIONS ────────────────── */
{
  id:'comm', icon:'📻', title:'Communications',
  subs:[
{t:'Alphabet OACI & fréquences', html:`
<table>
<tr><td>A Alfa</td><td>B Bravo</td><td>C Charlie</td><td>D Delta</td><td>E Echo</td><td>F Foxtrot</td><td>G Golf</td></tr>
<tr><td>H Hotel</td><td>I India</td><td>J Juliett</td><td>K Kilo</td><td>L Lima</td><td>M Mike</td><td>N November</td></tr>
<tr><td>O Oscar</td><td>P Papa</td><td>Q Quebec</td><td>R Romeo</td><td>S Sierra</td><td>T Tango</td><td>U Uniform</td></tr>
<tr><td>V Victor</td><td>W Whiskey</td><td>X X-ray</td><td>Y Yankee</td><td>Z Zulu</td><td></td><td></td></tr>
</table>
<ul>
<li>VHF communications : <b>118 – 136,975 MHz</b> ; espacement : <b>8,33 kHz</b></li>
<li><b>121,500 MHz</b> = fréquence détresse</li>
<li><b>123,500 MHz</b> = auto-info terrains sans fréquence</li>
<li>VHF = ondes directes (portée optique) : meilleure réception en <b>haute altitude</b>, près de l'aérodrome</li>
<li><b>HF</b> : ondes réfléchies par la couche <b>ionosphère</b> (longue distance)</li>
<li>Vitesse de propagation des ondes électromagnétiques : environ <b>300 000 km/s</b></li>
<li>Aérodrome non contrôlé <b>altiport/altisurface</b> sans fréquence publiée : utiliser <b>130,000 MHz</b> (au lieu de 123,500)</li>
</ul>`},
{t:'Indicatifs d\'appel', html:`
<ul>
<li>Au premier contact : indicatif <b>complet</b> (F-BOQS)</li>
<li>Abrégé = 1ère lettre + 2 dernières : F-BOQS → <b>F-QS</b></li>
<li>Après que le <b>contrôleur</b> l'a utilisé en premier</li>
<li>Tour = <b>Tower</b> ; Sol = <b>Ground</b> ; AFIS = <b>Radio</b> ; Info = <b>Info</b></li>
<li>Un <b>ATCU</b> peut imposer un changement temporaire d'indicatif en cas de risque de confusion entre indicatifs similaires</li>
<li>Indicatif abrégé alternatif : <b>nom du type d'avion + 2 dernières lettres</b> (ex : OO-ABC Cherokee → « Cherokee BC »)</li>
<li>« Standby on 118.9 for Tower » = passer sur <b>118,9</b> et <b>attendre</b> que la tour rappelle (ne pas appeler soi-même)</li>
<li>Collationnement d'une instruction fréquence/code : ne répéter que les <b>éléments chiffrés</b> (ex : « Squawk 4321, call Belga Radar on 129.325 » → « squawk 4321, 129.325 »)</li>
</ul>`},
{t:'Phraséologie standard', html:`
<table>
<tr><th>Terme</th><th>Signification</th></tr>
<tr><td>Affirm</td><td>Oui</td></tr>
<tr><td>Negative</td><td>Non</td></tr>
<tr><td>Roger</td><td>Reçu en entier</td></tr>
<tr><td>Wilco</td><td>Compris, sera exécuté</td></tr>
<tr><td>Say again</td><td>Répétez</td></tr>
<tr><td>Correction</td><td>Erreur, voici la version correcte</td></tr>
<tr><td>Break break</td><td>Séparation entre messages</td></tr>
</table>
<ul>
<li>Depuis 01/07/2023 : collationnement « <b>je décolle</b> » / « <b>j'atterris</b> »</li>
<li>Indicatif toujours en <b>dernier</b></li>
</ul>`},
{t:'Collationnement', html:`
<ul>
<li><b>Obligatoire</b> : calages alti, piste, clairances, codes transpondeur, cap, niveau</li>
<li><b>Ne PAS collationner</b> : vent, météo, informations de trafic</li>
<li>Échelle lisibilité : 1 (illisible) → 5 (parfait)</li>
<li>« <b>How do you read?</b> » = demande de vérification de la lisibilité</li>
<li>Collationner = le destinataire répète tout ou partie du message pour que l'émetteur vérifie la bonne réception</li>
</ul>`},
{t:'Détresse & urgence', html:`
<table>
<tr><th></th><th>Détresse</th><th>Urgence</th></tr>
<tr><td>Signal</td><td><b>MAYDAY ×3</b></td><td><b>PAN-PAN ×3</b></td></tr>
<tr><td>Danger</td><td>Grave et imminent</td><td>Pas immédiat</td></tr>
<tr><td>Priorité</td><td>N°1 absolue</td><td>N°2</td></tr>
</table>
<ul>
<li>Émettre sur la <b>fréquence en cours</b> d'abord ; sinon <b>121,500 MHz</b></li>
<li>Silence MAYDAY → silence radio total sur la fréquence</li>
<li>Code transpondeur détresse : <b>7700</b></li>
<li>Message « <b>pan pan medical</b> » précède un transport d'évacuation sanitaire protégé</li>
<li>Fin du silence radio / trafic détresse : « <b>Distress traffic ended</b> » → reprise des communications normales</li>
<li>Silence radio imposable par la station en détresse <b>ou</b> par la station aéronautique gérant la détresse</li>
<li>Message détresse = <b>MAYDAY ×3</b> + indicatif station appelée + indicatif avion + nature détresse + position/niveau/cap + intentions</li>
<li>Message urgence doit contenir : nature du problème, infos utiles, intentions, position, cap, altitude</li>
</ul>`},
{t:'Panne radio', html:`
<table>
<tr><th>Situation</th><th>Action</th></tr>
<tr><td>Avant entrée classe D</td><td><b>Ne pas entrer</b></td></tr>
<tr><td>Déjà en classe D</td><td>Atterrir le + proche, guetter signaux visuels</td></tr>
<tr><td>Classe E</td><td>Poursuivre normalement</td></tr>
<tr><td>Au sol, contrôlé</td><td><b>Ne pas décoller</b></td></tr>
<tr><td>IFR, espace contrôlé, VMC</td><td>Poursuivre en VMC, atterrir à l'aérodrome le + proche</td></tr>
<tr><td>IFR en route, après point de compte-rendu</td><td>Sélecter les niveaux du plan de vol déposé</td></tr>
<tr><td>Arrivée, clairance intégration déjà reçue</td><td>Suivre la dernière clairance jusqu'à l'atterrissage, guetter signaux visuels</td></tr>
<tr><td>Arrivée, clairance pas encore reçue</td><td>Ne pas s'intégrer (sauf urgence) ; passage vertical au-dessus du plus haut circuit puis intégration en observant signaux visuels</td></tr>
<tr><td>Avant clairance CTR (VFR spécial)</td><td><b>Ne pas entrer</b></td></tr>
</table>
<ul>
<li>Transpondeur : <b>7600</b></li>
<li>Transpondeur en panne avant un vol <b>IFR</b> : obtenir la <b>permission de l'ATC</b> pour effectuer le vol</li>
<li>Aérodrome approprié = aérodrome où les aéronefs sans radio sont autorisés à atterrir</li>
</ul>`},
{t:'Codes Q & énonciation', html:`
<table>
<tr><th>Code</th><th>Signification</th></tr>
<tr><td>QDM</td><td>Relèvement magnétique <b>vers</b> station</td></tr>
<tr><td>QDR</td><td>Relèvement magnétique <b>depuis</b> station</td></tr>
<tr><td>QTE</td><td>Relèvement vrai depuis station</td></tr>
</table>
<ul>
<li>Caps/relèvements : toujours <b>3 chiffres</b>, dits séparément</li>
<li>Fréquences : 3 premiers en nombre + « décimale » + suite</li>
<li>Heures en <b>UTC</b>, prononcées normalement si bonne lisibilité</li>
<li>Position trafic : cadran montre, nez = 12h, droite = 3h</li>
</ul>`},
{t:'Phraséologie détaillée & équipements', html:`
<table>
<tr><th>Situation</th><th>Annonce</th></tr>
<tr><td>Entrée fréquence</td><td>[Station] [indicatif complet] bonjour</td></tr>
<tr><td>Point d'attente</td><td>[indicatif] prêt au départ piste [QFU]</td></tr>
<tr><td>Après atterrissage</td><td>[indicatif] <b>piste dégagée</b></td></tr>
<tr><td>Traverser piste</td><td>Contrôleur : « <b>traversez</b> piste [QFU] »</td></tr>
<tr><td>Trafic non vu</td><td>Pilote : « <b>je surveille</b> »</td></tr>
<tr><td>Touch-and-go</td><td>Autorisé <b>option</b> = au choix remise de gaz / posé complet / touch-and-go</td></tr>
</table>
<ul>
<li><b>Squelch</b> : bouton radio qui supprime le bruit de fond (souffle)</li>
<li><b>ELT</b> (balise de détresse) : émet sur <b>121,500 MHz</b> + <b>406 MHz</b> (+ 243 MHz optionnel)</li>
<li><b>ATIS</b> : disponible par <b>radio VHF</b> et par <b>téléphone</b></li>
<li><b>VOLMET</b> : diffusion METAR sur VHF, fréquence trouvée sur <b>carte SIA radionavigation</b></li>
<li>Énonciation heures : « dix zéro cinq » (toujours en UTC)</li>
<li>Non contrôlé sans AFIS : auto-information sur <b>123,500 MHz</b></li>
</ul>`},
{t:'Priorité & catégories des messages', html:`
<ul>
<li>Ordre de priorité : <b>1 Détresse</b> → <b>2 Urgence</b> → <b>3 Radiogoniométrie</b> (ex : request QDM) → <b>4 Sécurité des vols</b> (toute instruction ATC : taxi, line up, cleared to land, turn left…) → <b>5 Météo</b> → <b>6 Régularité</b></li>
<li>Message de <b>sécurité des vols</b> : concerne immédiatement un avion en vol ou se préparant à partir</li>
<li>Message de <b>régularité</b> : maintenance d'installations essentielles à la sécurité/régularité (ex : pièces avion urgentes)</li>
<li>Au sein d'une même catégorie, pas de hiérarchie entre messages (« taxi to runway » = même priorité que « line up and wait » ; « taxi to holding point » = même priorité que « cleared to land »)</li>
<li>Appels simultanés de plusieurs aéronefs : l'ordre de réponse est choisi par la <b>station aéronautique</b></li>
<li>Message personnel adressé à une station aéronautique (ex : réserver un taxi) = <b>message non autorisé</b></li>
<li>Les messages de téléscripteur d'un briefing (ex : SKEYES) ne font <b>pas partie</b> du service mobile aéronautique</li>
</ul>`},
{t:'Transmission en aveugle & appels généraux', html:`
<ul>
<li><b>Transmitting blind</b> : utilisé quand on suppose que la station sol reçoit mais qu'aucun contact n'a pu être établi (toutes tentatives ayant échoué)</li>
<li>Utilisable en <b>IFR et VFR</b>, quel que soit l'espace aérien, sur la <b>fréquence en cours d'utilisation</b></li>
<li>L'expression « transmitting blind » n'est dite qu'<b>une seule fois</b>, en début de message</li>
<li>« Transmitting blind due to receiver failure » doit être suivi d'une <b>répétition complète</b> du message</li>
<li><b>Broadcast</b> = information non adressée à une station particulière</li>
<li>Appel général ATC (« all stations ») qui ne vous concerne pas : <b>ne donner aucune réponse</b></li>
</ul>`},
{t:'Codes transpondeur', html:`
<table>
<tr><th>Code</th><th>Signification</th></tr>
<tr><td>7000</td><td>VFR non contrôlé (par défaut)</td></tr>
<tr><td>7500</td><td>Intervention illicite</td></tr>
<tr><td>7600</td><td>Panne radio</td></tr>
<tr><td>7700</td><td>Détresse</td></tr>
</table>
<ul>
<li>« Squawk ident » = appuyer sur le bouton <b>IDENT</b></li>
<li>« Recycle squawk [code] » = <b>re-sélectionner</b> le même code en mode A</li>
<li>« Identified » = l'<b>identification radar</b> a été effectuée</li>
<li>Transpondeur mode C + alticodeur transmet l'<b>altitude-pression</b> (référence 1013 hPa)</li>
</ul>`},
{t:'Vocabulaire radiotéléphonique complémentaire', html:`
<table>
<tr><th>Terme</th><th>Signification</th></tr>
<tr><td>Acknowledge</td><td>Faites-moi savoir que vous avez reçu et compris</td></tr>
<tr><td>Approved</td><td>Permission accordée pour l'action proposée</td></tr>
<tr><td>Check</td><td>Vérifiez un système ou une procédure</td></tr>
<tr><td>Correct</td><td>C'est exact</td></tr>
<tr><td>Disregard</td><td>Considérez ce message comme non envoyé</td></tr>
<tr><td>Monitor</td><td>Écoutez sur la fréquence indiquée</td></tr>
<tr><td>Recleared</td><td>Un changement est apporté à votre dernière clairance</td></tr>
<tr><td>Unable to comply</td><td>Ne peut pas exécuter l'instruction reçue</td></tr>
<tr><td>Request</td><td>Utilisé par le pilote pour demander (ex : entrer en espace contrôlé)</td></tr>
<tr><td>Speak slower</td><td>Parlez plus lentement</td></tr>
<tr><td>Orbit right / left</td><td>Effectuez des 360° par la droite / gauche</td></tr>
<tr><td>Going around</td><td>J'effectue une remise de gaz</td></tr>
<tr><td>Runway vacated</td><td>Piste dégagée, annoncé après avoir quitté la piste</td></tr>
</table>`},
{t:'Énonciation — cas particuliers avancés', html:`
<ul>
<li>Épellation chiffre par chiffre en français : le chiffre <b>1 se prononce « unité »</b> (pas « un ») — ex : fréquence 121,055 en lisibilité faible → « unité deux unité décimale zéro cinq cinq »</li>
<li>En anglais, le chiffre 9 se prononce <b>« niner »</b> — ex : 119,5 MHz → « one one niner decimal five »</li>
<li>Bonne lisibilité : nombres énoncés « normalement » — ex : 10h50 → « dix cinquante » ; FL65 à 140 kt → « niveau six cinq, cent quarante nœuds »</li>
<li>Mauvaise lisibilité : retour à l'énonciation chiffre par chiffre — ex : heure 1620 douteuse → « one six two zero » ; altitude 11 200 ft → « unité, unité, deux cents pieds »</li>
<li>Les multiples de <b>cent et de mille</b> ne sont PAS épelés chiffre par chiffre — ex : 4500 ft → « four thousand five hundred » ; 13 500 ft → « one three thousand five hundred feet »</li>
<li>Identifiants de piste : exception française, énoncés en nombre naturel si aucune confusion possible (piste 02/20 → « zéro deux / vingt »)</li>
<li>Niveaux de vol : toujours précédés du mot <b>« niveau »</b> pour éviter la confusion avec une altitude</li>
<li>Cap/relèvement &lt;100 : deux formes admises en français (« zéro cinq zéro » ou « zéro cinquante »)</li>
<li>Code horaire trafic (« 2 heures », « 9 heures »…) toujours relatif au <b>cap de l'avion</b> (nez = 12h), pas à une orientation fixe</li>
</ul>`},
{t:'Abréviations & sigles courants', html:`
<table>
<tr><th>Sigle</th><th>Signification</th></tr>
<tr><td>ATIS</td><td>Automatic Terminal Information Service</td></tr>
<tr><td>AFIS</td><td>Aerodrome Flight Information Service</td></tr>
<tr><td>AIS</td><td>Aeronautical Information Service</td></tr>
<tr><td>FIS / SIV</td><td>Flight Information Service / Service d'Information de Vol</td></tr>
<tr><td>FIR</td><td>Flight Information Region</td></tr>
<tr><td>VDF / GONIO</td><td>Radiogoniométrie VHF (relèvement donné par un opérateur sol)</td></tr>
<tr><td>H24</td><td>Service continu 24h/24</td></tr>
<tr><td>HX</td><td>Horaires d'ouverture non spécifiés / irréguliers</td></tr>
<tr><td>ABM</td><td>Abeam (par le travers)</td></tr>
<tr><td>OBST</td><td>Obstacle</td></tr>
</table>
<ul>
<li><b>VDF/GONIO</b> nécessite un opérateur radio qui donne un <b>QDM</b> à partir de l'émission de l'aéronef</li>
<li><b>FIS/SIV</b> fournit : météo, trafic, activité des zones réglementées</li>
</ul>`},
{t:'ATIS, VOLMET & infos météo radio', html:`
<ul>
<li>Validité d'un message ATIS : <b>30 minutes</b></li>
<li>Ordre de contact à l'arrivée (terrain avec tour + sol + ATIS) : <b>ATIS → Tour → Sol</b></li>
<li>Prise en compte de l'ATIS collationnée par : « <b>Information [lettre]</b> » (ex : Information Golf)</li>
<li>Diffusion ATIS possible sur fréquence VHF dédiée <b>ou sur une fréquence VOR</b></li>
<li>Infos essentielles données à l'arrivée pour circuit à vue : <b>piste en service, QNH, météo aérodrome</b></li>
<li>Visibilité transmise en <b>mètres si ≤ 5 km</b>, en <b>kilomètres si &gt; 5 km</b> (ex : 12 km → « one-zero kilometers or more »)</li>
<li>Nébulosité METAR : <b>FEW</b> = 1-2/8 ; <b>SCT</b> = 3-4/8 ; <b>BKN</b> = 5-7/8</li>
<li><b>RVR</b> (portée visuelle de piste) : donné en mètres, au point de toucher des roues et en fin de piste</li>
<li>Coefficient de frottement piste (friction coefficient) : <b>20</b> = freinage faible ; <b>45</b> = freinage bon</li>
<li><b>VOLMET</b> : diffusion régulière VHF, extraits METAR/SPECI/SIGMET d'une sélection d'aérodromes</li>
<li>Infos obligatoirement transmises par l'ATS en VFR : activité aviaire au seuil de piste, activité d'une zone R, présence de CB (PAS la disponibilité AVGAS)</li>
</ul>`},
{t:'Phraséologie ATC — roulage, clairances & AFIS', html:`
<ul>
<li><b>Clairance conditionnelle</b> : autorisation liée à un autre trafic (ex : « Behind the landing Cessna, line up and wait behind »)</li>
<li>« Autorisé à rouler pour piste X » = autorisation de traverser <b>toutes les voies de circulation</b>, mais <b>pas les pistes</b> coupant le cheminement (clairance séparée requise)</li>
<li>« Clear for immediate take-off » = s'aligner et décoller <b>sans s'arrêter</b> sur la piste</li>
<li>Sur aérodrome contrôlé, l'autorisation de décollage est donnée <b>au point d'attente</b></li>
<li>Le mot « <b>autorisé</b> » n'est employé que par le <b>contrôleur</b>, uniquement pour <b>décollage/atterrissage</b></li>
<li>Au roulage on dit « <b>maintenir</b> » une position ; « <b>stopper</b> » ne s'utilise que pour l'interruption d'un décollage</li>
<li><b>AFIS n'est pas un contrôleur</b> : le pilote <b>annonce</b> ses actions (roulage, alignement) au lieu de les demander</li>
<li>Sur fréquence d'auto-information partagée (123,500) : le <b>nom de l'aérodrome</b> doit être annoncé à chaque message</li>
<li>Appel initial sur aérodrome non contrôlé : environ <b>5 minutes</b> avant l'arrivée à la verticale</li>
<li>Terrain AFIS hors horaires d'ouverture : utiliser quand même la <b>fréquence AFIS publiée</b> (pas 123,500) pour l'auto-information</li>
<li>Fréquence marquée « (s) » sur carte = fréquence <b>supplétive</b>, à utiliser en cas de brouillage de la fréquence principale</li>
<li>« Dégagez rapidement » = instruction de quitter la piste rapidement</li>
<li>Comptes rendus radio obligatoires sur aérodrome non contrôlé : <b>aligné avant décollage</b>, <b>étape de base</b>, <b>finale</b> (pas avant mise en route ni en montée initiale)</li>
</ul>`}
]},
/* ────────────────── 7. PERFORMANCE HUMAINE ────────────────── */
{
  id:'humain', icon:'🧠', title:'Performance humaine & limitations',
  subs:[
{t:'Hypoxie', html:`
<ul>
<li>= insuffisance O₂ dans le sang → <b>insidieuse</b></li>
<li>Organe le + sensible : <b>cerveau</b> ; 1er effet : <b>euphorie</b> ; sens le + affecté : <b>vision</b></li>
<li>Dégradation dès <b>10 000 ft</b></li>
<li>O₂ obligatoire pilote &gt; 30 min entre <b>FL100–FL130</b></li>
<li>O₂ obligatoire tous au-dessus de <b>FL130</b></li>
<li>Fumeur : +<b>5000 ft</b> d'altitude physiologique</li>
<li>Cyanose (lèvres/ongles bleus) = signe d'hypoxie</li>
<li>Composition de l'air (constante jusqu'aux altitudes des avions légers) : <b>azote 78%</b>, oxygène 21%, gaz rares ~<b>1%</b>, CO₂ ~<b>0,03%</b></li>
<li>Pression atmosphérique = <b>moitié</b> de la valeur MSL (1013 hPa) vers <b>18 000 ft</b></li>
<li>Seuils physiologiques (indicatifs, distincts du seuil réglementaire O₂) : le corps commence à réagir dès <b>~7000 ft</b> ; incapacité à compenser complètement dès <b>~12 000 ft</b></li>
<li>Sensibilité à l'hypoxie dépend de : pression atmosphérique, <b>vitesse de sa baisse</b>, santé individuelle — PAS du taux d'O₂ dans l'air (constant), PAS de la ventilation cabine</li>
<li>Signes précurseurs : <b>somnolence</b>, rétrécissement du champ visuel, maux de tête, ↑ rythme cardiaque (PAS d'élargissement du champ visuel ni d'amélioration des capacités intellectuelles)</li>
<li><b>Hypoxie anémique</b> (hypémique) : sang incapable de transporter l'O₂ (ex : intoxication au CO) même si l'air est normal</li>
<li>Distracteur classique : la <b>plongée sous-marine n'est PAS</b> un facteur de risque d'hypoxie (c'est un facteur de risque d'accident de décompression, sujet distinct)</li>
<li>En altitude, l'organisme compense par ↑ fréquence respiratoire + ↑ fréquence cardiaque</li>
<li>Passager pris de malaise soudain en croisière : ajuster la <b>température cabine</b> et ventiler pour éviter toute accumulation excessive</li>
</ul>`},
{t:'Barotraumatismes', html:`
<table>
<tr><th>Organe</th><th>Plus grave en…</th><th>Parade</th></tr>
<tr><td>Oreille</td><td>Descente</td><td>Valsalva, avaler, bâiller</td></tr>
<tr><td>Sinus</td><td>Descente (sinusite)</td><td>↓ Vz</td></tr>
<tr><td>Digestif</td><td>Montée → syncope</td><td>Libérer les gaz</td></tr>
</table>
<ul>
<li><b>Trompe d'Eustache</b> : équilibre pressions oreille</li>
<li>Rhume → voler le plus <b>bas</b> possible</li>
<li>Manœuvre de <b>Valsalva</b> : pincer les narines + souffler → augmente la pression dans l'oreille moyenne via la trompe d'Eustache pour équilibrer</li>
<li>Douleur d'oreille en descente : réduire la <b>Vz</b> (idéalement ≤ <b>700 ft/min</b>) + avaler sa salive / bâiller</li>
</ul>`},
{t:'Accélérations G', html:`
<ul>
<li><b>G positifs</b> (ressource/virage) : sang vers le bas → <b>voile noir → perte de conscience 5 G</b></li>
<li><b>G négatifs</b> : sang vers la tête → <b>voile rouge → perte de conscience 3 G</b></li>
<li><b>Grey-out</b> (voile gris) : stade progressif précédant le voile noir, dû aux G positifs</li>
<li><b>Red-out</b> : sensation de « vision rouge » lors d'accélérations G négatives</li>
<li>Effets des accélérations sur le corps dépendent de : <b>intensité</b>, <b>durée</b>, <b>vitesse d'installation</b></li>
</ul>`},
{t:'Alcool, médicaments, tabac, CO', html:`
<ul>
<li>Alcool avant vol → <b>interdit</b></li>
<li>Élimination : <b>0,01% / heure</b></li>
<li>Médicaments : consulter médecin aéro (effets secondaires)</li>
<li><b>CO</b> : inodore incolore, source = échappement + chauffage → détecteur obligatoire</li>
<li>Fumée moteur → couper chauffage et ventilation</li>
</ul>`},
{t:'Vision & désorientation', html:`
<ul>
<li>Vue = <b>80%</b> des informations</li>
<li>Vision nocturne : adaptation <b>20–30 min</b> ; dégradée par hypoxie et nicotine</li>
<li>Lunettes pilote : <b>non polarisées</b></li>
<li><b>Désorientation spatiale</b> : contradiction visuel/vestibulaire → se fier aux <b>instruments</b></li>
</ul>
<table>
<tr><th>Illusion approche</th><th>Piste…</th><th>Risque</th></tr>
<tr><td>Plus petite</td><td>→ trop haut</td><td>Approche trop <b>basse</b></td></tr>
<tr><td>Plus grande</td><td>→ trop bas</td><td>Approche trop <b>haute</b></td></tr>
<tr><td>Montante</td><td>→ plus courte</td><td>Trop haute → descend sous plan</td></tr>
</table>
<ul>
<li>Approche par faible luminosité / de nuit → risque de <b>surestimer sa hauteur</b> → plan d'approche trop faible (effet « trou noir »)</li>
<li>Objets peu éclairés (nuit) → paraissent <b>plus éloignés</b> qu'ils ne le sont réellement</li>
<li>Illusions visuelles principalement causées par une <b>mauvaise interprétation du cerveau</b></li>
<li>De nuit, la <b>perception du relief diminue</b></li>
</ul>`},
{t:'Stress & mémoire', html:`
<ul>
<li>Courbe stress-performance : U inversé → stress modéré = optimal</li>
<li>Phases : <b>Alarme → Résistance → Épuisement</b></li>
<li>Stress intense → régression des acquis</li>
<li>MCT : ~ <b>7 éléments</b>, durée <b>10–20 s</b> ; MLT : illimitée</li>
<li>Stress/anxiété affectent : <b>jugement</b>, attention, mémoire, concentration, réactivité</li>
<li>Phase d'alarme (stress sévère) : <b>rétrécissement du champ visuel</b> + dilatation des pupilles + immobilité du regard</li>
<li>MCT : accès <b>immédiat</b> ; MLT : accès plus lent, nécessite souvent un <b>stimulus</b> pour réactiver le souvenir</li>
</ul>`},
{t:'Hyperventilation & fatigue', html:`
<ul>
<li>Hyperventilation (stress) : ralentir la respiration, parler à voix haute</li>
<li>Cyanose = hypoxie (PAS hyperventilation)</li>
<li>Fatigue : ↑ temps réaction, ↓ tolérance hypoxie, <b>s'accumule</b></li>
<li><b>Effet tunnel</b> : concentration excessive → insensible au reste</li>
</ul>`},
{t:'Prise de décision', html:`
<table>
<tr><th>Comportement</th><th>Phrase type</th></tr>
<tr><td>Anti-autoritaire</td><td>« Ne me dites pas quoi faire ! »</td></tr>
<tr><td>Impulsif</td><td>« Vite, faire quelque chose ! »</td></tr>
<tr><td>Macho</td><td>« Regardez comme je suis bon ! »</td></tr>
<tr><td>Résigné</td><td>« C'est foutu de toute façon ! »</td></tr>
<tr><td>Invulnérable</td><td>« Ça n'arrive qu'aux autres ! »</td></tr>
</table>
<ul>
<li>Majorité des accidents : <b>défaillance humaine</b></li>
<li>Plongée bouteilles → attendre <b>24h</b> avant de voler</li>
<li>Gestion du risque = 4 stratégies : <b>éviter, réduire, transférer, accepter</b></li>
<li>Processus de décision : perception → évaluation des options → <b>analyse de risque</b> → décision</li>
<li>Une bonne décision tient compte du <b>savoir-faire</b> disponible ET du temps restant</li>
<li>Meilleure prévention du stress en vol : rester dans son <b>domaine de savoir-faire</b> maîtrisé</li>
<li>Attitudes dangereuses souvent combinées : <b>macho + invulnérabilité</b></li>
<li>Biais d'expectation (voir ce qu'on s'attend à voir) → source d'erreur humaine</li>
<li><b>Anticipation</b> = préparer un maximum d'éléments à l'avance → + de ressources dispo si situation chargée</li>
</ul>`},
{t:'Anatomie, sang & vision détaillée', html:`
<table>
<tr><th>Composant sanguin</th><th>Fonction</th></tr>
<tr><td><b>Globules rouges</b></td><td>Transport O₂ (hémoglobine)</td></tr>
<tr><td>Globules blancs</td><td>Défense immunitaire</td></tr>
<tr><td>Plaquettes</td><td>Coagulation</td></tr>
</table>
<ul>
<li>O₂ dans l'air = <b>21%</b> quelle que soit l'altitude (c'est la pression partielle qui ↓)</li>
<li><b>Temps de conscience utile</b> : temps avant incapacité après dépressurisation, ↓ avec altitude</li>
</ul>
<table>
<tr><th>Élément œil</th><th>Rôle</th></tr>
<tr><td><b>Cônes</b></td><td>Vision couleurs + détails (diurne, centrale)</td></tr>
<tr><td><b>Bâtonnets</b></td><td>Vision nocturne + périphérique (faible lumière)</td></tr>
</table>
<ul>
<li><b>Vision centrale</b> : couleurs + détails ; <b>vision périphérique</b> : mouvement + luminosité</li>
<li><b>Champ visuel</b> ≈ <b>200° horizontal × 130° vertical</b></li>
<li><b>Myopie</b> = mauvaise vision de loin ; <b>Hypermétropie</b> = mauvaise vision de près</li>
<li><b>Erreur de parallaxe</b> : lecture erronée instrument si vue en biais</li>
<li><b>Système nerveux autonome</b> : contrôle respiration, digestion, rythme cardiaque (involontaire)</li>
<li><b>Système nerveux périphérique</b> : nerfs sensitifs + moteurs reliant cerveau ↔ corps</li>
</ul>`},
{t:'Facteurs humains avancés', html:`
<ul>
<li><b>Modèle du fromage suisse</b> (Reason) : accident = alignement de trous dans les barrières de sécurité</li>
<li><b>REX</b> (Retour d'Expérience) : signalement anonyme d'événements → amélioration sécurité</li>
<li><b>Processus cognitif</b> : percevoir → analyser → décider → agir</li>
<li>Personnalité pilote optimale : <b>extraverti-stable</b></li>
<li><b>Changement risqué</b> (risky shift) : en groupe, on accepte + de risque qu'individuellement</li>
<li><b>Complaisance</b> : liée à l'automatisation → ↓ vigilance si vol monotone/automatisé</li>
<li><b>Check-list</b> = aide-mémoire (vérification, pas apprentissage)</li>
<li>Phase mémorisation optimale = phase de <b>résistance</b> au stress</li>
<li><b>Plongée apnée</b> : moins risqué que bouteilles mais effets possibles ; <b>bouteilles → 24h</b></li>
<li><b>Mal des transports</b> : fixer l'horizon, ventiler, éviter mouvements tête brusques</li>
<li><b>Ozone</b> : couche stratosphère protège UV ; irritant si concentré</li>
<li><b>Erreur latente</b> : erreur non détectée pendant longtemps dans le système (à distinguer de l'erreur active/immédiate)</li>
<li><b>Biais de confirmation</b> : préférence pour chercher des arguments confirmant son propre modèle mental</li>
<li><b>Conscience de la situation</b> (situational awareness) : surveillance continue de la situation de vol actuelle</li>
<li>Modèle de communication : l'usage d'un <b>code commun</b> entre émetteur/récepteur est assuré par la phraséologie radio</li>
<li>Le stress peut aussi être déclenché par un <b>évènement heureux</b> (pas uniquement négatif)</li>
<li>Pratiquer un <b>sport régulièrement</b> → réduit la sensibilité aux effets néfastes du stress</li>
</ul>`},
{t:'Charge de travail, automatismes & expérience', html:`
<ul>
<li><b>Schémas mentaux</b> (automatismes) : actions routinières demandant peu d'attention → libèrent des ressources cognitives ; pilote expert ≈ <b>80%</b> de ses actions en schémas</li>
<li>Fonctionnement automatique : normal chez le pilote, mais non surveillé par l'attention → source d'<b>erreurs de routine</b></li>
<li>Excès de confiance : le taux d'accidents <b>augmente</b> après les premières heures d'expérience (rigueur du débutant perdue, sagesse pas encore acquise), puis redescend avec l'expérience</li>
<li>Tolérance individuelle à la charge de travail dépend de : état de santé, connaissances/expérience/savoir-faire, niveau de stress, état de fatigue</li>
<li>Accumulation de tâches dans un <b>temps limité</b> → pénalise la performance (une seule tâche complexe gérable à la fois)</li>
</ul>`},
{t:'Illusions vestibulaires (approfondi)', html:`
<ul>
<li>Oreille interne (canaux semi-circulaires) = organe de l'équilibre ; détecte <b>accélérations</b> et mouvements angulaires — PAS les vitesses stabilisées (même à 250 kt en ligne droite, rien n'est perçu)</li>
<li>Orientation spatiale : contributeurs = <b>yeux + oreille interne</b> (PAS l'estomac, PAS le nez)</li>
<li><b>Illusion somatogravique</b> : accélération en palier → sensation de cabré/montée ; décélération → sensation de piqué/descente</li>
<li><b>Illusion de Coriolis</b> : mouvement de tête pendant un virage → vertige violent</li>
<li>Illusion post-rotatoire (type « graveyard spiral ») : ailes remises à plat après une rotation prolongée → sensation de <b>tourner en sens inverse</b></li>
<li>Mal de l'air (mal des transports) : conflit oreille interne (accélérations inhabituelles) / vue ; aggravé par chaleur, appréhension, repas trop lourd ou trop léger</li>
</ul>`},
{t:'Physiologie complémentaire', html:`
<ul>
<li><b>Alvéoles pulmonaires</b> : lieu des échanges gazeux (O₂ air→sang ; CO₂ sang→air)</li>
<li><b>Sons aigus</b> plus nocifs que les sons graves pour l'oreille interne (cellules ciliées), à court et long terme</li>
<li><b>Hypothermie</b> : baisse anormale de la température interne du corps</li>
<li>Diabète : facteur de risque = <b>surpoids</b></li>
<li><b>Réflexe</b> : réaction involontaire et stéréotypée d'un organisme à la stimulation d'un récepteur</li>
</ul>`}
]},
/* ────────────────── 8. PERFORMANCES VOL & MASSE/CENTRAGE ────────────────── */
{
  id:'perf', icon:'⚖️', title:'Performances vol & masse/centrage',
  subs:[
{t:'Distances décollage & atterrissage', html:`
<ul>
<li>Distance décollage : lâcher freins → <b>15 m (50 ft)</b></li>
<li>Distance atterrissage : seuil à 15 m → arrêt complet</li>
<li>Facteurs : altitude, vent, surface, température, masse, pente</li>
<li>Court : masse ↓, vent de face, piste dure, pente descente, T° basse</li>
<li>Long : masse ↑, vent arrière/nul, herbe, pente montée, T° élevée, altitude élevée</li>
<li><b>Effet de sol</b> : diminue la traînée induite près du sol → <b>diminue</b> la distance de décollage, <b>augmente</b> la distance d'atterrissage (l'avion « flotte » plus longtemps)</li>
<li>Nature de piste (herbe/dur) : affecte uniquement le <b>roulement</b>, pas la pente de montée après décollage</li>
<li>Condition la + favorable au décollage court : piste <b>descendante</b>, en <b>dur</b>, masse faible, vent de face</li>
<li>Condition la + pénalisante : piste <b>montante</b>, en <b>herbe</b></li>
<li>Gradient de vent arrière survenant au décollage : vitesse air <b>diminue</b>, pente de montée <b>diminue</b></li>
<li>Rafale de vent de face survenant en vol stabilisé : portance et vitesse air <b>augmentent</b> transitoirement (inverse pour rafale de vent arrière)</li>
</ul>`},
{t:'Influence du vent', html:`
<table>
<tr><th>Vent</th><th>Décollage</th><th>Pente sol</th><th>Atterrissage</th></tr>
<tr><td>De face</td><td>↓ distance</td><td>↑ pente</td><td>↓ distance</td></tr>
<tr><td>Arrière</td><td>↑ distance</td><td>↓ pente</td><td>↑ distance</td></tr>
</table>
<ul>
<li>Vent n'influence <b>PAS</b> le taux de montée (Vz)</li>
<li>Gradient vent en finale : vent ↓ près du sol → <b>majorer vitesse approche</b></li>
</ul>`},
{t:'Finesse & vol plané', html:`
<ul>
<li class="formula">Finesse = Distance / Hauteur perdue = Portance / Traînée</li>
<li>Panne moteur → vitesse de <b>finesse max</b></li>
<li>Avec vent de face → vitesse <b>supérieure</b></li>
<li>Vitesse approche = <b>1,3 × Vs</b></li>
<li class="formula">Vario (ft/min) = Vitesse sol (kt) × Pente de descente (%)</li>
<li>Règle pratique : <b>1 NM ≈ 6000 ft</b> (pour estimer la distance de plané max = hauteur × finesse)</li>
</ul>`},
{t:'Masse & centrage', html:`
<ul>
<li class="formula">CG = Σ Moments / Σ Masses &nbsp;&nbsp;|&nbsp;&nbsp; Moment = Masse × Bras de levier</li>
<li>Masse max décollage : <b>ne jamais dépasser</b></li>
<li>Masse ↑ → Vs ↑</li>
<li><b>Centrage avant</b> : + stable, − maniable, conso ↑</li>
<li><b>Centrage arrière</b> : − stable, + maniable, conso ↓</li>
<li>CG trop avant → profondeur insuffisante pour rotation</li>
<li>CG trop arrière → avion incontrôlable</li>
<li>Bagages/fret : toujours <b>arrimés</b></li>
<li>CG mesuré le long de l'<b>axe longitudinal</b> ; sa position est <b>variable</b> selon le chargement</li>
<li>Le poids total agit toujours verticalement à travers le <b>CG</b>, en vol comme au sol</li>
<li>Stabilité longitudinale = position du CG par rapport au <b>foyer aérodynamique (point neutre)</b>, assurée par l'empennage horizontal ; le CG doit rester en <b>avant du foyer</b></li>
<li>Limite avant de centrage fixée par le <b>débattement à cabrer</b> de la gouverne de profondeur (rotation/arrondi) ; limite arrière fixée par la stabilité minimale acceptable</li>
<li>Avion à train tricycle : CG normalement situé <b>entre la roulette avant et le train principal</b></li>
<li>Rentrée du train avant (roue se déplaçant vers l'arrière) → CG se déplace vers l'<b>arrière</b></li>
<li>Consommation de carburant en vol : le CG se déplace en s'<b>éloignant</b> de la position du réservoir</li>
<li>Devis correct mais CG très avant → avion <b>très stable, peu maniable</b> ; CG très arrière → <b>très instable, très maniable</b></li>
<li>Pour une masse donnée, il existe un centrage avant maxi <b>et</b> un centrage arrière maxi ; à forte masse, la limite avant peut <b>reculer</b></li>
</ul>`},
{t:'Carburant & réserves', html:`
<table>
<tr><th>Conversion</th><th>Valeur</th></tr>
<tr><td>Densité AVGAS</td><td><b>0,72 kg/l</b></td></tr>
<tr><td>1 USG</td><td>3,785 litres</td></tr>
<tr><td>1 lb</td><td>0,453 kg</td></tr>
</table>
<ul>
<li>Réserve navigation : <b>30 min</b> ; local : <b>10 min</b></li>
<li>Autonomie = carburant / consommation horaire</li>
<li>Distance franchissable max → vitesse de finesse max</li>
<li>Réserve finale <b>vol de nuit</b> : <b>45 min</b> (croisière économique)</li>
<li class="formula">Masse carburant (kg) = Volume (l) × 0,72</li>
<li class="formula">Carburant total requis = Roulage + Voyage (trip) + Contingence (≈5% du trip) + Dégagement + Réserve finale</li>
<li class="formula">Débit maxi acceptable = (Carburant utilisable restant − Réserve) / Temps de vol restant</li>
<li>1 lb = <b>453 g</b> ; kg × <b>2,205</b> = lb</li>
<li>Si masse au parking &gt; masse max au décollage : le carburant brûlé pendant le <b>roulage</b> doit ramener l'avion à la masse maxi avant l'alignement piste</li>
</ul>`},
{t:'Pluie & aquaplanage', html:`
<ul>
<li>Pluie → Vs ↑ → <b>majorer</b> vitesse approche</li>
<li>Aquaplanage : freiner modérément, contrôle aérodynamique</li>
<li>Herbe mouillée → distances ↑ partout</li>
<li>Pluie : <b>Cx</b> (traînée) augmente, <b>Cz</b> (portance) diminue (ruissellement sur le profil de l'aile)</li>
</ul>`},
{t:'Masses détaillées & méthode de calcul', html:`
<table>
<tr><th>Masse</th><th>Définition</th></tr>
<tr><td><b>Masse à vide</b></td><td>Avion + huile + fluides non utilisables</td></tr>
<tr><td><b>Masse en ordre d'exploitation</b></td><td>Masse à vide + équipements fixes + huile plein</td></tr>
<tr><td><b>MZFW</b> (Zero Fuel Weight)</td><td>Masse max sans carburant → limite structurale <b>emplanture</b></td></tr>
<tr><td><b>Charge marchande</b></td><td>Masse transportable (passagers + bagages)</td></tr>
<tr><td><b>Masse max roulage</b></td><td>Masse max pour rouler au sol (&gt; masse max décollage)</td></tr>
</table>
<ul>
<li><b>Datum</b> (point de référence) : point fixe pour tous les bras de levier</li>
<li><b>Marge statique</b> = distance CG → foyer aérodynamique</li>
<li>Marge positive → avion stable ; marge ↓ → moins stable</li>
<li><b>Vx</b> : meilleur angle → franchir obstacle après décollage ; disparaît au plafond</li>
<li><b>Vy</b> : meilleur taux → atteindre altitude rapidement ; toujours &gt; Vx</li>
<li>Vx et Vy IAS : quasiment constantes avec l'altitude ; confluent au <b>plafond pratique</b></li>
<li><b>Altitude pression</b> = altitude lue calage 1013 ; <b>altitude densité</b> = altitude pression corrigée T°</li>
<li><b>Visite prévol</b> : obligation CdB, vérifier état avion + documents + carburant + centrage</li>
<li>Poids à vide et CG à vide déterminés initialement par <b>pesée</b> ; consignés sur la <b>fiche de pesée</b> (jointe au certificat de navigabilité)</li>
<li>Masse à vide de base inclut aussi : huile moteur/unités auxiliaires, extincteurs, pyrotechnie, équipement d'oxygène de secours, équipements électroniques additionnels standards</li>
<li>Masse réelle au décollage = masse à vide en ordre d'exploitation + carburant au décollage + charge marchande</li>
<li>Documents requis pour le devis masse & centrage : manuel de vol, fiche de pesée, carnet de route, poids passagers/bagages, quantité de carburant</li>
</ul>`},
{t:'Distances déclarées de piste', html:`
<table>
<tr><th>Sigle</th><th>Signification</th></tr>
<tr><td><b>TORA</b></td><td>Take-Off Run Available — distance de roulement au décollage disponible</td></tr>
<tr><td><b>TODA</b></td><td>Take-Off Distance Available — TORA + prolongement dégagé (clearway)</td></tr>
<tr><td><b>ASDA</b></td><td>Accelerate-Stop Distance Available — TORA + prolongement d'arrêt (stopway)</td></tr>
<tr><td><b>LDA</b></td><td>Landing Distance Available — distance d'atterrissage disponible</td></tr>
</table>
<ul>
<li>Valeurs publiées sur la <b>carte VAC</b> de chaque aérodrome, par QFU</li>
<li>Toujours vérifier : distance <b>requise</b> (calculée, avec marge) ≤ distance <b>disponible</b> (déclarée)</li>
</ul>`},
{t:'Datum, bras de levier & moment', html:`
<ul>
<li><b>Datum (point de référence)</b> : point fixe déterminé par le constructeur (nez, cloison pare-feu ou plan hélice selon l'avion), origine de tous les bras de levier et moments</li>
<li class="formula">Bras de levier = Moment / Masse</li>
<li>Position du CG exprimable en distance au datum, ou en <b>% de la Corde Aérodynamique Moyenne (CAM/MAC)</b></li>
<li>Moment total <b>supérieur</b> au moment maxi admis (masse &lt; MTOW) → CG trop en <b>arrière</b> ; moment <b>trop petit</b> → CG trop en <b>avant</b></li>
<li>Zone de centrage identifiée par sa distance au point de référence = <b>« position »</b></li>
<li>Sur Cessna 150, la référence des moments est la <b>planche de bord (nez de l'avion)</b></li>
</ul>`},
{t:'Vitesses caractéristiques (badin)', html:`
<table>
<tr><th>Vitesse</th><th>Définition</th></tr>
<tr><td><b>VS1</b></td><td>Décrochage configuration lisse (volets rentrés) — début arc vert</td></tr>
<tr><td><b>VS0</b></td><td>Décrochage configuration atterrissage (volets sortis) — début arc blanc</td></tr>
<tr><td><b>VFE</b></td><td>Vitesse maxi volets sortis — fin arc blanc</td></tr>
<tr><td><b>VNO</b></td><td>Vitesse maxi utilisation normale — fin arc vert</td></tr>
<tr><td><b>VNE</b></td><td>Vitesse à ne jamais dépasser — trait rouge radial, fin arc jaune</td></tr>
<tr><td><b>VA</b></td><td>Vitesse de manœuvre — braquage maxi des gouvernes sans dommage structural</td></tr>
</table>
<ul>
<li>Vitesse de montée à pente max (Vx) toujours <b>inférieure</b> à Vy (écart type ≈ <b>10 kt</b> sur avion-école)</li>
</ul>`},
{t:'Volets & performances', html:`
<ul>
<li>Décollage : braquage volets habituel ≈ <b>10-15°</b>, plus faible qu'à l'atterrissage</li>
<li>Volets ↑ au décollage : Vs ↓ → distance de roulement <b>diminue</b>, mais finesse ↓ → angle/pente de montée après envol <b>diminue</b></li>
<li>Braquage excessif au décollage : gain sur le roulement négligeable (traînée trop forte), pente de montée après envol très faible → certains manuels préconisent le décollage <b>sans volets</b></li>
<li>Volets déconseillés si recherche d'une <b>pente de montée forte</b> après décollage (obstacle sur trajectoire)</li>
<li>Atterrissage : volets ↑ → Vs ↓ → vitesse d'approche (1,3 Vs) ↓ → distance d'atterrissage <b>diminue</b></li>
<li>Décollage à 10° vs 20° de volets : moins de volets → distance décollage plus <b>longue</b> mais pente de montée plus <b>forte</b> (arbitrage distance/pente)</li>
</ul>`},
{t:'Densité de l\'air, altitude & température', html:`
<ul>
<li>Air chaud ou altitude ↑ → densité de l'air ↓ → <b>puissance moteur réduite</b> (moteurs atmosphériques)</li>
<li>Air froid → densité ↑ → puissance moteur <b>plus élevée</b> que d'habitude</li>
<li>Altitude-pression ↑ → distance de décollage <b>augmente</b>, Vx et Vy (meilleur angle et meilleur taux) <b>diminuent tous les deux</b></li>
<li>Vitesse <b>indiquée</b> de rotation/décollage inchangée avec l'altitude, mais vitesse <b>vraie</b> correspondante plus élevée → roulement plus long</li>
<li>« Altitude-densité qui augmente » = <b>densité qui diminue</b> → performances dégradées</li>
<li>À VI constante en montée, la TAS <b>augmente</b> avec l'altitude</li>
<li>En altitude, appauvrir le mélange avant le décollage (recommandation manuel de vol)</li>
</ul>`},
{t:'Autonomie, rayon d\'action & distance franchissable', html:`
<table>
<tr><th>Terme</th><th>Définition</th></tr>
<tr><td><b>Autonomie</b></td><td>Durée de vol maxi possible avec un carburant donné</td></tr>
<tr><td><b>Distance franchissable</b></td><td>Distance maxi parcourue (aller simple) avec un carburant donné</td></tr>
<tr><td><b>Rayon d'action</b></td><td>Distance atteignable avec retour possible sans ravitailler ≈ distance franchissable / 2</td></tr>
<tr><td><b>Délestage</b></td><td>Quantité de carburant nécessaire pour un vol donné</td></tr>
</table>
<ul>
<li class="formula">Autonomie = Carburant utilisable / Consommation horaire</li>
<li class="formula">Distance franchissable = Autonomie × Vitesse sol</li>
<li>Rayon d'action maxi et distance franchissable maxi obtenus à la vitesse de <b>finesse max</b> (régime de croisière <b>économique</b>)</li>
<li>Optimisation de la distance franchissable : vent de face → voler <b>plus vite</b> que la finesse max ; vent arrière fort → voler <b>légèrement plus lentement</b></li>
</ul>`},
{t:'Lecture des abaques de performance', html:`
<ul>
<li>Entrées typiques d'un abaque : <b>OAT</b>, <b>altitude pression</b>, <b>masse</b>, <b>vent</b>, <b>% puissance</b></li>
<li>Sorties : distance décollage/atterrissage, <b>TAS</b>, débit carburant (FF), taux de montée, carburant/distance de montée</li>
<li>Méthode générale : entrer par la <b>température</b> → rejoindre la courbe d'<b>altitude pression</b> → reporter horizontalement → appliquer les <b>facteurs correctifs</b> successifs (masse, vent, surface de piste) → lire le résultat</li>
<li>Abaque masse & centrage (enveloppe) : reporter <b>masse totale</b> (axe vertical) et <b>moment total</b> (axe horizontal) → le point doit tomber <b>à l'intérieur</b> du polygone d'enveloppe</li>
<li>Abaque en <b>% de CAM/MAC</b> : centrage lu par intersection masse/moment en suivant les lignes obliques</li>
</ul>`},
{t:'Composantes de vent — calcul', html:`
<table>
<tr><th>Angle vent/QFU</th><th>Composante face/arrière</th><th>Composante travers</th></tr>
<tr><td>0°</td><td>100%</td><td>0%</td></tr>
<tr><td>30°</td><td>≈ 87%</td><td>≈ 50%</td></tr>
<tr><td>45°</td><td>≈ 70%</td><td>≈ 70%</td></tr>
<tr><td>60°</td><td>≈ 50%</td><td>≈ 87%</td></tr>
<tr><td>90°</td><td>0%</td><td>100%</td></tr>
</table>
<ul>
<li>Angle = différence entre direction du vent et QFU de piste (QFU ×10° = orientation magnétique)</li>
<li>Composante arrière si l'angle entre vent et axe piste (dans le prolongement) dépasse <b>90°</b></li>
</ul>`}
]},
/* ────────────────── 9. PROCÉDURES OPÉRATIONNELLES ────────────────── */
{
  id:'proc', icon:'🚨', title:'Procédures opérationnelles',
  subs:[
{t:'Documents & équipements', html:`
<ul>
<li>À bord tout vol : CDI, CDN, CEN, LSA, manuel de vol, carnet de route</li>
<li>Équipement min vol local : anémomètre, altimètre, compas</li>
<li>Vol de nuit : radio VHF + lampe de poche</li>
<li>Livret cellule : <b>jamais à bord</b></li>
<li>Annexe 6 OACI : régit les opérations <b>commerciales internationales</b> (section I) et l'<b>aviation générale internationale</b> (section II)</li>
<li>Carburant emporté : doit permettre le vol en sécurité + réserve (météo, retards prévus)</li>
<li>Aérodrome de dégagement (diversion) en route : utilisable en cas d'urgence pendant la phase « en route »</li>
<li>Élève pilote solo campagne : <b>carnet de vol</b> + carte d'identité + certificat médical obligatoires à bord</li>
<li>Limitations d'emploi de l'aéronef : trouvées dans le <b>manuel de vol</b> + la <b>fiche de pesée</b></li>
<li>Oxygène obligatoire : plus de <b>30 min entre 10 000 et 13 000 ft</b> ; en permanence <b>au-dessus de 13 000 ft</b></li>
<li>Sans réserve d'oxygène, plafond max utilisable : <b>FL100 / 10 000 ft</b> (≈3000 m)</li>
<li>Enfant de moins de 2 ans : peut être tenu dans les bras d'un adulte avec un système de retenue</li>
<li>Avitaillement en carburant : relier une <b>prise de terre</b> à une partie métallique de l'aéronef (décharge l'électricité statique, évite l'étincelle)</li>
</ul>`},
{t:'Urgences & SAR', html:`
<ul>
<li>Panne moteur → <b>MAYDAY</b> + transpondeur <b>7700</b></li>
<li>ELT en position <b>ARMED</b> avant mise en route</li>
<li>Phases SAR : <b>INCERFA → ALERFA → DETRESFA</b></li>
<li>ALERFA circuit contrôlé : H + <b>5 min</b> après perte contact</li>
</ul>`},
{t:'Givrage', html:`
<ul>
<li>Givrage cellule : <b>interdit</b> sauf avion certifié → quitter la zone sans délai</li>
<li>Givrage hélice → vibrations sévères, projection glace</li>
<li>Givrage carbu : T° <b>-5 à +20°C</b> + humidité → réchauffage carbu</li>
<li>Détection (pas fixe) : baisse RPM progressive</li>
<li>Réchauffage carbu à activer aussi en <b>croisière</b> par temps froid + forte humidité, et avant décollage après un long point fixe dans ces conditions</li>
</ul>`},
{t:'Turbulence de sillage', html:`
<ul>
<li>Apparaît dès la <b>rotation</b>, dure <b>2–3 min</b></li>
<li>Plus dangereuse : avion <b>lourd, lent</b>, atmosphère <b>calme</b></li>
<li>Hélicoptère ≈ gros porteur</li>
<li>Atterrir après gros → toucher <b>après</b> son point de toucher</li>
<li>Roulage derrière avion de ligne : distance min <b>200 m</b></li>
<li>Origine : <b>tourbillons marginaux</b> (compensation de pression en bout d'aile)</li>
<li>Dérive latéralement <b>sous le vent</b>, poussée par la composante de travers — ex. piste 34, vent du 020° → turbulence part vers la <b>gauche</b></li>
<li>Léger vent de travers au décollage d'un avion lourd : la turbulence peut stagner <b>sur/près de la piste</b></li>
<li>Turbulence d'un hélicoptère : risque de <b>perte de contrôle</b> pouvant aller jusqu'à l'accident</li>
</ul>`},
{t:'Feu & urgences', html:`
<ul>
<li>Feu moteur → <b>coupe-feu</b> (coupe carburant), ne pas redémarrer</li>
<li>Feu électrique → couper <b>master switch</b>, se poser vite</li>
<li>Agent extincteur essence : <b>poudre</b> (PAS eau)</li>
<li>Gaz le plus dangereux : <b>CO</b></li>
</ul>`},
{t:'Atterrissage de précaution', html:`
<ul>
<li>Mieux vaut se poser moteur tournant que sans !</li>
<li>Piste en forte pente : atterrir <b>pente montante</b> même avec vent arrière</li>
<li>Approche non stabilisée → <b>remise de gaz</b></li>
<li>Freins chauds → approcher de <b>côté</b></li>
<li>Freins surchauffés : les pneus peuvent <b>éclater</b> (sens radial ou de rotation)</li>
</ul>`},
{t:'Réduction du bruit', html:`
<ul>
<li>Le plus bruyant : <b>hélice</b> (bout de pale)</li>
<li>Réduire : passer au <b>grand pas</b> (↓ RPM)</li>
<li>Éviter virages basse altitude au-dessus villages en montée</li>
<li>Sortir traînées le plus <b>tard</b> possible</li>
<li><b>Noise Preferential Runway</b> : piste privilégiée pour limiter les nuisances ; <b>Low Noise Runway</b> : piste générant le moins de bruit</li>
<li>Masse excédant les normes acoustiques au décollage : autorisé si la low noise runway est utilisée, ou si le CDB juge le respect de la norme dangereux pour la sécurité</li>
<li>Contrôleur impose un décollage vent arrière : le pilote <b>peut refuser</b> et demander à décoller face au vent</li>
<li>Bruit perçu au sol : fonction de la <b>distance</b>, augmente avec le <b>régime moteur</b>, minimal en configuration <b>lisse</b></li>
<li>Minimiser le bruit en approche : approche haute, puissance minimum, sortie du train/volets <b>tardive</b>, éviter tout changement de config/puissance au-dessus d'une zone sensible</li>
<li>Départs à proximité des villages : les contourner, à altitude suffisante</li>
</ul>`},
{t:'Survol de l\'eau & montagne', html:`
<table>
<tr><th>Distance côte</th><th>Équipement</th></tr>
<tr><td>Dans distance plané</td><td>Aucun gilet requis</td></tr>
<tr><td>Au-delà distance plané</td><td><b>Gilets</b> pour tous</td></tr>
<tr><td>&gt; 50 NM</td><td>Gilets + <b>canot</b></td></tr>
</table>
<ul>
<li>Amerrissage : gonfler gilets <b>après</b> avoir quitté l'avion</li>
<li>Vol en montagne : voler côté <b>au vent</b> de la vallée</li>
<li>Passage crête : en <b>palier</b>, trajectoire <b>oblique</b></li>
</ul>`},
{t:'Vol de nuit', html:`
<ul>
<li>Nuit aéro : 30 min après coucher → 30 min avant lever</li>
<li>Conditions : visi ≥ <b>5 km</b>, plafond ≥ <b>1500 ft</b></li>
<li>VFR nuit non local → <b>plan de vol</b> obligatoire</li>
<li>Expérience récente nuit : <b>3 dec + 3 att de nuit / 90 jours</b></li>
<li>Feux position : <b>rouge</b> = gauche, <b>vert</b> = droite, <b>blanc</b> = arrière</li>
<li>Rouge + vert visibles = avion <b>vient vers vous</b></li>
</ul>`},
{t:'Espacement & ELT détails', html:`
<ul>
<li><b>Espacement derrière gros porteur</b> : attendre <b>2 min</b> (même piste) ou <b>3 min</b> (piste sécante)</li>
