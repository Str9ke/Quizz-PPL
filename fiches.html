  <style>
/* ===== Fiches page styles ===== */
.fiches-wrap{max-width:900px;margin:0 auto;padding:0 8px}
/* Category grid */
.fcat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin:10px 0 18px}
.fcat-btn{padding:10px 8px;font-size:.82em;font-weight:700;border-radius:12px;cursor:pointer;border:1.5px solid var(--border-color);background:var(--bg-container);color:var(--text-secondary);transition:all .2s;text-align:center;line-height:1.3}
.fcat-btn:hover{border-color:#667eea;color:#667eea;background:rgba(102,126,234,.06)}
.fcat-btn.active{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-color:transparent}
.fcat-count{display:block;font-size:.72em;font-weight:400;opacity:.7;margin-top:2px}
/* Sub-category pills */
.fsub-row{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px;padding:0 2px}
.fsub-pill{padding:5px 14px;font-size:.76em;font-weight:600;border-radius:20px;cursor:pointer;border:1px solid var(--border-color);background:transparent;color:var(--text-secondary);transition:all .2s;white-space:nowrap}
.fsub-pill:hover{border-color:#667eea;color:#667eea}
.fsub-pill.active{background:#667eea;color:#fff;border-color:transparent}
/* Content card */
.fiche-card{background:var(--bg-container);border:1px solid var(--border-color);border-radius:14px;padding:16px 18px;margin-bottom:14px;line-height:1.55;font-size:.88em}
.fiche-card h3{margin:0 0 10px;color:#667eea;font-size:1.05em;border-bottom:2px solid rgba(102,126,234,.25);padding-bottom:6px}
.fiche-card ul{margin:4px 0 10px 16px;padding:0}
.fiche-card li{margin-bottom:4px;color:var(--text-primary)}
.fiche-card li strong,.fiche-card li b{color:#ffd54f}
body.light .fiche-card li strong,body.light .fiche-card li b{color:#8a5a00}
.fiche-card table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.92em}
.fiche-card th{text-align:left;padding:5px 8px;background:rgba(102,126,234,.12);color:#667eea;font-weight:700;border-bottom:2px solid rgba(102,126,234,.3);font-size:.88em}
.fiche-card td{padding:4px 8px;border-bottom:1px solid var(--border-color)}
.fiche-card td:first-child{font-weight:600;color:var(--text-heading);white-space:nowrap}
.fiche-card code{background:rgba(102,126,234,.12);padding:1px 5px;border-radius:4px;font-size:.9em;color:#bb86fc}
body.light .fiche-card code{color:#5c3d99}
.fiche-card .formula{display:block;background:rgba(102,126,234,.08);border-left:3px solid #667eea;padding:6px 12px;margin:6px 0;border-radius:0 8px 8px 0;font-family:monospace;font-size:.92em;color:#e0e0e8}
body.light .fiche-card .formula{color:#2a2a35}
.fiche-card .warn{color:#ff9800;font-weight:600}
.fiche-card .danger{color:#f44336;font-weight:600}
.fiche-card .ok{color:#4caf50;font-weight:600}
/* Expand/collapse */
.fiche-section{margin-bottom:4px}
.fiche-section-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-question);border:1px solid var(--border-color);border-radius:10px;cursor:pointer;font-weight:700;font-size:.92em;color:var(--text-heading);transition:all .2s;user-select:none}
.fiche-section-hdr:hover{border-color:#667eea;color:#667eea}
.fiche-section-hdr .chevron{transition:transform .25s;font-size:.7em;opacity:.6}
.fiche-section-hdr.open .chevron{transform:rotate(90deg)}
.fiche-section-body{display:none;padding:4px 0 8px}
.fiche-section-body.show{display:block}
/* Search */
.fiche-search{display:flex;gap:8px;margin:10px 0 14px}
.fiche-search input{flex:1;padding:9px 14px;border-radius:20px;border:1px solid var(--border-color);background:var(--input-bg);color:var(--input-text);font-size:.88em;outline:none}
.fiche-search input:focus{border-color:#667eea}
.fiche-search button{padding:8px 18px;border-radius:20px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-weight:700;cursor:pointer;font-size:.85em}
/* Print */
@media print{
  .top-nav-bar,.fcat-grid,.fsub-row,.fiche-search,#themeToggle,footer{display:none!important}
  .fiche-section-body{display:block!important}
  .fiche-card{break-inside:avoid;border:1px solid #ccc}
  body{background:#fff;color:#000}
  .fiche-card li strong,.fiche-card li b{color:#b8860b}
  .fiche-card h3{color:#333}
}
/* progress bar for category */
.fcat-progress{height:3px;background:var(--progressbar-bg);border-radius:2px;margin-top:6px;overflow:hidden}
.fcat-progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:2px;transition:width .3s}
/* Reading time */
.fcat-time{display:block;font-size:.68em;font-weight:400;opacity:.55;margin-top:2px}
.fiches-total-time{text-align:center;font-size:.82em;color:var(--text-secondary);margin:-4px 0 12px;opacity:.7}
.fiches-total-time span{font-weight:700;color:#667eea}
/* TTS Player */
.tts-player{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-container);border:1px solid var(--border-color);border-radius:12px;margin-bottom:14px;flex-wrap:wrap}
.tts-playbtn{width:36px;height:36px;border-radius:50%;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:1.1em;cursor:pointer;flex-shrink:0;transition:background .2s;display:flex;align-items:center;justify-content:center}
.tts-stopbtn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(244,67,54,.35);background:rgba(244,67,54,.1);color:#f44336;font-size:.85em;cursor:pointer;flex-shrink:0}
.tts-progress-wrap{flex:1;min-width:100px;position:relative;height:22px;cursor:pointer}
.tts-track{position:absolute;top:50%;left:0;right:0;height:4px;background:rgba(255,255,255,.12);border-radius:2px;transform:translateY(-50%);pointer-events:none;overflow:hidden}
.tts-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:2px;width:0%;transition:width .2s linear}
.tts-seek{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0}
.tts-time{font-size:.74em;color:var(--text-secondary);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:80px;text-align:center}
.tts-rate-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tts-rate-lbl{font-size:.75em;color:#667eea;font-weight:700;min-width:28px;text-align:right}
.tts-rate-slider{width:70px;cursor:pointer}
.tts-vol-wrap{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tts-vol-icon{font-size:.9em;color:var(--text-secondary)}
.tts-vol-slider{width:58px;cursor:pointer}
.tts-voice-wrap{display:flex;align-items:center;flex-shrink:0;margin-left:2px}
.tts-voice-sel{font-size:.72em;padding:2px 5px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-container);color:var(--text-primary);cursor:pointer;max-width:145px}
  </style>
</head>

  <script>
(function(){
'use strict';

/* ============================================================
   FICHES DATA — 8 major categories, each with sub-categories
   ============================================================ */
const FICHES = [
/* ────────────────── 1. AÉRODYNAMIQUE ────────────────── */
{
  id:'aero', icon:'✈️', title:'Aérodynamique & Principes du vol',
  subs:[
{t:'Forces aérodynamiques & formules', html:`
<ul>
<li>Résultante aérodynamique = somme de toutes les forces aéro, appliquée au <b>centre de poussée</b></li>
<li><b>Portance Rz</b> = ½ρSV²Cz → perpendiculaire au vent relatif</li>
<li><b>Traînée Rx</b> = ½ρSV²Cx → parallèle au vent relatif (opposée au déplacement)</li>
<li>Portance et traînée proportionnelles au <b>carré de la vitesse</b> (V×2 → Rz×4)</li>
<li>Portance ≈ 75 % dépression extrados + 25 % surpression intrados</li>
<li>Vol rectiligne horizontal stabilisé : Portance = Poids ; Traction = Traînée</li>
<li>Traînée totale = traînée parasite + traînée induite</li>
<li>Traînée parasite = forme + frottement + interférence</li>
<li>Traînée induite : tourbillons marginaux (compensation pression aux bouts d'aile)</li>
<li>Traînée induite ↓ quand vitesse ↑ ; traînée parasite ↑ quand vitesse ↑</li>
<li>Traînée totale minimale quand traînée parasite = traînée induite</li>
<li>Forme d'aile à traînée induite minimale : <b>elliptique</b></li>
<li><b>Poids</b> = masse × g (Newtons) — ne pas confondre masse (kg) et poids (force)</li>
<li><b>Charge alaire</b> = poids / surface alaire</li>
<li><b>Foyer</b> : point d'application des variations de portance de l'aile seule (≠ centre de poussée = point d'application de la résultante totale)</li>
<li>Facteur de charge n = <b>portance / poids</b> (poids apparent / poids réel) ; n = <b>1</b> au parking et en VRUH</li>
<li>Montée : Traction = Traînée + <b>composante du poids parallèle à la trajectoire</b> → plus de puissance qu'en palier</li>
<li>Descente moteur réduit / plané : composante du poids parallèle à la trajectoire <b>remplace</b> la traction et équilibre la traînée</li>
<li>Cz dépend de : incidence, forme du profil, état de surface — <b>pas de la vitesse ni de la surface alaire</b></li>
<li>Cx dépend de : incidence, forme du profil, état de surface — <b>pas directement de la vitesse</b> (celle-ci intervient via V² dans la formule de Rx)</li>
<li>Allongement <b>faible</b> → traînée induite plus importante</li>
<li>Traînée d'interférence : générée à l'<b>emplanture</b> (jonction aile-fuselage)</li>
</ul>`},
{t:'Profil d\'aile & écoulement', html:`
<ul>
<li><b>Extrados</b> : air accéléré → dépression (Venturi)</li>
<li><b>Intrados</b> : air ralenti → surpression</li>
<li><b>Bernoulli</b> : Ptotale = Pstatique + Pdynamique = constante</li>
<li>Quand vitesse ↑ → pression statique ↓</li>
<li><b>Point de stagnation</b> : séparation filets d'air → se déplace vers le bas si incidence ↑</li>
<li><b>Point de transition</b> : laminaire → turbulente → se déplace vers l'avant si vitesse ↑</li>
<li><b>Générateurs de vortex</b> : ré-énergisent la couche limite</li>
<li>Corde = bord d'attaque → bord de fuite</li>
<li>Allongement = envergure / corde moyenne</li>
<li><b>Point de séparation</b> : point où l'écoulement décolle de l'extrados, en aval du point de transition</li>
<li>Couche limite <b>laminaire</b> : située entre le point de stagnation et le point de transition</li>
<li>Couche limite <b>turbulente</b> : suit la cambrure du profil jusqu'à des incidences plus élevées que la laminaire (retarde le décrochage)</li>
<li><b>Vrillage géométrique</b> (washout) : incidence décroissante de l'emplanture vers le saumon → conserve l'efficacité des ailerons aux grands angles</li>
</ul>`},
{t:'Incidence, assiette, pente', html:`
<ul>
<li><b>Incidence</b> = corde / vent relatif</li>
<li><b>Assiette</b> = axe longitudinal / horizontale</li>
<li><b>Pente</b> = trajectoire / horizontale</li>
<li class="formula">Assiette = Pente + Incidence</li>
<li>Basse vitesse → grande incidence ; haute vitesse → petite incidence</li>
<li>Manche avant/arrière → variation d'incidence</li>
<li class="formula">Vz (ft/min) = Pente (%) × Vi (kt)</li>
</ul>`},
{t:'Finesse & polaire', html:`
<ul>
<li class="formula">Finesse = Cz/Cx = Portance/Traînée = Distance / Hauteur perdue = Vh / Vz</li>
<li>Finesse max avion léger ≈ <b>10</b></li>
<li>Finesse max <b>invariable</b> avec poids et altitude (seule la vitesse change)</li>
<li>Volets sortis → finesse ↓</li>
<li>Panne moteur → vitesse de finesse max (IAS)</li>
<li>Vent de face en panne → vitesse > Vfinesse max</li>
<li>Polaire : Cz en fonction de Cx ; α₂ = finesse max ; α₃ = puissance nécessaire min</li>
<li>α₀ : incidence de <b>portance nulle</b> sur la polaire</li>
<li>À la finesse max, la traînée ≈ <b>1/10</b> de la portance</li>
</ul>`},
{t:'Décrochage', html:`
<ul>
<li>= dépassement de l'<b>incidence critique</b> → perte brutale de portance</li>
<li>Incidence de décrochage = <b>constante</b> pour un profil donné</li>
<li>Vs varie avec : <b>masse, facteur de charge, volets, puissance</b></li>
<li>Vs IAS <b>constante</b> quelle que soit l'altitude</li>
<li>Vs ↑ si masse ↑ ; Vs ↓ si volets sortis</li>
<li>Vs en virage = Vs × √n</li>
<li>Signes : <b>buffeting</b>, mollesse commandes, avertisseur de décrochage</li>
<li>Aile décroche d'abord à l'<b>emplanture</b> (vrillage préserve ailerons)</li>
<li>Sous la pluie : Vs ↑ → majorer vitesse d'approche</li>
<li>Sortie : diminuer incidence (pousser manche) + augmenter puissance</li>
<li><b>Décrochage dynamique</b> (high speed stall) : dépassement brutal de l'incidence critique à vitesse supérieure à Vs, causé par une variation brutale d'assiette (ressource brusque) sous facteur de charge</li>
<li>Lors d'une <b>ressource</b> : facteur de charge et Vs augmentent ensemble</li>
<li>Deux avions à charges alaires différentes décrochent à la <b>même incidence</b> mais à des <b>vitesses différentes</b></li>
</ul>`},
{t:'Volets & dispositifs hypersustentateurs', html:`
<ul>
<li>But : ↑ portance → ↓ vitesse décollage/atterrissage</li>
<li><b>Volets bord de fuite</b> : ↑ courbure/surface → ↑ Cz ET ↑ Cx → ↓ Vs mais ↓ finesse</li>
<li><b>Volet Fowler</b> : le plus efficace (Cz × 2)</li>
<li><b>Becs / fentes</b> : ↑ incidence de décrochage, moins de traînée que volets</li>
<li>Volets au décollage : ↓ distance roulage MAIS ↓ taux de montée</li>
<li>Remise de gaz full flaps : remettre moteur, rester pleins volets, puis rétracter</li>
<li>Cz lisse ≈ <b>1</b> ; Cz becs + volets sortis ≈ <b>2</b> (ordre de grandeur)</li>
<li>Usage prolongé des hypersustentateurs → ↑ traînée → ↑ puissance nécessaire → ↑ <b>consommation</b></li>
<li>Volets <b>déconseillés</b> au décollage par temps turbulent</li>
</ul>`},
{t:'Virage & facteur de charge', html:`
<table>
<tr><th>Inclinaison</th><th>n = 1/cos φ</th><th>↑ Vs</th></tr>
<tr><td>30°</td><td>1,15</td><td>+7%</td></tr>
<tr><td>45°</td><td>1,41</td><td>+19%</td></tr>
<tr><td>60°</td><td><b>2,0</b></td><td>+41%</td></tr>
</table>
<ul>
<li>Facteur charge virage dépend <b>uniquement de l'inclinaison</b></li>
<li>Virage rate one = 3°/s = 360° en 2 min</li>
<li>Passage palier → virage à V constante : ↑ incidence + ↑ puissance</li>
<li>Facteur charge catégorie normale : <b>+3,8 / −1,5</b> en lisse, <b>+2 / 0</b> volets sortis</li>
<li>Facteur de charge positif max catégorie <b>acrobatique/voltige</b> : <b>+6</b></li>
<li>Inclinaison d'un virage type « rate one » (3°/s) dépend de la <b>TAS</b></li>
</ul>`},
{t:'Stabilité & gouvernes', html:`
<ul>
<li><b>Roulis</b> (axe longitudinal) → ailerons</li>
<li><b>Tangage</b> (axe latéral) → gouverne de profondeur</li>
<li><b>Lacet</b> (axe vertical) → gouverne de direction</li>
<li>Stabilité longitudinale : empennage horizontal + CG en avant du centre de poussée</li>
<li>Stabilité latérale : dièdre, flèche, CG bas</li>
<li>Stabilité directionnelle : dérive verticale</li>
<li><b>Lacet inverse</b> : traînée différentielle ailerons → ailerons différentiels le corrigent</li>
<li><b>Roulis induit</b> : action pied → roulis même côté</li>
<li>Compensateur (trim) : annule l'effort aux commandes</li>
<li><b>Stabilité statique</b> : l'avion revient vers sa position initiale après une perturbation externe</li>
<li>Empennage horizontal (hors config <b>T</b> / <b>V</b>) : reçoit le flux dévié vers le bas par l'aile (downwash) → son incidence est <b>plus faible</b> que celle de l'aile</li>
<li>Équilibrage <b>aérodynamique</b> de la gouverne de direction : diminue les efforts aux commandes</li>
<li>Équilibrage <b>statique</b> des gouvernes : évite le <b>flottement</b> (flutter) de la surface</li>
<li><b>Lacet induit</b> : effet secondaire en lacet quand l'avion est stabilisé en virage, ailerons au neutre (≠ lacet inverse, qui survient pendant l'action sur les ailerons)</li>
</ul>`},
{t:'Centrage & effet de sol', html:`
<ul>
<li><b>Centrage avant</b> : + stable, − maniable, Vs ↑</li>
<li><b>Centrage arrière</b> : − stable, + maniable, risque incontrôlabilité</li>
<li><b>Effet de sol</b> : près du sol → traînée induite ↓ → finesse ↑</li>
<li>Atterrissage : distance ↑ (avion plane plus longtemps)</li>
<li>Décollage : distance ↓</li>
<li>CG en avant de la limite avant : contrôle en tangage <b>insuffisant</b> même à pleine gouverne</li>
<li>CG en arrière de la limite arrière : risque d'<b>incapacité</b> à manœuvrer en tangage</li>
<li>Déflexion de la gouverne de profondeur à la rotation décollage : <b>plus importante</b> si CG avant</li>
<li>Effet de sol au décollage : permet de décoller à vitesse plus faible mais risque de rester en <b>second régime</b> en sortant de l'effet de sol (pleine puissance, montée/accélération impossibles)</li>
</ul>`},
{t:'Hélice & effets moteur', html:`
<ul>
<li>Hélice en moulinet (panne) : génère de la <b>traînée</b></li>
<li>Pas variable le long de la pale : calage ↓ du moyeu à l'extrémité</li>
<li>Hélice vitesse constante : CSU adapte le pas automatiquement</li>
<li>Effets moteur : couple réaction (roulis), souffle hélicoïdal (lacet), effet gyro (tangage)</li>
<li>Cessna en montée → tendance virer → corriger avec <b>pied droit</b></li>
</ul>`},
{t:'Vrille', html:`
<ul>
<li>= décrochage <b>dissymétrique</b> → autorotation + forte perte altitude</li>
<li>Causes : forte incidence + dérapage important</li>
<li>≠ virage engagé : vrille = V faible ; virage engagé = V ↑ rapidement</li>
<li>Sortie vrille à droite : pied <b>gauche</b> à fond, ailerons au <b>neutre</b></li>
</ul>`},
{t:'Atmosphère & vitesses', html:`
<ul>
<li>Azote 78 %, Oxygène 21 %, ρ MSL = <b>1,225 kg/m³</b></li>
<li>Altitude ↑ ou Température ↑ → ρ ↓ → portance et traînée ↓</li>
</ul>
<table>
<tr><th>Vitesse</th><th>Signification</th></tr>
<tr><td>Vs / VSO / VS1</td><td>Décrochage (config atterrissage / lisse)</td></tr>
<tr><td>VFE</td><td>Max volets sortis (fin arc blanc)</td></tr>
<tr><td>VNO</td><td>Max utilisation normale (fin arc vert)</td></tr>
<tr><td>VNE</td><td>Ne jamais dépasser (trait rouge)</td></tr>
<tr><td>Va</td><td>Manœuvre (débattement complet autorisé)</td></tr>
<tr><td>Vx</td><td>Meilleur angle de montée (pente max)</td></tr>
<tr><td>Vy</td><td>Meilleur taux de montée (Vz max)</td></tr>
</table>
<ul>
<li>Approche = <b>1,3 × Vs</b> ; toucher ≈ 1,1 × Vs</li>
<li>Fortes turbulences : structure la plus sollicitée à <b>vitesse élevée</b> + faible charge alaire → ralentir (rester sous Va)</li>
<li>Dépasser la <b>VNE</b> → risque de flottement (flutter) et dommages structuraux</li>
<li>Rafale verticale (bas→haut) sur avion stable : ↑ incidence momentanée → moment piqueur ramène l'avion à l'assiette initiale</li>
<li>Rafale de vent arrière soudaine : avant que la Vsol s'ajuste, l'<b>IAS et la portance chutent</b> temporairement (inertie de la masse)</li>
<li>Vent fort / rafales au sol → majorer la vitesse d'approche (marge turbulence)</li>
</ul>`},
{t:'Spoilers, aérofreins & taxi', html:`
<ul>
<li><b>Aérofreins / Spoilers</b> : ↓ portance, ↑ traînée → ↑ taux descente, freinage au sol</li>
<li>N'influencent pas le cap ; servent en descente et roulage</li>
<li><b>Centre de pression</b> : point d'application de la résultante aéro ≈ <b>25% corde</b></li>
<li>Centre de pression recule si incidence ↓ ; avance si incidence ↑</li>
<li><b>Profil symétrique</b> à incidence nulle → portance <b>nulle</b></li>
<li><b>Facteur de charge en montée</b> &lt; 1 (composante poids sur trajectoire)</li>
<li><b>Elevons</b> : commandes mixtes ailerons + profondeur sur ailes delta</li>
</ul>
<table>
<tr><th>Taxi vent de travers</th><th>Ailerons</th><th>Profondeur</th></tr>
<tr><td>Vent face + gauche</td><td>↑ gauche (manche au vent)</td><td>Neutre ou avant</td></tr>
<tr><td>Vent face + droite</td><td>↑ droite (manche au vent)</td><td>Neutre ou avant</td></tr>
<tr><td>Vent arrière + gauche</td><td>↓ gauche (manche opposé)</td><td>Manche en avant</td></tr>
<tr><td>Vent arrière + droite</td><td>↓ droite (manche opposé)</td><td>Manche en avant</td></tr>
</table>
<ul>
<li>Principe taxi vent de face : manche <b>dans le vent</b> ; vent arrière : manche <b>opposé au vent + en avant</b></li>
</ul>`},
{t:'Turbulence de sillage (wake turbulence)', html:`
<ul>
<li>Générée dès que la <b>portance</b> apparaît : débute à la rotation, cesse au poser de la <b>dernière roue</b></li>
<li>Plus forte derrière un avion : <b>lourd, lent, configuration lisse</b> (sans volets)</li>
<li>Facteurs d'intensité : masse, incidence, vitesse, allongement, configuration de l'aile</li>
<li>Vortex marginaux : s'enroulent du <b>dessous vers le dessus</b> de l'aile (bout d'aile)</li>
<li>D'autant plus dangereuse en <b>atmosphère calme</b> (persiste plus longtemps, pas dispersée par le vent)</li>
<li>Décollage derrière un avion plus gros : décoller <b>après</b> son point de rotation, trajectoire <b>au-dessus et dans le vent</b> de sa trajectoire</li>
<li>Atterrissage derrière un avion plus gros : se poser <b>après</b> son point de toucher des roues</li>
<li>Réduite par : <b>winglets</b> et grand <b>allongement</b></li>
</ul>`}
]},
/* ────────────────── 2. CONNAISSANCE AÉRONEF ────────────────── */
{
  id:'avion', icon:'🔧', title:'Connaissance générale aéronef',

{t:'Cellule & structure', html:`

<li>Facteur de charge n = Portance / Poids (= 1 en palier)</li>
<li>Structure sandwich : 2 peaux + matériau léger → grande rigidité</li>
<li>Limitations cellule (manuel de vol) : masse max, plage de centrage, facteur de charge, Vi max, <b>VA</b> en air turbulent</li>
<li>Parking par vent fort : avion <b>face au vent</b>, roues calées, amarré, gouvernes bloquées</li>
<li>Turbulence : efforts cellule maximaux si <b>Vp élevée + volets sortis + masse faible</b></li>
</ul>`},
{t:'Aile — Géométrie & efforts', html:`
<table>
<tr><th>Terme</th><th>Définition</th></tr>
<tr><td>Extrados / Intrados</td><td>Dessus / dessous aile</td></tr>
<tr><td>Emplanture</td><td>Jonction aile-fuselage (+ grands efforts en vol)</td></tr>
<tr><td>Allongement</td><td>Envergure / corde = B²/S</td></tr>
<tr><td>Dièdre</td><td>Angle aile / horizontal (stabilité roulis)</td></tr>
<tr><td>Vrillage</td><td>Calage + grand emplanture qu'extrémité</td></tr>
</table>
<ul>
<li>En vol : extrados en <b>compression</b>, intrados en <b>traction</b></li>
<li><b>Longeron principal</b> : absorbe efforts de flexion</li>
<li>Winglets : réduisent la traînée induite</li>
<li><b>Calage</b> de l'aile : angle entre la corde et l'axe longitudinal du fuselage (≠ incidence = angle avec le vent relatif)</li>
<li>Réservoirs pleins dans les ailes → <b>réduit</b> le moment de flexion à l'emplanture (poids compense la portance)</li>
</ul>`},
{t:'Moteur 4 temps', html:`
<table>
<tr><th>Temps</th><th>Piston</th><th>Soupapes</th><th>Action</th></tr>
<tr><td>Admission</td><td>↓</td><td>Adm. ouverte</td><td>Aspire mélange</td></tr>
<tr><td>Compression</td><td>↑</td><td>Fermées</td><td>Comprime mélange</td></tr>
<tr><td>Explosion</td><td>↓</td><td>Fermées</td><td>Bougies → seul temps moteur</td></tr>
<tr><td>Échappement</td><td>↑</td><td>Éch. ouverte</td><td>Évacue gaz brûlés</td></tr>
</table>
<ul>
<li>1 explosion tous les <b>2 tours</b> moteur</li>
<li><b>Détonation</b> : octane trop faible, mélange pauvre + forte puissance</li>
<li><b>Auto-allumage</b> : dépôts carbone, points chauds → peut persister après coupure</li>
<li>Arrêt moteur → <b>mixture plein pauvre</b></li>
<li>Point mort haut compression : <b>les 2 soupapes fermées</b></li>
<li>Organes : piston → <b>bielle</b> → <b>vilebrequin</b> (mouvement rectiligne → rotatif) ; <b>segments</b> assurent l'étanchéité du piston</li>
<li>Configurations cylindres : en ligne, <b>à plat</b> (opposés horizontalement, standard avions légers), en étoile (radial, meilleur refroidissement), en V</li>
<li>Nombre de temps du cycle indépendant du nombre de cylindres</li>
<li>Refroidissement principal : <b>par air</b> (ailettes) ; facteur clé = flux d'air hélice → critique à faible Vp/forte puissance (montée, roulage prolongé)</li>
<li>Détonation aussi favorisée par : réchauffage carbu utilisé à forte puissance, dépôts de carbone, <b>MAP élevée + RPM faible</b></li>
</ul>`},
{t:'Carburation & givrage carbu', html:`
<ul>
<li>Carburateur : venturi crée la dépression, gicleur pulvérise l'essence</li>
<li>Dosage optimal : 1g essence / 15g air</li>
<li><b>Riche</b> = trop d'essence → bon refroidissement, surconsommation</li>
<li><b>Pauvre</b> = surchauffe, risque détonation</li>
<li>Altitude ↑ (sans toucher mixture) → mélange <b>s'enrichit</b></li>
<li>EGT pic = mélange optimal → enrichir légèrement après</li>
</ul>
<ul>
<li><span class="danger">Givrage carbu</span> : T° <b>−5°C à +20°C</b> + forte humidité, puissance réduite</li>
<li>Réchauffage carbu : air chauffé via échangeur échappement</li>
<li>Effet sans givrage : RPM ↓ (normal) ; avec givrage : RPM ↑ (glace fond)</li>
<li>Au décollage : réchauffage <b>coupé</b></li>
<li>Avant descente moteur réduit : <b>toujours</b> activer réchauffage</li>
<li>Venturi : chute de température ≈ <b>15°C</b></li>
<li>Moteur à <b>injection</b> : pas de givrage carburateur possible (mais givrage du filtre à air oui)</li>
<li>Réchauffage carbu prolongé au sol/environnement poussiéreux : air non filtré → risque d'endommager le moteur</li>
<li>Correcteur altimétrique = manette de richesse (maintient le mélange constant avec l'altitude)</li>
</ul>`},
{t:'Carburant', html:`
<table>
<tr><th>Propriété</th><th>Valeur</th></tr>
<tr><td>AVGAS 100LL</td><td>Couleur <b>bleue</b>, indice octane 100</td></tr>
<tr><td>Densité</td><td><b>0,72 kg/l</b></td></tr>
<tr><td>20 litres</td><td>≈ <b>14 kg</b></td></tr>
</table>
<ul>
<li><b>Mise à l'air libre</b> : obstruction → arrêt moteur</li>
<li>Aile haute → alimentation par gravité ; aile basse → pompe électrique</li>
<li>Purge au point le plus bas ; eau = liquide incolore au fond</li>
<li>Réservoirs presque vides → absorption humidité max</li>
<li>Ravitaillement : pas de flamme/cigarette, <b>câble de mise à la masse</b> obligatoire</li>
<li>Essence de couleur différente de celle prescrite (ex. rose vs bleu 100LL) : <span class="danger">ne pas utiliser ni mélanger</span></li>
<li>Essence auto (normale) : plus détonante que l'AVGAS → à proscrire</li>
<li>Robinet carburant sur OFF → arrêt moteur ; c'est la <b>1ʳᵉ action</b> en cas de feu moteur confirmé</li>
</ul>`},
{t:'Allumage — Double magnéto', html:`
<ul>
<li><b>2 magnétos</b> indépendantes, <b>2 bougies/cylindre</b></li>
<li>Fonctionnent quand le moteur tourne → <b>indépendantes du circuit électrique</b></li>
<li>Panne alternateur/batterie → <b>aucune incidence</b> sur le moteur</li>
<li>Test magnétos : chute RPM normale → vérifier écart dans limites</li>
<li>Magnétos sur OFF et moteur tourne → fil de masse cassé → <b>DANGER</b></li>
<li>Chaque magnéto alimente <b>une bougie par cylindre</b> (l'autre bougie du même cylindre est sur l'autre magnéto)</li>
<li>Bougies caractérisées par leur <b>indice thermique</b> (capacité à dissiper la chaleur)</li>
<li>Lancement hélice à la main + une magnéto sur marche → <b>risque de démarrage</b> moteur (danger)</li>
</ul>`},
{t:'Hélice — Pas fixe & vitesse constante', html:`
<ul>
<li><b>Pas fixe</b> : RPM commandé par gaz ; rendement variable selon phase de vol</li>
<li>Petit pas → bon décollage ; Grand pas → bonne croisière</li>
<li>Calage <b>diminue</b> du moyeu à l'extrémité</li>
</ul>
<ul>
<li><b>CSU</b> (vitesse constante) : 3 manettes = puissance (MAP) + pas (RPM) + mélange</li>
<li>↑ puissance : 1° ↑ RPM → 2° ↑ MAP</li>
<li>↓ puissance : 1° ↓ MAP → 2° ↓ RPM</li>
<li>Commande plein avant = plein petit pas = RPM max</li>
<li>3 effets secondaires de l'hélice, même sens en rotation : <b>couple de renversement</b> (roulis), <b>souffle hélicoïdal</b> (lacet), effet gyroscopique</li>
<li>Compensés par désaxage du moteur et/ou de la dérive (efficace pour un régime/vitesse donnés, typ. croisière)</li>
<li>Tricycle avec axe hélice dans l'axe longitudinal : pas d'effet gyroscopique notable au cabré/piqué</li>
<li>Descente moteur réduit : hélice « en moulinet » (entraînée par le vent relatif) → régime > ralenti sol</li>
<li>Dégivrage hélice (IFR) : évite les fortes vibrations dues au déséquilibre de masse par givrage partiel des pales</li>
</ul>`},
{t:'Circuit électrique', html:`
<ul>
<li><b>Batterie</b> : DC, démarrage, panne alternateur</li>
<li><b>Alternateur</b> : entraîné par moteur, alimente servitudes en vol</li>
<li><b>Disjoncteur</b> : réenclenchable, protège contre surcharge</li>
<li><b>Fusible</b> : fond → non réutilisable</li>
<li>Panne alternateur → moteur <b>non affecté</b> → couper non-essentiels → écourter vol</li>
<li>Surintensité : réenclencher 1× max ; si ressaute → ne PAS retenter</li>
<li>Unités : tension = <b>volt</b>, puissance = <b>watt</b>, intensité = ampère ; loi d'Ohm U = R×I</li>
<li>Capacité batterie en <b>Ah</b> (ex : 30 Ah = 10 A pendant 3h, ou 3 A pendant 10h)</li>
<li>Démarreur = plus gros consommateur électrique au sol ; usage prolongé → <b>risque incendie</b></li>
<li>Électrolyte (batterie au plomb) = liquide où baignent les plaques</li>
<li><b>Déchargeurs statiques</b> (wicks, bord de fuite) : évacuent l'électricité statique en vol</li>
<li>Magnétos = seul équipement <b>non</b> consommateur (productrices de courant) parmi les « servitudes »</li>
</ul>`},

{t:'Instruments gyroscopiques', html:`
<ul>

<li><b>Conservateur de cap</b> : cap, recaler sur compas toutes les ≈15 min en palier</li>
<li><b>Indicateur de virage</b> : taux + bille (souvent électrique)</li>

{t:'Compas magnétique', html:`

<li>Erreurs en : virages, accélérations, turbulences</li>
<li>Lecture optimale : palier rectiligne stabilisé, sans accélération</li>
<li>Perturbé par : masses <b>ferreuses</b>, objets aimantés, courant <b>continu</b> — PAS par les masses non ferreuses ni la déclinaison</li>
<li>Hémisphère nord, virage à droite depuis le cap Nord : le compas indique d'abord (à tort) un virage vers l'<b>ouest</b></li>
</ul>`},
{t:'Structures, volets & commandes', html:`
<ul>
<li><b>Monocoque</b> : seul le revêtement supporte les efforts (sans longerons)</li>
<li><b>Semi-monocoque</b> : revêtement + longerons + couples + lisses</li>
<li><b>Cantilever</b> : aile sans haubanage (appui uniquement à l'emplanture)</li>
<li><b>Haubans</b> : câbles/tiges renforçant l'aile (aile haubanée)</li>
<li><b>Empennage en T</b> : stabilisateur au sommet de la dérive → risque deep stall</li>
<li><b>Volets de capot (cowl flaps)</b> : modifient flux air moteur → ↑ refroidissement en montée</li>
</ul>
<table>
<tr><th>Dispositif BdA</th><th>Effet principal</th></tr>
<tr><td>Bec (slat)</td><td>↑ incidence décrochage, surface fixe ou mobile</td></tr>
<tr><td>Fente (slot)</td><td>Passage fixe BdA → ré-énergie couche limite</td></tr>
<tr><td>Volet Krueger</td><td>Volet BdA articulé sous l'intrados</td></tr>
</table>
<ul>
<li><b>Anti-balance tab</b> : augmente l'effort aux commandes (contraire du trim)</li>
<li><b>Déport en corne</b> : surface gouverne devant l'axe charnière → réduit effort</li>
<li>3 axes de rotation : <b>roulis</b> (longitudinal), <b>tangage</b> (latéral), <b>lacet</b> (vertical)</li>
<li>Gouvernail (direction) : effet primaire = lacet, effet secondaire = <b>roulis induit</b> (même sens)</li>
<li>Ailerons : effet secondaire = <b>lacet inverse</b> (aile montante = plus de portance donc plus de traînée)</li>
<li>Virage stabilisé : action extérieure sur la commande de roulis nécessaire pour contrer le <b>roulis induit</b> (aile extérieure plus rapide → plus de portance)</li>
<li>Roulage vent de travers : manche <b>orienté face au vent</b> (maintient l'aile au sol, limite l'effet girouette)</li>
</ul>
<table>
<tr><th>Commande moteur</th><th>Couleur standard</th></tr>
<tr><td>Manette des gaz</td><td><b>Noire</b></td></tr>
<tr><td>Commande de pas (hélice)</td><td><b>Bleue</b></td></tr>
<tr><td>Mixture</td><td><b>Rouge</b></td></tr>
<tr><td>Réchauffage carbu</td><td><b>Jaune / Grise</b></td></tr>
</table>`},
{t:'Pannes instruments & lubrification', html:`
<table>
<tr><th>Panne</th><th>Comportement badin</th></tr>
<tr><td>Pitot seul bouché</td><td>→ zéro (plus de Pt)</td></tr>
<tr><td>Pitot + drain bouchés</td><td>IAS <b>figée</b> puis varie comme un altimètre</td></tr>
<tr><td>Statique bouchée</td><td>IAS figée à ancienne valeur</td></tr>
<tr><td>Source statique secours</td><td>P statique cockpit légèrement basse → alti <b>sur-indique</b></td></tr>
</table>
<ul>
<li><b>Manomètre dépression (suction gauge)</b> : vérifie fonctionnement pompe à vide → instruments gyro</li>
<li><b>Ampèremètre</b> charge forte prolongée → risque surchauffe batterie</li>
</ul>
<ul>
<li><b>Huile moteur</b> : triple rôle → <b>lubrification + refroidissement + nettoyage</b></li>
<li>Huile synthétique : meilleure tenue en température</li>
<li>Pression huile basse → <b>atterrir immédiatement</b></li>
<li>T° huile excessive → réduire puissance, enrichir mélange</li>
<li>Humidité ↑ → mélange <b>s'appauvrit</b> (air humide = moins dense)</li>
<li>T° ambiante ↑ → mélange <b>s'enrichit</b> (carburant s'évapore davantage)</li>
<li>Huiles <b>minérales</b> : rodage moteur (50 premières heures) ; huiles <b>dispersantes</b> : usage normal ensuite</li>
<li>Grade huile = <b>viscosité</b> ; mélange possible entre marques si même type/catégorie</li>
<li>Pression huile doit s'établir en <b>&lt; 30 s</b> après démarrage, sinon arrêter le moteur</li>
<li>T° huile élevée + pression <b>basse</b> : fuite/manque d'huile → <b>atterrir</b> au plus vite</li>
<li>T° huile élevée + pression <b>normale</b> : probable panne de l'indicateur → dérouter, faire vérifier</li>
<li>Grand froid (&lt; -10°C) : pression huile élevée au démarrage puis baisse en chauffant (huile visqueuse à froid)</li>
</ul>`},
{t:'Instruments moteur — jauges & limitations', html:`
<table>
<tr><th>Paramètre</th><th>Jauge</th><th>Info clé</th></tr>
<tr><td>EGT</td><td>Température gaz échappement</td><td>Pic = mélange optimal, puis réenrichir</td></tr>
<tr><td>CHT (culasse)</td><td>Température cylindre</td><td>Prise sur le cylindre le moins bien refroidi</td></tr>
<tr><td>Fuel flow</td><td>Débitmètre</td><td>Consommation instantanée (l/h ou gal/h)</td></tr>
<tr><td>MAP</td><td>Pression d'admission</td><td>Indique la puissance sur hélice à calage variable</td></tr>
<tr><td>Tachymètre (RPM)</td><td>Compte-tours</td><td>Indique la puissance sur hélice à calage fixe</td></tr>
</table>
<ul>
<li><b>Totalisateur</b> : carburant consommé cumulé depuis la mise en route</li>
<li>Moteur arrêté, au sol, niveau mer : MAP indique la <b>pression atmosphérique</b> locale (≈30 inHg std)</li>
<li>Voltmètre : tension du réseau de bord ; Ampèremètre : charge/décharge de la batterie</li>
<li>Sur injection : réglage mélange via débitmètre d'abord, affiné ensuite à l'EGT</li>
</ul>`},
{t:'Circuit carburant — composants', html:`
<ul>
<li><b>Pompe mécanique</b> (entraînée par le moteur) alimente en continu ; <b>pompe électrique de gavage</b> pour démarrage/secours</li>
<li><b>Crépine</b> (filtre réservoir) : retient les impuretés en suspension</li>
<li><b>Primer</b> : pompe auxiliaire d'amorçage facilitant le démarrage à froid</li>
<li><b>Flotteur</b> du carburateur : maintient un niveau d'essence constant dans la cuve</li>
<li><b>Gicleur</b> : pulvérise l'essence ; <b>papillon des gaz</b> : régule le débit de mélange admis aux cylindres</li>
<li><b>Jaugeur</b> : indique la quantité restante par réservoir</li>
<li>Carburant <b>inutilisable</b> : quantité non consommable en vol par construction (jauge doit indiquer zéro à ce niveau, norme CS23)</li>
<li><span class="danger">Vapor lock</span> : bulle de vapeur d'essence → désamorçage du circuit par forte chaleur</li>
</ul>`},
{t:'Train d\'atterrissage & freins', html:`
<ul>
<li><b>Train classique</b> : 2 roues principales + roulette de queue orientable</li>
<li><b>Train tricycle</b> : roue avant dirigée au sol via le <b>palonnier</b>, reliée à la gouverne de direction</li>
<li><b>Voie</b> du train : distance entre les axes des roues principales</li>
<li>Freins : présents <b>uniquement sur le train principal</b></li>
<li>Freinage optimal : piste <b>en dur et sèche</b> (eau = pellicule → efficacité très réduite)</li>
<li>Carénage de roue : diminue la traînée, augmente légèrement la masse</li>
<li>Sortie du train en vol : <b>augmente la traînée</b> (aucun effet sur la portance)</li>
</ul>`},
{t:'Vitesses caractéristiques (V-speeds)', html:`
<table>
<tr><th>Vitesse</th><th>Signification</th><th>Repère badin</th></tr>
<tr><td>VS0</td><td>Décrochage config atterrissage (pleins volets)</td><td>Début arc blanc</td></tr>
<tr><td>VS1</td><td>Décrochage lisse</td><td>Début arc vert</td></tr>
<tr><td>VFE</td><td>Vitesse max volets sortis</td><td>Fin arc blanc</td></tr>
<tr><td>VNO</td><td>Max croisière normale (air calme au-delà)</td><td>Fin arc vert / début jaune</td></tr>
<tr><td>VNE</td><td>À ne jamais dépasser</td><td>Trait rouge</td></tr>
<tr><td>VA</td><td>Manœuvre max (limite structurale)</td><td><b>non</b> représentée par une couleur</td></tr>
<tr><td>VLO</td><td>Manœuvre du train (sortie/rentrée)</td><td>non représentée</td></tr>
<tr><td>VLE</td><td>Vol autorisé train sorti</td><td>non représentée</td></tr>
</table>
<ul>
<li>Au-delà de VNE : risque de <span class="danger">flutter</span> → destruction structure, non garantie par le constructeur</li>
</ul>`},
{t:'Matériaux & structure — compléments', html:`
<ul>
<li><b>Limite élastique</b> : au-delà, déformation permanente → pièce à changer (elle ne reprend pas sa forme)</li>
<li><b>Construction en grille</b> (treillis tubulaire) : non autoportante, sans revêtement structural</li>
<li><b>Lisses</b> : raidisseurs longitudinaux du fuselage (rigidifient l'ensemble avec les couples)</li>
<li>Fibre de carbone : matériau composite offrant la meilleure résistance</li>
<li><b>Karman</b> : carénage aérodynamique de raccordement aile-fuselage</li>
</ul>`},
{t:'Empennages & configurations d\'aile — compléments', html:`
<table>
<tr><th>Config. aile</th><th>Particularité</th></tr>
<tr><td>Haute</td><td>Alimentation par gravité ; visibilité vers le haut réduite en virage</td></tr>
<tr><td>Basse</td><td>Meilleure visibilité sol/vol ; nécessite pompe électrique</td></tr>
<tr><td>Médiane</td><td>Meilleure aéro haute vitesse ; longeron traverse le fuselage (réduit volume utile)</td></tr>
<tr><td>Elliptique</td><td>Corde variable sur toute l'envergure</td></tr>
</table>
<ul>
<li><b>Empennage en T</b> : hors du sillage turbulent des ailes (avantage), mais risque de deep stall</li>
<li><b>Empennage dorsal</b> : extension bord d'attaque dérive → fuselage, améliore la stabilité à grand dérapage</li>
<li><b>Élevons</b> (ailes delta) : combinent fonction ailerons + gouverne de profondeur</li>
<li><b>Volet Fowler</b> : recule + augmente la courbure → forte hausse de portance (~double)</li>
<li><b>Volet de courbure</b> classique : modifie le profil au bord de fuite</li>
<li><b>Spoilers/aérofreins</b> : ↑ traînée, ↓ portance → perte d'altitude rapide sans survitesse</li>
</ul>`}
]},
/* ────────────────── 3. MÉTÉOROLOGIE ────────────────── */
{
  id:'meteo', icon:'🌦️', title:'Météorologie',
  subs:[
{t:'Atmosphère & ISA', html:`
<ul>
<li>Troposphère : du sol à la tropopause (<b>11 km / 36 000 ft en Europe</b>)</li>
<li>ISA MSL : <b>15°C, 1013,25 hPa</b></li>
<li>Décroissance ISA : <b>2°C / 1000 ft = 6,5°C / 1000 m</b></li>
<li>Adiabatique sec : <b>1°C / 100 m</b> (3°C/1000 ft)</li>
<li>Adiabatique saturé : ≈ <b>0,5°C / 100 m</b></li>
<li>En montant : P ↓, T ↓, ρ ↓</li>
<li>Composition de l'air : <b>78% azote</b>, <b>21% oxygène</b>, ~1% gaz rares/CO2</li>
<li>Masse d'1 m³ d'air au niveau de la mer (ISA) : <b>1,225 kg</b></li>
<li>Hauteur de la tropopause variable selon la latitude : ≈ <b>8 km aux pôles</b>, ≈ <b>15 km à l'équateur</b> (11 km en standard Europe)</li>
<li>Écart à la température standard noté <b>ISA+n</b> / <b>ISA-n</b></li>
</ul>`},
{t:'Pression atmosphérique', html:`
<ul>
<li>Gradient basses couches : <b>1 hPa / 28 ft</b></li>
<li>Isobares serrées → vent fort</li>
<li><b>Anticyclone</b> : subsidence → beau temps, peu de nuages</li>
<li><b>Dépression</b> : convergence → ascendance → nuages</li>
<li><b>Dorsale</b> : axe hautes pressions ; <b>Thalweg</b> : axe basses pressions</li>
<li><b>Marais barométrique</b> : P ≈ constante, vents faibles et variables</li>
<li><b>Convergence</b> : masses d'air se rapprochant → ascendance → formation de nuages ; <b>divergence</b> : masses d'air s'écartant</li>
<li>Anticyclone en été : temps calme, dissipation des nuages, quelques Cu épars ; grand espacement des isobares → vents faibles/variables, systèmes éoliens locaux</li>
<li>Anticyclone en hiver : vents calmes, zones étendues de <span class="danger">brouillard</span>/stratus élevé persistant</li>
</ul>`},
{t:'Température & humidité', html:`
<ul>
<li>T max journalière : ≈ <b>14h locale</b> (2h après zénith)</li>
<li>T min journalière : ≈ <b>lever du soleil</b></li>
<li><b>Inversion</b> : T augmente avec altitude → couche stable, emprisonne → brouillard</li>
<li><b>Point de rosée</b> : T à laquelle air sature → condensation</li>
<li>Faible écart T / point de rosée → risque brume/brouillard</li>
<li>T ↓ → humidité relative ↑ (écart diminue)</li>
<li>Eau atmosphérique : 3 états possibles — <b>liquide, solide, gazeux</b></li>
<li>Condensation en haute troposphère → libération de <b>chaleur latente</b></li>
<li>Couverture nuageuse → <b>diminue l'amplitude thermique</b> diurne (jour/nuit)</li>
</ul>`},
{t:'Stabilité & convection', html:`
<ul>
<li><b>Stable</b> : particule se refroidit + vite que l'ambiant → redescend → nuages stratiformes (pluie continue)</li>
<li><b>Instable</b> : particule se refroidit − vite → monte → nuages cumuliformes (averses)</li>
<li>Convection max en <b>fin d'après-midi</b> ; stoppée à la tropopause</li>
<li>Atmosphère <b>conditionnellement instable</b> : cumulus imposants, averses isolées de pluie ou d'orages</li>
<li>Dans un nuage (condensation en cours), le refroidissement ralentit à ≈ <b>0,4°C/100m</b> (vs 0,5-0,6°C/100m hors nuage)</li>
<li>Sommet des cumulus souvent limité par une <b>couche d'inversion</b></li>
<li>Convection stoppée par une masse d'air stable ou par la baisse de température en fin de journée</li>
</ul>`},
{t:'Vent', html:`
<ul>
<li>Direction = d'où il vient ; vitesse en <b>kt</b></li>
<li><b>Buys-Ballot NH</b> : vent horaire autour anticyclones, antihoraire autour dépressions</li>
<li>En altitude : // aux isobares ; près du sol : dévié ~<b>30°</b> vers basses pressions</li>
<li>En altitude vs sol : + fort et tourne vers la droite (NH)</li>
<li>Vent de face → basses pressions <b>à droite</b> (NH)</li>
<li>Conversion usuelle : <b>1 m/s ≈ 2 kt</b></li>
<li>Vent donné par un contrôleur référencé au <b>Nord vrai</b>, sauf au décollage/atterrissage (Nord magnétique piste)</li>
<li>Sur les cartes de vent en altitude (&gt; 1500 m) : vent tangent aux <b>isohypses</b> (équivalent des isobares en altitude)</li>
<li>Gradient de vent (cisaillement) dépend de la <b>vitesse du vent</b> et de la <b>rugosité du sol</b></li>
<li>Gradient de vent arrière ressenti à l'atterrissage dépend : masse/surface alaire de l'aéronef, caractéristiques de la masse d'air, imperfections du sol, vitesse du vent</li>
<li>En France, vers 12h UTC, ascendances thermiques préférentielles sur les versants exposés au <b>Sud</b></li>
</ul>`},
{t:'Vents locaux & effet de Foehn', html:`
<table>
<tr><th>Vent</th><th>Quand</th><th>Direction</th></tr>
<tr><td>Brise de mer</td><td>Jour, ciel clair</td><td>Mer → terre</td></tr>
<tr><td>Brise de terre</td><td>Nuit, ciel clair</td><td>Terre → mer</td></tr>
<tr><td>Anabatique</td><td>Jour</td><td>Pente montante</td></tr>
<tr><td>Catabatique</td><td>Nuit</td><td>Descend vallée</td></tr>
</table>
<table>
<tr><th>Vent régional</th><th>Secteur</th><th>Zone</th></tr>
<tr><td>Mistral</td><td>Nord</td><td>Vallée du Rhône</td></tr>
<tr><td>Tramontane</td><td>Nord-Ouest</td><td>Bas-Languedoc</td></tr>
<tr><td>Autan</td><td>Sud-Est</td><td>Central-Pyrénées</td></tr>
</table>
<ul>
<li><b>Foehn</b> : air humide monte (condense + pluie) → sous le vent : air sec et chaud</li>
<li>Sous le vent : <b>altocumulus lenticulaires</b> + <b>rotors</b> (turbulences)</li>
<li><b>Bora</b> : vent catabatique froid de secteur nord-est soufflant sur la mer Adriatique</li>
<li><b>Mistral</b> : accélère en se resserrant dans la vallée du Rhône (effet Venturi) ; lié à une dépression sur l'Italie/l'est et un anticyclone sur l'Espagne/l'ouest</li>
<li><b>Tramontane</b> : souffle aussi sur le Roussillon (en plus du Bas-Languedoc)</li>
</ul>`},
{t:'Nuages', html:`
<table>
<tr><th>Étage</th><th>Altitude</th><th>Nuages</th></tr>
<tr><td>Supérieur</td><td>&gt; 6000 m</td><td>Ci, Cs, Cc (cristaux de glace)</td></tr>
<tr><td>Moyen</td><td>2000–6000 m</td><td>As, Ac</td></tr>
<tr><td>Inférieur</td><td>&lt; 2000 m</td><td>St, Sc, Cu, Ns, Cb</td></tr>
</table>
<table>
<tr><th>Code</th><th>Octas</th></tr>
<tr><td>FEW</td><td>1–2</td></tr>
<tr><td>SCT</td><td>3–4</td></tr>
<tr><td>BKN</td><td>5–7 (= plafond)</td></tr>
<tr><td>OVC</td><td>8</td></tr>
</table>
<ul>
<li><b>Nimbostratus</b> : pluie forte et continue</li>
<li><b>Stratus</b> : très bas → dangereux VFR</li>
<li>Plafond défini à partir de <b>BKN</b> (≥ 5 octas)</li>
<li><b>Surdéveloppement</b> : développement vertical marqué d'un cumulus, avec averses de pluie</li>
<li>Cumulus alignés en <b>rues de nuages</b> (bandes parallèles) : indiquent la direction du vent à leur altitude</li>
<li><b>Stratocumulus</b> : forme aplatie, avec zones sombres</li>
</ul>`},
{t:'Fronts & perturbations', html:`
<ul>
<li>Ordre : <b>front chaud → secteur chaud → front froid → traîne</b></li>
<li><b>Front chaud</b> : Ci → Cs → As → Ns, pluie durable, P ↓</li>
<li><b>Front froid</b> : Cu/Cb, averses/orages, P ↓ puis ↑</li>
<li><b>Traîne</b> : Cu, bonnes visibilités ; traîne active → Cb</li>
<li><b>Occlusion</b> : front froid rattrape front chaud</li>
<li>Perturbation : échelle pays-continent, durée <b>3–6 jours</b></li>
<li><b>Occlusion</b> : l'air chaud (secteur chaud) est systématiquement soulevé ; caractère de <b>front chaud</b> si le froid postérieur grimpe sur le froid antérieur, sinon caractère de <b>front froid</b></li>
<li>Front <b>stationnaire</b> : limite entre deux masses d'air sans déplacement horizontal</li>
<li>Dépression de front polaire : se déplace globalement parallèlement aux isobares du secteur chaud</li>
<li>Passage d'un front chaud actif : pluie durable, vent tournant du <b>Sud vers l'Ouest</b>, pression cesse de baisser, point de rosée en hausse</li>
<li>Passage d'un front froid : pression baisse brièvement puis remonte ; vent tournant au <b>Nord-Ouest</b></li>
<li>Creux (dépression) d'altitude : entrée d'air froid en haute troposphère → baisse du géopotentiel, favorise <b>averses et orages (Cb)</b></li>
</ul>`},
{t:'CB, orages, givrage', html:`
<ul>
<li><b>Cb</b> : cisaillement, turbulence sévère, grêle, foudre, pluie violente</li>
<li>Courants verticaux jusqu'à <b>10 000 ft/min</b></li>
<li>Contourner à <b>≥ 10 NM</b></li>
<li>Cb convectif max <b>fin d'après-midi</b> en été</li>
<li>Front de rafales : vents irréguliers jusqu'à 180° de variation</li>
</ul>
<ul>
<li><span class="danger">Givrage</span> : <b>0°C à −12°C</b> + gouttelettes surfondues</li>
<li><b>Verglas</b> (glace claire) : le plus dangereux</li>
<li>Pluie verglaçante : avant front chaud en hiver</li>
<li>Cycle de vie d'un orage : <b>stade cumulus</b> (courants ascendants dominants) → <b>stade de maturité</b> (forts ascendants ET descendants, précipitations) → dissipation</li>
<li>Conditions obligatoires orage thermique : atmosphère conditionnellement instable + <b>haute température</b> + <b>forte humidité</b> (basses couches)</li>
<li>Cb purement convectif : isolé, bien discernable ; en plaine peut persister après le coucher du soleil puis se dissipe en cours de nuit</li>
<li>Cb orographique : peut se former dès le <b>milieu de journée</b> (plus tôt que le Cb thermique de fin d'après-midi) si la masse d'air est instable</li>
<li>Courants verticaux dans un Cb : typiquement <b>3000-4000 ft/min</b>, valeurs extrêmes observées jusqu'à <b>10 000-11 000 ft/min</b></li>
<li>Passage d'un Cb : vent très irrégulier en direction (jusqu'à 180°) et rafales de <b>30 à 40 kt</b></li>
<li><b>Grêle</b> : peut tomber même <b>sous l'isotherme 0°C</b> (formée en altitude dans le Cb, tombe une fois trop lourde)</li>
<li><b>Grain</b> : violent coup de vent (pas nécessairement de pluie associée)</li>
<li>Foudre : danger principal = <span class="danger">surchauffe/dommages aux parties exposées</span> ; effets possibles : peinture brûlée, perforation de cellule, éblouissement de l'équipage, dégâts radio/électriques ; l'habitacle agit comme une <b>cage de Faraday</b> (protège les occupants)</li>
<li><b>Givre blanc</b> : petites gouttelettes/cristaux de glace sur les bords d'attaque ; <b>glace claire (verglas)</b> : grosses gouttelettes surfondues — la plus dangereuse (épaisse, alourdit et déforme le profil de l'aile)</li>
</ul>`},
{t:'Brouillard & visibilité', html:`
<table>
<tr><th>Type</th><th>Condition</th></tr>
<tr><td>Rayonnement</td><td>Nuit, anticyclone, vent faible, ciel clair → disparaît au soleil</td></tr>
<tr><td>Advection</td><td>Air chaud humide sur sol froid (côtier hiver)</td></tr>
<tr><td>Évaporation</td><td>Air froid sur surface chaude humide</td></tr>
<tr><td>Orographique</td><td>Air humide forcé sur pentes</td></tr>
</table>
<ul>
<li>Brouillard (FG) : visi &lt; <b>1 km</b> ; Brume (BR) : 1–5 km</li>
<li>Lié à anticyclone et dorsale</li>
<li>Brouillard matinal favorisé par : situation <b>anticyclonique</b>, forte humidité, vent faible, ciel <b>clair</b> la nuit (rayonnement)</li>
<li>Brouillard d'évaporation : nécessite un <b>vent nul</b> ; peut se former après des précipitations orageuses sur un sol chaud et humide</li>
</ul>`},
{t:'Messages météo (METAR, TAF…)', html:`
<table>
<tr><th>Message</th><th>Type</th><th>Détail</th></tr>
<tr><td>METAR</td><td>Observation</td><td>Toutes les heures, contient QNH</td></tr>
<tr><td>TAF</td><td>Prévision</td><td>Court 9h / Long 24-30h</td></tr>
<tr><td>SIGMET</td><td>Alerte</td><td>Phénomènes dangereux, FIR</td></tr>
<tr><td>TEMSI</td><td>Prévision</td><td>Carte temps significatif</td></tr>
<tr><td>WINTEM</td><td>Prévision</td><td>Vent & T° en altitude (réf 1013)</td></tr>
<tr><td>VOLMET</td><td>En vol</td><td>METAR série d'aérodromes (VHF)</td></tr>
</table>
<ul>
<li><b>CAVOK</b> : visi ≥ 10 km, pas de nuage &lt; 1500 m, pas de Cb/précip</li>
<li><b>TEMPO</b> : fluctuation &lt; 1h ; <b>BECMG</b> : évolution régulière ; <b>NOSIG</b> : pas de changement 2h</li>
<li>Distinguer METAR du TAF : le <b>QNH</b> n'est que dans le METAR</li>
<li>WINTEM : petite barre = <b>5 kt</b>, grande = <b>10 kt</b>, triangle = <b>50 kt</b></li>
<li>Visibilité METAR : <b>dominante</b> indiquée ; visibilité minimale (+ direction) ajoutée si &lt; 1500 m OU si &lt; 50% de la dominante ET &lt; 5000 m</li>
<li>Direction du vent variable notée <b>dddVddd</b> si la variation dépasse <b>60°</b></li>
<li>SIGMET : peut signaler des phénomènes <b>observés ET/OU prévus</b>, émis pour la FIR/UIR ; exemples de codes : <b>EMBD TS</b> (orages noyés dans la masse), <b>SQL TS</b> (orages en ligne de grains)</li>
<li>CAVOK n'exclut pas la présence de <b>vent fort</b> (le vent n'est pas un critère du CAVOK)</li>
<li>TEMSI EUROC : nouvelle carte toutes les <b>3h</b>, disponible <b>4h</b> avant son heure de validité ; symbolique commune avec la TEMSI France (avec quelques codes propres à la France)</li>
<li>Dossier de vol complet Météo France : cartes <b>TEMSI</b>, cartes des vents à <b>950/850/700 hPa</b>, messages <b>TAF et METAR</b></li>
<li>Image radar = zones de <b>précipitations</b> ; image satellite = couverture nuageuse et lignes de front ; carte du temps de surface = pression MSL réelle + centres de pression + fronts</li>
<li>ATIS : observations (METAR/SPECI) + renseignements opérationnels (piste en service, niveau de transition) d'<b>un seul</b> aérodrome — jamais de TAF</li>
</ul>`},
{t:'Codes METAR AUTO, SPECI & divers', html:`
<table>
<tr><th>Code</th><th>Signification (METAR AUTO)</th></tr>
<tr><td><b>NCD</b></td><td>No Cloud Detected (capteur ne détecte aucun nuage)</td></tr>
<tr><td><b>NDV</b></td><td>No Directional Variation (vent indéterminé)</td></tr>
<tr><td><b>///</b></td><td>Donnée non observable (capteur absent/défaillant)</td></tr>
<tr><td><b>SKC</b></td><td>Sky Clear (ciel dégagé, observé par humain)</td></tr>
</table>
<ul>
<li><b>SPECI</b> = METAR spécial émis lors d'un changement significatif</li>
<li><b>SNOWTAM</b> = NOTAM neige/état piste en hiver</li>
<li>TAF court : valide <b>9h</b>, cycle rédaction <b>3h</b> ; TAF long : <b>24-30h</b></li>
<li>METAR émis toutes les <b>heures</b> (ou 30 min sur gros aérodromes)</li>
<li><b>ATIS</b> : message automatique, par <b>radio VHF + téléphone</b>, identifié par lettre</li>
<li><b>ISA au FL180</b> = <b>500 hPa</b>, T° = −21°C</li>
<li><b>Couche isotherme</b> : T° constante avec l'altitude</li>
<li><b>Conduction</b> : mécanisme principal de chauffage des basses couches par le sol</li>
<li><b>DZ</b> = bruine ; <b>RA</b> = pluie ; <b>SN</b> = neige ; <b>TS</b> = orage ; <b>FG</b> = brouillard</li>
<li><b>Dossier de vol</b> Météo France : METAR, TAF, TEMSI, WINTEM, cartes SWL</li>
<li><b>NSC</b> = No Significant Clouds (pas de nuages &lt; 5000 ft/MSA, pas de CB/TCU) — différent de NCD (capteur ne détecte aucun nuage)</li>
<li><b>GR</b> = grêle ; <b>GS</b> = grésil ; <b>HZ</b> = brume sèche (peu sensible aux variations de température, contrairement au brouillard/brume)</li>
<li><b>VC</b> = au voisinage ("in the vicinity") ; <b>RETS</b> = orages récents</li>
<li>RVR (portée visuelle de piste) : ex. <b>R31/1000U</b> = piste 31, portée 1000 m, tendance <b>U</b> hausse / <b>D</b> baisse / <b>N</b> stable ; RVR variable ex. <b>R22/1100VP1500</b></li>
<li>Température négative précédée de <b>M</b> dans le METAR (ex : M00) ; sur WINTEM, seules les valeurs positives portent le signe <b>+</b>, les négatives n'ont aucun signe</li>
<li><b>SPECI</b> quasi disparu en France : tous les METAR y étant semi-horaires, il n'y a plus de diffusion de SPECI</li>
</ul>`},
{t:'Altimétrie (QNH / QFE / QNE)', html:`
<table>
<tr><th>Calage</th><th>Référence</th><th>Indication</th></tr>
<tr><td>QNH</td><td>Pression ramenée au niveau de la mer</td><td>Altitude (au-dessus du MSL)</td></tr>
<tr><td>QFE</td><td>Pression à l'altitude de l'aérodrome</td><td>Hauteur au-dessus du terrain (<b>0 ft au poser</b>)</td></tr>
<tr><td>QNE</td><td><b>1013,25 hPa</b> (calage standard)</td><td>Niveau de vol (FL)</td></tr>
</table>
<ul>
<li>Vérification altimètre au sol : régler le <b>QNH</b> puis comparer l'indication à l'altitude connue du terrain</li>
<li>Vol en suivant une surface isobare (indication altimètre constante) : la trajectoire réelle dépend de la <b>température</b> de la masse d'air traversée</li>
<li>Air plus <span class="danger">froid</span> que l'ISA → altitude vraie <b>inférieure</b> à l'altitude indiquée (danger au survol du relief) ; air plus chaud que l'ISA → altitude vraie supérieure</li>
<li><b>Niveau de condensation</b> : altitude où une particule ascendante atteint la saturation → base du nuage</li>
</ul>`},
{t:'Masses d\'air & circulation générale', html:`
<ul>
<li>Caractère d'une masse d'air = <b>région d'origine</b> + <b>trajectoire</b> parcourue</li>
<li>Europe centrale : influencée surtout par l'air <b>polaire</b> (froid) et l'air <b>tropical</b> (chaud), qui se rencontrent au <b>front polaire</b></li>
<li>Air arrivant en hiver par la Russie continentale : <b>air polaire continental</b></li>
<li>Vent de sud-ouest sur l'Europe de l'Ouest (venant de l'Atlantique) : advection <b>subtropicale maritime</b></li>
<li>Anticyclones permanents étendus toute l'année : océans vers <b>30°N/S</b></li>
<li>Entre <b>45°N et 60°N</b> : flux dominant d'<b>ouest</b> (explique les vents dominants d'ouest en Europe)</li>
<li>Hémisphère Sud (ex. la Réunion) : circulation inversée, les dépressions tournent en <b>sens horaire</b></li>
</ul>`},
{t:'Turbulence & phénomènes de relief', html:`
<ul>
<li><b>Turbulence thermique</b> : due à la convection (échauffement inégal du sol) ; légère à modérée sous les cumulus</li>
<li><b>Turbulence de frottement</b> (mécanique) : tourbillons dus à la rugosité du sol qui perturbent l'écoulement ; végétation/relief réduit fortement le vent près du sol</li>
<li><b>Turbulence d'onde/rotor</b> : sous le vent d'un relief, modérée à sévère en présence de nuages rotor</li>
<li>Seuil de danger en montagne : effets aérologiques dangereux dès que le vent en crête dépasse <b>20 kt</b></li>
<li>Écoulement perturbé par un obstacle (relief, rideau d'arbres...) jusqu'à environ <b>1/3 de sa hauteur</b> au-dessus de lui</li>
<li><b>Onde orographique</b> : se développe sur un relief allongé avec vent perpendiculaire fort ; peut culminer à une altitude au-dessus du relief ≈ <b>1/3 de la hauteur du relief</b> ; matérialisée par des <b>altocumulus lenticulaires</b> au sommet de l'onde</li>
<li>Vent perpendiculaire à une crête : ascendances au vent, <b>rabattants</b> et turbulence sous le vent</li>
<li><span class="danger">Cisaillement de vent</span> : changement rapide de direction et/ou vitesse (plan horizontal et/ou vertical) ; dangereux près des averses/orages et en approche de vallée avec vent fort perpendiculaire à la crête (variation possible de <b>180°</b> pendant la descente)</li>
<li>Effet Venturi (ex. accélération du Mistral dans une vallée qui se resserre) : la vitesse augmente, la <b>pression et la température diminuent</b></li>
</ul>`}
]},
/* ────────────────── 4. NAVIGATION ────────────────── */
{
  id:'nav', icon:'🧭', title:'Navigation',
  subs:[
{t:'Terre & coordonnées', html:`
<ul>
<li>1° sur méridien = <b>60 NM</b> ; 1' = <b>1 NM</b></li>
<li>1° sur parallèle = 60 × cos(latitude) NM</li>
<li>Méridiens = demi-grands cercles (indiquent Nord vrai)</li>
<li>Seul l'<b>équateur</b> est un grand cercle parmi les parallèles</li>
<li>Rotation Terre : <b>15°/h</b> → 1° = 4 min</li>
<li>Coordonnées géographiques : latitude sur <b>2 chiffres</b> de degrés (00-90) ; longitude sur <b>3 chiffres</b> (000-180) ; minutes/secondes toujours sur 2 chiffres</li>
<li>Pôle Nord géographique : 90°N, longitude conventionnelle <b>00°W</b> (tous les méridiens y convergent)</li>
<li>Circonférence d'un parallèle <b>diminue</b> quand la latitude augmente (maximale à l'équateur, nulle aux pôles)</li>
</ul>`},
{t:'Distances & conversions', html:`
<table>
<tr><th>Conversion</th><th>Valeur</th></tr>
<tr><td>1 NM</td><td>1,852 km</td></tr>
<tr><td>1 ft</td><td>0,3048 m</td></tr>
<tr><td>1 USG</td><td>3,785 litres</td></tr>
<tr><td>1 lb</td><td>0,453 kg</td></tr>
<tr><td>1 kt</td><td>1 NM/h ≈ 0,5 m/s</td></tr>
</table>`},
{t:'Cap, route, déclinaison, dérive', html:`
<ul>
<li><b>Cap</b> = Nord → axe longitudinal ; <b>Route</b> = Nord → trace sol</li>
<li><b>Dérive</b> = cap − route (même référence)</li>
<li><b>Déclinaison magnétique Dm</b> = Nv − Nm (Est = +)</li>
</ul>
<li class="formula">Rm = Rv − Dm &nbsp;&nbsp;|&nbsp;&nbsp; Cm = Rm ± dérive &nbsp;&nbsp;|&nbsp;&nbsp; Cc = Cm − d</li>
<ul>
<li>Dérive max si vent <b>perpendiculaire</b> ; nulle si vent parallèle</li>
<li>Vent de gauche → cap &lt; route</li>
<li>Vent de <b>droite</b> → cap &gt; route (complète : vent de gauche → cap &lt; route)</li>
<li class="formula">Chaîne complète : Rv − dérive = Cv &nbsp;|&nbsp; Cv − Dm = Cm &nbsp;|&nbsp; Cm − d = Cc</li>
<li>Mnémo : « <b>R</b>etranchez <b>V</b>otre <b>D</b>érive <b>C</b>ela <b>V</b>ous <b>D</b>onnera <b>M</b>aintenant <b>C</b>haque mesure du <b>C</b>ap <b>C</b>ompas » (Rv Dérive Cv Dm Cm d Cc)</li>
<li class="formula">Dérive (X) = composante de vent traversier (Vt) × facteur de base : X = Vt × Fb</li>
</ul>`},
{t:'Triangle des vitesses & facteur de base', html:`
<table>
<tr><th>Symbole</th><th>Nom</th><th>Définition</th></tr>
<tr><td>Vi (IAS)</td><td>Vitesse indiquée</td><td>Lue sur anémomètre</td></tr>
<tr><td>Vp (TAS)</td><td>Vitesse propre</td><td>Par rapport à l'air</td></tr>
<tr><td>Vs (GS)</td><td>Vitesse sol</td><td>Par rapport au sol</td></tr>
</table>
<ul>
<li>Vp ≈ Vi + <b>2% par 1000 ft</b></li>
<li>Vs = Vp ± vent effectif (face − / arrière +)</li>
<li class="formula">Facteur de base Fb = 60 / Vp &nbsp;&nbsp;|&nbsp;&nbsp; Temps = Distance × Fb</li>
<li>Règle du soixantième : 1° = 1 NM après 60 NM</li>
<li><b>Vc</b> (vitesse conventionnelle) = Vi corrigée des erreurs d'instrument/position ; écart Vi/Vc jugé négligeable en aviation légère</li>
<li>Correction Vi→Vp précise : + <b>1% par 600 ft</b> d'altitude-pression, + <b>1% par 5°C</b> au-dessus de la température standard</li>
<li>Température standard (ISA) : <b>15°C</b> au niveau de la mer, − <b>2°C par 1000 ft</b></li>
</ul>`},
{t:'Altimétrie (QNH, QFE, FL)', html:`
<table>
<tr><th>Calage</th><th>Indication</th></tr>
<tr><td>QNH</td><td>Altitude (MSL)</td></tr>
<tr><td>QFE</td><td>Hauteur (aérodrome)</td></tr>
<tr><td>1013</td><td>FL (altitude pression)</td></tr>
</table>
<ul>
<li>Conversion FL ↔ altitude : correction = (QNH − 1013) × 28 ft</li>
<li><b>Règle semi-circulaire VFR</b> :</li>
</ul>
<table>
<tr><th>Rm</th><th>FL</th></tr>
<tr><td>000°–179°</td><td>Impair + 5 (35, 55, 75…)</td></tr>
<tr><td>180°–359°</td><td>Pair + 5 (45, 65, 85…)</td></tr>
</table>
<ul>
<li>Altitude = altitude terrain + <b>hauteur</b> (lue au QFE) ; Hauteur = Altitude (QNH) − altitude terrain</li>
<li>QFE toujours <b>&gt; QNH</b> si l'aérodrome est situé sous le niveau de la mer (cas rare hors France)</li>
<li>1 hPa ≈ 28 ft dans les <b>basses couches</b> ; au-delà de quelques milliers de ft, décroissance non linéaire → utiliser plutôt <b>1 hPa ≈ 30 ft</b></li>
<li>À FL constant, en passant d'une zone à QNH fort vers une zone à QNH faible → <b>altitude vraie diminue</b> (« high to low, look out below »)</li>
<li>Niveaux de vol (FL) utilisables seulement <b>au-dessus de 3000 ft ASFC</b> (ou de l'altitude de transition) ; en dessous, toujours piloter en altitude QNH</li>
<li>Marge réglementaire de franchissement d'obstacle : au moins <b>500 ft</b> au-dessus du point culminant, dans un couloir centré sur la route</li>
<li>Altitude de transition par défaut en France : <b>5000 ft</b> (indiquée sur carte 1/1 000 000 si différente, ex. « TA:5500 »)</li>
<li>Pression standard = <b>1013,25 hPa</b> ; un altimètre calé sur 1013,25 hPa indique une <b>altitude-pression</b></li>
</ul>`},
{t:'Cartes aéronautiques', html:`
<table>
<tr><th>Carte</th><th>1 cm =</th><th>Usage</th></tr>
<tr><td>1/500 000</td><td>5 km</td><td>VFR principale &lt; FL115</td></tr>
<tr><td>1/1 000 000</td><td>10 km</td><td>Radionavigation</td></tr>
</table>
<ul>
<li><b>Lambert</b> (conique conforme) : conserve les angles, méridiens = droites</li>
<li><b>Mercator</b> : lignes droites = loxodromies</li>
<li>Mesurer distance sans règle : reporter sur un <b>méridien</b></li>
<li>Aérodrome barré X = désaffecté ; bleu = privé</li>
<li>Échelles complémentaires : 1/100 000 → 1 cm = <b>1 km</b> ; 1/250 000 → 1 cm = <b>2,5 km</b></li>
<li>Plus le <b>dénominateur</b> de l'échelle est petit, plus la carte est précise (mais couvre une zone plus réduite)</li>
<li>Carte OACI 1/500 000 (édition ≥2013) : renseignements aéro jusqu'au <b>FL115 ou 3000 ft ASFC</b> (le plus élevé) ; carte 1/1 000 000 : jusqu'au FL195, points IFR = petits triangles</li>
<li>Sur carte 1/1 000 000, les <b>obstacles</b> ne sont représentés que si leur hauteur dépasse <b>500 ft</b></li>
</ul>`},
{t:'Orthodromie & loxodromie', html:`
<ul>
<li><b>Orthodromie</b> = plus court chemin (grand cercle) → courbe sur Mercator, droite sur Lambert</li>
<li><b>Loxodromie</b> = cap constant → droite sur Mercator, courbe sur Lambert</li>
<li>Méridiens = orthodromies ; Parallèles (≠ équateur) = loxodromies</li>
<li>Un parallèle (hors équateur) est une <b>loxodromie</b> (coupe tous les méridiens à 90°, cap vrai constant)</li>
<li>Orthodromie = loxodromie uniquement si la route suit un <b>grand cercle</b> (méridien ou équateur)</li>
<li>Sur carte Lambert, une droite tracée n'est en toute rigueur ni loxodromie ni orthodromie (écart négligeable sur courte distance) ; le long d'un méridien : droite = loxodromie = orthodromie</li>
</ul>`},
{t:'Heures & nuit aéronautique', html:`
<ul>
<li>France hiver : UTC + 1 ; été : UTC + 2</li>
<li><b>Nuit aéro</b> : 30 min après coucher → 30 min avant lever du soleil</li>
<li>Le soleil se couche plus tôt à l'Est</li>
<li>Écart d'heure = différence de longitude (°) ÷ 15, ou × <b>4 min par degré</b> ; le Soleil se couche plus tôt à l'<b>Est</b></li>
<li>Heure d'été en France : du dernier week-end de mars au dernier week-end d'octobre (UTC+2) ; heure d'hiver le reste de l'année (UTC+1)</li>
</ul>`},
{t:'Navigation estime & cheminement', html:`
<ul>
<li><b>Estime</b> : cap + durée pour rejoindre un point</li>
<li><b>Cheminement</b> : suivre repères au sol</li>
<li>En pratique : estime contrôlée par cheminement (~15 min)</li>
<li>Bons repères : voies ferrées, autoroutes, rivières, grandes villes</li>
<li>Manche à air : chaque bande ≈ <b>5 kt</b> ; horizontale = &gt; <b>25 kt</b></li>
<li><b>Relèvement</b> = angle Nord → direction d'un repère (référence Nord ; à distinguer du gisement, référencé au cap avion)</li>
<li><b>Erreur systématique</b> = décaler volontairement sa route d'un angle connu pour savoir de quel côté se trouve le repère à l'arrivée</li>
<li>Repères recommandés : montagne → sommets/flancs (pas fond de vallée) ; forêt → rivières, grandes routes, lignes HT (pas les chemins) ; agricole → voies ferrées, grandes villes (pas hameaux)</li>
<li>GPS : temps de vol estimé (ETA) basé sur la <b>vitesse sol instantanée</b>, n'anticipe pas un changement de vent sur les tronçons suivants</li>
</ul>`},
{t:'Consommation & autonomie', html:`
<ul>
<li>Consommation étape = conso horaire × temps de vol</li>
<li>Réserve réglementaire : <b>30 min</b> (navigation) / <b>10 min</b> (local)</li>
<li>Distance franchissable = distance max avec le carburant</li>
<li>Rayon d'action = aller-retour max</li>
<li><b>Délestage</b> = consommation de carburant sur une distance donnée</li>
<li class="formula">Carburant total ≈ (roulage/intégration) + (temps de vol × conso horaire) + réserve réglementaire</li>
</ul>`},
{t:'Radionavigation VOR, ADF, DME, GPS', html:`
<table>
<tr><th>Système</th><th>Bande</th><th>Indique</th></tr>
<tr><td>VOR</td><td>VHF (111–118 MHz)</td><td>Radial (QDR) / QDM</td></tr>
<tr><td>NDB/ADF</td><td>MF/LF (180–1750 kHz)</td><td>Gisement (relatif au cap)</td></tr>
<tr><td>DME</td><td>UHF</td><td>Distance oblique</td></tr>
<tr><td>GPS</td><td>Satellite</td><td>Position, Vs, heure UTC</td></tr>
</table>
<ul>
<li class="formula">QDM = Cap + Gisement &nbsp;&nbsp;|&nbsp;&nbsp; QDR = QDM + 180°</li>
<li>VOR CDI déviation complète = <b>10°</b></li>
<li>Portée VOR : D = 1,23 × √H (H en ft, D en NM)</li>
<li>GPS : min <b>4 satellites</b> pour position 3D ; <b>RAIM</b> = contrôle intégrité</li>
<li>Ondes électromagnétiques : vitesse ≈ <b>300 000 km/s</b></li>
<li>LF/MF (NDB) : propagation par onde de <b>sol</b> et onde de <b>ciel</b> ; VHF (VOR) : onde <b>spatiale</b> quasi-optique (portée = ligne de vue directe)</li>
<li>Principe VOR : comparaison de <b>phase</b> de deux signaux</li>
<li>Après centrage de l'aiguille (OBS) : en <b>FROM</b> → on lit le radial (QDR) ; en <b>TO</b> → on lit le QDM</li>
<li>Interception d'un radial : angle classique de <b>30°</b> (jusqu'à 45° si loin de la station)</li>
<li>DME = mesure de <b>temps</b> de propagation ; distance <b>oblique</b> (jamais horizontale), écart croissant à l'approche verticale de la station</li>
<li>Effet de rivage (NDB) : erreur de gisement maximale à incidence rasante sur la côte, sous 6000 ft</li>
<li>Portée NDB (LF/MF) meilleure de <b>jour</b> ; nuit et lever/coucher du soleil = ionisation, erreurs de gisement accrues (« effet de nuit »)</li>
<li>ADF utilisable jour/nuit mais peu fiable par orage ou lever/coucher du soleil</li>
<li><b>BFO</b> = touche pour écouter l'identification morse d'une balise NDB</li>
<li>GPS : <b>3 satellites</b> minimum pour une position 2D, <b>4</b> pour position 3D + altitude ; précision dégradable par erreur d'horloge satellite</li>
<li>GPS perturbé principalement par : panne d'horloge satellite, absence d'antenne déportée (pas par le relief, les nuages ou la vitesse de l'avion)</li>
<li>Info <b>BRG</b> (bearing GPS) = relèvement vers le waypoint ; comparer BRG et <b>TRK</b> (route suivie) pour savoir de quel côté virer</li>
<li>GPS portable non certifié = simple aide (non homologué), peut créer des interférences avec les équipements de bord</li>
<li>Vol sans repère visuel sol/eau (VFR "on top") : VOR, radiocompas ou <b>GPS homologué</b> obligatoire à bord</li>
<li>VOR-DME = symbole encadré + mention <b>(D)</b> dans le cartouche</li>
</ul>`},
{t:'Transpondeur', html:`
<table>
<tr><th>Code</th><th>Signification</th></tr>
<tr><td><b>7000</b></td><td>VFR non contrôlé</td></tr>
<tr><td><b>7500</b></td><td>Intervention illicite</td></tr>
<tr><td><b>7600</b></td><td>Panne radio</td></tr>
<tr><td><b>7700</b></td><td>Détresse</td></tr>
</table>
<ul>
<li>Mode C : transmet altitude pression (réf. 1013)</li>
<li>Afficher 7000 + ALT dès déplacement au sol</li>
<li>Chiffres : <b>0 à 7</b> uniquement</li>
<li>Position <b>Stand-by</b> = sous tension, aucune émission de code ni d'altitude</li>
<li>Fonction <b>IDENT</b> : à utiliser uniquement sur demande du contrôleur</li>
<li>Transpondeur mode C <b>obligatoire</b> pour pénétrer un espace aérien de classe <b>D</b> en France</li>
</ul>`},
{t:'RMI, VDF & radar', html:`
<ul>
<li><b>RMI (Radio Magnetic Indicator)</b> : combine cap magnétique + aiguille(s) pointant vers la station</li>
<li>Lecture : pointe aiguille = <b>QDM</b> (relèvement vers station) ; queue = <b>QDR</b></li>
<li>Gisement = QDM − Cap magnétique</li>
<li>Position : intersection de 2 QDM ou 2 QDR depuis stations différentes</li>
</ul>
<ul>
<li><b>VDF (Goniomètre)</b> : station sol détermine la direction de l'avion → fournit <b>QDM/QDR/QTE</b></li>
<li>Demander un QDM par radio → le contrôleur donne le cap pour rejoindre la station</li>
<li>Classes de précision : A (±2°) → D (±10°)</li>
</ul>
<ul>
<li><b>Radar primaire</b> : détecte écho réfléchi, donne position + distance, <b>PAS d'altitude</b></li>
<li><b>Radar secondaire (SSR)</b> : interroge transpondeur → code + altitude (mode C/S)</li>
<li>Mode S : transmission données + identification automatique</li>
<li>Gisement compté <b>0°-360° dans le sens horaire</b> depuis l'axe avion (droite = positif) — piège classique : repère à 45° à gauche = gisement <b>315°</b></li>
<li>Si la centrale de cap d'un RMI tombe en panne, le <b>gisement reste correct</b> quel que soit le cap affiché</li>
<li>Radar primaire perturbé par : vol à <b>basse altitude</b>, relief, cumulonimbus, 2 avions proches l'un de l'autre ; portée meilleure si la cible vole <b>haut</b> (relief/rotondité Terre masquent les avions bas)</li>
<li>Guidage radar (contact VHF obligatoire) : en <b>IFR</b>, le contrôleur assure séparation et franchissement d'obstacles (mode C requis) ; en <b>VFR</b>, il ne donne que des caps, le pilote reste responsable du franchissement d'obstacles</li>
<li>Fréquence VDF = souvent la même que la fréquence tour</li>
</ul>`},
{t:'Terre, symboles cartes & NOTAM', html:`
<ul>
<li>Forme de la Terre = <b>ellipsoïde</b> (géoïde aplati aux pôles)</li>
<li>Circonférence Terre = <b>21 600 NM</b> = 40 000 km</li>
<li><b>Tropique du Cancer</b> = 23,5°N ; <b>Tropique du Capricorne</b> = 23,5°S</li>
<li><b>Cercle polaire</b> = 66,5°N/S</li>
<li><b>Crépuscule civil</b> : soleil entre 0° et 6° sous l'horizon</li>
</ul>
<table>
<tr><th>Symbole carte OACI</th><th>Signification</th></tr>
<tr><td>× barré</td><td>Aérodrome désaffecté</td></tr>
<tr><td>Bleu/violet</td><td>Aérodrome privé</td></tr>
<tr><td>Vert (piste VAC)</td><td>Piste en herbe / non revêtue</td></tr>
<tr><td>Triangle + ligne</td><td>Vélisurface (vol à voile)</td></tr>
<tr><td>Relief &gt; 11 500 ft</td><td>Teinte bleue sur carte OACI</td></tr>
</table>
<ul>
<li><b>VAC</b> (Visual Approach Chart) : carte d'approche à vue, procédures locales</li>
<li><b>NOTAM</b> (Notice to Airmen) : informations temporaires (travaux, activités, restrictions)</li>
<li>NOTAM consultables sur le <b>site du SIA</b> avant chaque vol</li>
<li><b>Composante traversière</b> = Vvent × sin(angle vent/piste)</li>
<li><b>Vent effectif</b> = Vvent × cos(angle vent/piste)</li>
<li>Notation « CTR CAEN D 1500 » : classe D, plafond exprimé en <b>altitude</b> (QNH) — piège fréquent, ce n'est pas une hauteur au-dessus de l'aérodrome</li>
<li>Notation « R xxx B 1500 ASFC » : zone réglementée, plafond 1500 ft <b>au-dessus du sol</b> ; signe <b>+</b> = plafond au-delà de la couverture carte (FL115/3000 ASFC)</li>
<li>Une seule altitude/hauteur indiquée pour une zone = la zone commence <b>au sol</b>, le chiffre est le plafond</li>
<li>Horaires d'activité d'une zone réglementée (R) : consulter le <b>complément aux cartes de radionavigation VFR</b> (ou AIP/SIA)</li>
<li><b>WGS 84</b> = modélisation du globe compatible GPS, mentionnée en légende de carte</li>
<li><b>SIV</b> = secteur d'information de vol</li>
<li>Sigles VAC : <b>ASI</b> = aire à signaux ; <b>SDE</b> = seuil décalé</li>
<li>Points de compte-rendu : triangle <b>noir</b> = obligatoire, triangle <b>blanc</b> = facultatif</li>
<li>QFU préférentiel = numéro de piste <b>entouré d'un cercle</b> sur la carte VAC</li>
<li><b>LDA</b> (Landing Distance Available) = distance d'atterrissage disponible, colonne dédiée sur la VAC</li>
<li>Tour de piste hélico noté ex. « 900 (500) » = 900 ft AMSL, soit 500 ft <b>AAL</b></li>
</ul>`},
{t:'Compas magnétique, pôles & déviation', html:`
<ul>
<li>Pôle Nord <b>magnétique</b> ≠ pôle Nord géographique : décalé de plusieurs centaines de km, sa position <b>varie dans le temps</b> (pôle géographique fixe, axe de rotation Terre)</li>
<li>Le QFU (numéro de piste) peut être <b>renuméroté</b> si la déclinaison magnétique locale évolue avec le temps</li>
<li><b>Déviation compas</b> = angle entre Nord compas et Nord magnétique ; due aux masses métalliques/champs électriques de l'avion (perturbée par les équipements électroniques)</li>
<li>Erreur maximale tolérée du compas : <b>10°</b> (jusqu'à 15° si la radio émet)</li>
<li>Inclinaison (plongée) de l'aiguille du compas <b>minimale à l'équateur magnétique</b></li>
<li><b>Isogone</b> = ligne reliant les points de même déclinaison magnétique ; <b>agonique</b> = ligne de déclinaison <b>nulle (0°)</b></li>
<li>Déclinaison magnétique : varie de <b>0° à 180°</b>, Est (Nm à droite du Nv) ou Ouest (Nm à gauche)</li>
<li>Maintenir un <b>cap compas constant</b> longtemps ≈ suivre une loxodromie (approximation PPL, vent nul)</li>
</ul>`},
{t:'Symboles graphiques des cartes VFR', html:`
<table>
<tr><th>Symbole</th><th>Signification</th></tr>
<tr><td>Ligne noire à courts traits perpendiculaires</td><td>Voie ferrée (double trait = double voie)</td></tr>
<tr><td>Ligne double bistre (brun clair)</td><td>Autoroute</td></tr>
<tr><td>Ligne noire avec petits carrés aux extrémités</td><td>Téléphérique</td></tr>
<tr><td>Ligne noire continue simple</td><td>Ligne à haute tension</td></tr>
<tr><td>Trait rouge pointillé</td><td>Limite latérale d'une zone R</td></tr>
<tr><td>Trait bleu clair / bleu foncé</td><td>Limite classe E / limite classe B-C-D</td></tr>
<tr><td>Triangle rouge</td><td>Aérodrome avec approche IFR (terrain non contrôlé, AFIS)</td></tr>
<tr><td>Cercle blanc sur fond rouge (sur une installation)</td><td>Survol interdit à moins de 1000 ft</td></tr>
<tr><td>Trait continu + points rouges</td><td>Parc ou réserve naturelle étendue</td></tr>
<tr><td>Petit trait noir isolé</td><td>Barrage</td></tr>
<tr><td>Symbole bleu foncé (aérodrome)</td><td>Piste en dur, usage civil, souvent aérodrome privé</td></tr>
<tr><td>Lettre A sous le nom d'un aérodrome</td><td>Altiport</td></tr>
</table>
<ul>
<li>Nombres sous le nom d'un aérodrome (ex. « 411 / 123.0 ») = <b>altitude terrain</b> / fréquence TWR-AFIS-A/A</li>
<li>Obstacle/antenne : nombre en <b>gras</b> = altitude du sommet ; nombre entre parenthèses = <b>hauteur</b> au-dessus du sol</li>
</ul>`}
]},
/* ────────────────── 5. RÉGLEMENTATION ────────────────── */
{
  id:'regl', icon:'📋', title:'Réglementation',
  subs:[
{t:'OACI & Convention de Chicago', html:`
<ul>
<li>Convention signée <b>7 déc. 1944</b> à Chicago. Siège : <b>Montréal</b></li>
<li>Promulgue SARPS (Normes et Pratiques Recommandées) = Annexes</li>
<li>Annexes clés : 1 = licences, 4 = cartes, 8 = navigabilité, 13 = enquêtes, 14 = aéroports</li>
<li>En haute mer → règles <b>OACI</b></li>
<li>Art. 10 : sauf autorisation, tout aéronef entrant/sortant d'un État doit passer par un <b>aérodrome douanier</b></li>
<li>Art. 29 : documents à bord en navigation internationale : CDI, CDN, licences équipage, carnet de route, licence station radio, liste passagers, manifeste fret</li>
<li>Art. 33 : reconnaissance mutuelle des licences/certificats entre États si leurs normes sont ≥ minima OACI</li>
<li>Art. 36 : chaque État peut interdire/réglementer les <b>appareils photo</b> à bord au-dessus de son territoire</li>
<li>Souveraineté d'un État sur son espace aérien = régions terrestres + eaux territoriales (jamais la haute mer)</li>
</ul>`},
{t:'Espaces aériens (A→G)', html:`
<table>
<tr><th>Classe</th><th>VFR</th><th>Clairance</th><th>Radio</th><th>Sép. VFR/IFR</th></tr>
<tr><td><b>A</b></td><td class="danger">Interdit</td><td>—</td><td>—</td><td>—</td></tr>
<tr><td><b>B</b></td><td>Oui</td><td>Oui</td><td>Oui</td><td class="ok">Oui</td></tr>
<tr><td><b>C</b></td><td>Oui</td><td>Oui</td><td>Oui</td><td class="ok">Oui</td></tr>
<tr><td><b>D</b></td><td>Oui</td><td>Oui</td><td>Oui</td><td>Info trafic</td></tr>
<tr><td><b>E</b></td><td>Oui</td><td>Non</td><td>Non</td><td>Non</td></tr>
<tr><td><b>G</b></td><td>Oui</td><td>Non</td><td>Non</td><td>Non</td></tr>
</table>
<ul>
<li><b>P</b> = interdite ; <b>D</b> = dangereuse ; <b>R</b> = réglementée</li>
<li>Classe D hors horaires → rétrogradée en G</li>
<li>CTR = zone contrôle (sol → limite sup.)</li>
<li>Classe <b>B</b> : seule classe où le contrôle sépare aussi les vols <b>VFR entre eux</b></li>
<li>Classe <b>C</b> : IFR séparés des IFR et des VFR ; entre VFR, seulement <b>information de trafic</b></li>
<li>Classe <b>E</b> : espace contrôlé, mais clairance et contact radio non requis en VFR si <b>VMC</b> maintenues</li>
</ul>`},
{t:'Conditions VMC', html:`
<table>
<tr><th>Situation</th><th>Visi</th><th>Dist. nuages</th></tr>
<tr><td>Contrôlé &lt; FL100</td><td><b>5 km</b></td><td>H:1500m V:300m</td></tr>
<tr><td>Contrôlé ≥ FL100</td><td><b>8 km</b></td><td>H:1500m V:300m</td></tr>
<tr><td>Non contrôlé sous surface S</td><td><b>1500 m</b></td><td>Hors nuages, vue surface</td></tr>
</table>
<ul>
<li><b>Surface S</b> = max(3000 ft AMSL, 1000 ft ASFC)</li>
<li><b>VFR spécial</b> (CTR seulement) : visi ≥ 1500 m, hors nuages, vue surface</li>
<li>Sous la surface S, hors espace contrôlé : visi ≥ <b>1500 m</b> (ou 30 s de vol) si vitesse &lt; <b>140 kt</b> ; visi ≥ <b>5 km</b> si &gt; 140 kt</li>
<li><b>Plafond</b> = base de la couche nuageuse la plus basse couvrant plus de la moitié du ciel sous 20 000 ft</li>
<li>VFR spécial déclenché en CTR si visi &lt; <b>5 km</b> ou plafond &lt; <b>1500 ft</b> ; minimum absolu <b>1500 m</b> hors nuages et vue du sol ; inexistant de nuit</li>
</ul>`},
{t:'Hauteurs min. de survol', html:`
<table>
<tr><th>Situation</th><th>Hauteur min</th></tr>
<tr><td>Rase campagne</td><td><b>150 m (500 ft)</b></td></tr>
<tr><td>Usine isolée</td><td><b>300 m (1000 ft)</b></td></tr>
<tr><td>Agglo &lt; 1200 m</td><td><b>500 m</b></td></tr>
<tr><td>Ville 1200-3600 m</td><td><b>1000 m</b></td></tr>
<tr><td>Grande ville &gt; 3600 m</td><td><b>1500 m</b></td></tr>
</table>
<ul>
<li>Les mêmes seuils s'appliquent aux <b>rassemblements de personnes/animaux</b> (plage, stade…) qu'aux agglomérations de largeur équivalente</li>
<li>Distance minimale par rapport à tout <b>obstacle artificiel</b> (pylône, antenne, navire, véhicule) : <b>150 m (500 ft)</b></li>
