name: OpenAIP probe (temporaire)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          K: ${{ secrets.OPENAIP_API_KEY }}
        run: |
          echo "key length: ${#K}"
          probe() { code=$(curl -s -o out.txt -D hdr.txt -w '%{http_code} %{time_total}s' --max-time 90 -H "x-openaip-api-key: $K" "$1"); echo "::notice title=$code::$1 :: $(grep -i -E '^(retry-after|x-ratelimit|ratelimit)' hdr.txt | tr '\r\n' '  ') :: $(head -c 160 out.txt | tr '\n' ' ')"; }
          probe "https://api.core.openaip.net/api/airspaces?bbox=-0.5,47.3,9.4,53.7&limit=1000&page=1"
          sleep 10
          probe "https://api.core.openaip.net/api/airspaces?bbox=-0.5,47.3,9.4,53.7&limit=200&page=1"
          sleep 10
          probe "https://api.core.openaip.net/api/airspaces?bbox=4,50,5,51&limit=10&page=1"
          sleep 2
          probe "https://api.core.openaip.net/api/airspaces?bbox=4,50,5,51&limit=10&page=2"
          sleep 5
          probe "https://api.core.openaip.net/api/airspaces?bbox=4,50,5,51&limit=10&page=3"
