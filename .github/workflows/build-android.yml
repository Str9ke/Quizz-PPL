name: Build Android APK

# Construit une VRAIE application Android (Capacitor), et non un raccourci Chrome.
#
# Différence qui compte en vol : les pages, les 4742 questions et les ~80 Mo d'images sont
# EMBARQUÉES dans l'APK. Elles ne peuvent donc plus disparaître parce qu'un cache navigateur a
# été vidé, ni manquer parce qu'une page n'avait jamais été ouverte en ligne. Seules la
# synchronisation de la progression (Firestore) et la météo nécessitent encore du réseau.
#
# L'APK produit est attaché à une pré-release "android-latest" : téléchargeable directement
# depuis le téléphone, sans passer par le Play Store.

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - '**.html'
      - '**.css'
      - 'js/**'
      - '*.json'
      - 'Symboles/**'
      - 'IMAGES_*/**'
      - 'capacitor.config.json'
      - 'tools/**'
      # sw.js porte CACHE_NAME, dont tools/app_version.py tire la version de l'appli. Sans lui
      # ici, une version publiée par le site n'aurait JAMAIS d'APK correspondant : l'appli
      # installée annoncerait une mise à jour disponible qui n'existe pas, indéfiniment.
      #
      # RÈGLE : toute modification qui change l'APK doit s'accompagner d'un incrément de
      # CACHE_NAME — y compris quand elle ne touche QUE ce workflow. Le correctif de signature
      # en a fait la démonstration : l'APK republié était bel et bien différent (signé, enfin,
      # par la clé du dépôt) mais portait le même numéro, si bien que « Vérifier les mises à
      # jour » répondait « à jour » à quelqu'un qui devait précisément réinstaller.
      - 'sw.js'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the stable signing key
        # Android REFUSE d'installer une mise à jour signée par une clé différente de celle de
        # la version déjà présente : il faudrait désinstaller d'abord, ce qui EFFACE toutes les
        # données locales de l'appli — dont le miroir de la progression (js/localmirror.js) et
        # les images téléchargées. Or un runner GitHub est neuf à chaque exécution : sans cette
        # étape, `assembleDebug` fabriquerait une clé de débogage DIFFÉRENTE à chaque build, et
        # donc un APK impossible à installer par-dessus le précédent. La clé versionnée dans
        # android-signing/ garantit au contraire une signature identique d'une version à
        # l'autre : les mises à jour s'installent par-dessus, en conservant les données.
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E 'Alias|SHA256' | head -2

      - name: Create config.js from repository secrets
        # Mêmes secrets que le déploiement du site (voir deploy-pages.yml) : les clés ne sont
        # jamais versionnées, elles sont injectées au moment du build.
        run: |
          cat > config.js <<'EOF'
          window.FIREBASE_CONFIG = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}"
          };
          window.OPENAIP_API_KEY = "${{ secrets.OPENAIP_API_KEY }}";
          EOF
          # Version EMBARQUÉE dans l'APK : c'est elle que js/update-check.js comparera au
          # version.json publié par le site, pour dire si l'appli installée est à jour.
          APP_VERSION="$(python3 tools/app_version.py)"
          printf 'window.APP_BUILD = { version: "%s", channel: "android" };\n' "$APP_VERSION" >> config.js
          cat config.js | tail -1

      - name: Refresh the image manifest
        run: python3 tools/build_assets_manifest.py

      - name: Assemble www/ (the files shipped inside the APK)
        run: |
          python3 tools/build_www.py
          # config.js est exclu de la copie générique (il contient les clés) : on l'ajoute ici,
          # après coup, pour qu'il soit bien embarqué dans l'application.
          cp config.js www/config.js
          test -s www/config.js

      - name: Install Capacitor
        # @capacitor-community/text-to-speech : la WebView Android n'expose aucune voix
        # utilisable, ce plugin donne accès au moteur de synthèse vocale du système.
        #
        # ATTENTION à la version : la numérotation de ce plugin ne suit PAS celle de Capacitor.
        # C'est la 6.x qui déclare `@capacitor/core >=7.0.0` ; la 5.x exige core ^6.0.0 et fait
        # échouer l'installation (ERESOLVE) contre Capacitor 7, la 8.x exige core >=8.0.0.
        # Vérifier `npm view @capacitor-community/text-to-speech@^N peerDependencies` avant
        # tout changement de version ici ou de celle de Capacitor.
        # @capacitor/filesystem + @capacitor-community/file-opener : téléchargement de
        # l'APK et remise à l'installateur d'Android, pour la mise à jour depuis l'appli
        # elle-même (voir js/app-update.js).
        # capacitor-native-settings : ouvre la fiche système de l'appli — seul chemin permis
        # par Android pour une désinstallation, une appli ne pouvant pas se supprimer elle-même.
        # @capacitor/network : état réseau RÉEL. Dans l'APK la page est servie par un serveur
        # local, donc navigator.onLine vaut true même en mode avion — voir js/net.js.
        # @capacitor/status-bar : sur Android edge-to-edge (obligatoire depuis Android 15,
        # targetSdk de ce projet), l'appli dessine sous la barre de statut système par défaut —
        # horloge et icônes se mélangeaient au menu ☰ et aux résumés de score. Ce greffon
        # demande au système de réserver la place lui-même — voir js/statusbar.js.
        run: npm install --no-audit --no-fund @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 @capacitor-community/text-to-speech@^6 @capacitor/filesystem@^7 @capacitor-community/file-opener@^7 capacitor-native-settings@^7 @capacitor/network@^7 @capacitor/status-bar@^7

      - name: Generate the Android project
        run: npx cap add android

      - name: Sign with the repository key, explicitly
        # Copier la clé dans ~/.android NE SUFFIT PAS : selon la configuration du runner, Gradle
        # la cherche dans $ANDROID_SDK_HOME/.android ou $ANDROID_USER_HOME, ne l'y trouve pas, et
        # en FABRIQUE une nouvelle au passage — différente à chaque exécution puisque la machine
        # est neuve. Chaque APK était donc signé par une clé inédite, et Android refusait
        # d'installer par-dessus le précédent : « Application non installée », qui n'était
        # contournable qu'en désinstallant d'abord (donc en perdant les données locales).
        #
        # Preuve du défaut : l'APK publié portait « CN=Android Debug », le certificat par défaut
        # de Gradle, au lieu du « CN=Quiz Aviation PPL » de la clé du dépôt.
        #
        # On ne laisse donc plus le choix à Gradle : le chemin est écrit en dur dans build.gradle.
        run: |
          set -e
          GRADLE=android/app/build.gradle
          KEYSTORE="$GITHUB_WORKSPACE/android-signing/debug.keystore"
          test -f "$GRADLE" && test -f "$KEYSTORE"
          python3 - "$GRADLE" "$KEYSTORE" <<'PYEOF'
          import sys
          gradle, keystore = sys.argv[1], sys.argv[2]
          src = open(gradle, encoding='utf-8').read()
          assert 'signingConfigs' not in src, 'signingConfigs déjà présent — patch à revoir'
          block = (
              "android {\n"
              "    signingConfigs {\n"
              "        debug {\n"
              "            storeFile file('%s')\n"
              "            storePassword 'android'\n"
              "            keyAlias 'androiddebugkey'\n"
              "            keyPassword 'android'\n"
              "        }\n"
              "    }\n"
          ) % keystore
          assert src.count('android {') >= 1, 'bloc android { introuvable'
          open(gradle, 'w', encoding='utf-8').write(src.replace('android {', block, 1))
          print('signingConfigs.debug écrit dans build.gradle')
          PYEOF
          sed -n '/signingConfigs/,/^    }/p' "$GRADLE"

      - name: Allow the app to install an update
        # Sans REQUEST_INSTALL_PACKAGES, Android refuse à l'appli le droit de présenter un APK
        # à son installateur : le bouton « Mettre à jour maintenant » téléchargerait les 95 Mo
        # pour échouer au dernier moment. Le manifeste est REGÉNÉRÉ à chaque `cap add android`
        # (le dossier android/ n'est pas versionné), d'où ce patch au build plutôt qu'un fichier
        # modifié une fois pour toutes. L'utilisateur garde le dernier mot : Android affiche sa
        # propre confirmation, et exige en plus une autorisation explicite « installer des
        # applications inconnues ».
        run: |
          set -e
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -f "$MANIFEST"
          PERM='android.permission.REQUEST_INSTALL_PACKAGES'
          if grep -q "$PERM" "$MANIFEST"; then
            echo "Permission déjà présente."
          else
            python3 - "$MANIFEST" "$PERM" <<'PYEOF'
          import sys
          path, perm = sys.argv[1], sys.argv[2]
          src = open(path, encoding='utf-8').read()
          tag = '    <uses-permission android:name="%s" />\n' % perm
          marker = '</manifest>'
          assert marker in src, 'balise </manifest> introuvable'
          open(path, 'w', encoding='utf-8').write(src.replace(marker, tag + marker, 1))
          print('Permission ajoutée au manifeste.')
          PYEOF
          fi
          grep -c "$PERM" "$MANIFEST"

      - name: Stamp a real version number on the app
        # Capacitor génère toujours `versionCode 1` / `versionName "1.0"` : TOUTES les versions
        # se présentaient donc à Android comme la même. Outre qu'aucune mise à jour n'était
        # reconnue comme telle, l'installateur peut refuser une réinstallation dans cet état
        # avec un simple « Application non installée », sans autre explication.
        # Le numéro vient de CACHE_NAME (quiz-ppl-v125 -> versionCode 125), donc il augmente à
        # chaque version réelle de l'appli — la même source que version.json, ce qui garde
        # l'indicateur de mise à jour et le numéro installé cohérents entre eux.
        run: |
          set -e
          GRADLE=android/app/build.gradle
          test -f "$GRADLE"
          APP_VERSION="$(python3 tools/app_version.py)"
          CODE="$(printf '%s' "$APP_VERSION" | sed 's/.*v//')"
          case "$CODE" in
            ''|*[!0-9]*) echo "Numéro de version non numérique : '$CODE'"; exit 1 ;;
          esac
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" "$GRADLE"
          grep -E 'versionCode|versionName' "$GRADLE"

      - name: Generate launcher icons and splash screen
        # @capacitor/assets dérive toutes les densités Android depuis assets/icon.png et
        # assets/splash.png. Non bloquant : une icône générique n'empêche pas l'appli de
        # fonctionner, alors qu'un échec ici ferait perdre tout le build.
        continue-on-error: true
        run: npx @capacitor/assets generate --android

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate the APK
        id: apk
        # Le chemin est EXPLICITE et non plus « le premier .apk trouvé sous android/ ».
        # `find ... -print -quit` renvoyait le premier fichier rencontré dans un ordre non
        # garanti : Gradle laisse aussi des APK INTERMÉDIAIRES sous build/intermediates/, qui
        # ne sont ni forcément signés ni alignés. En publier un donne un fichier d'apparence
        # normale qu'Android refuse d'installer avec un laconique « Application non installée ».
        run: |
          set -e
          path=android/app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$path" ]; then
            echo "APK de sortie introuvable. APK présents dans l'arborescence :"
            find android -name '*.apk' -printf '%p\t%s octets\n' || true
            exit 1
          fi
          cp "$path" quiz-aviation-ppl.apk
          echo "size=$(du -h quiz-aviation-ppl.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          # La version de l'appli (quiz-ppl-vNNN) est CE QUE CONFIGURATION AFFICHE. La mettre
          # dans la release permet de comparer d'un coup d'œil « installée » et « publiée »,
          # sans avoir à déchiffrer des empreintes de commit.
          echo "version=$(python3 tools/app_version.py)" >> "$GITHUB_OUTPUT"
          ls -lh quiz-aviation-ppl.apk

      - name: Verify the APK is properly signed
        # Un APK mal signé s'installe... jusqu'au moment où Android le refuse, sur le téléphone,
        # après 95 Mo de téléchargement et sans expliquer pourquoi. Autant que la CHAÎNE DE BUILD
        # le constate : si la signature est absente ou invalide, le build échoue ici et rien
        # n'est publié.
        #
        # L'empreinte SHA-256 affichée est celle de android-signing/debug.keystore. Elle doit
        # rester IDENTIQUE d'une version à l'autre : c'est cette stabilité qui permet aux mises
        # à jour de s'installer par-dessus sans effacer la progression.
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs quiz-aviation-ppl.apk

          # La version précédente se contentait d'AFFICHER les deux empreintes côte à côte, sans
          # jamais les comparer : le build restait vert alors que l'APK était signé par une clé
          # inédite, et le défaut n'est apparu que sur le téléphone, à l'installation. Une
          # vérification qu'on ne fait que regarder n'est pas une vérification.
          APK_FP="$("$BT/apksigner" verify --print-certs quiz-aviation-ppl.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: *//' | tr -d ': ' | tr 'A-Z' 'a-z')"
          KEY_FP="$(keytool -list -v -keystore android-signing/debug.keystore -storepass android \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//' | tr -d ': ' | tr 'A-Z' 'a-z')"
          echo "empreinte APK : $APK_FP"
          echo "empreinte clé : $KEY_FP"
          if [ -z "$APK_FP" ] || [ "$APK_FP" != "$KEY_FP" ]; then
            echo "::error::L'APK n'est PAS signé avec la clé du dépôt. Il ne pourrait pas s'installer par-dessus la version précédente — publication interrompue."
            exit 1
          fi
          echo "Signature conforme à la clé du dépôt : les mises à jour s'installeront par-dessus."

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-aviation-ppl-apk
          path: quiz-aviation-ppl.apk
          retention-days: 30

      - name: Point the android-latest tag at this build
        # Le tag restait figé sur le commit qui l'avait créé la première fois, tandis que le
        # corps de la release et l'APK, eux, étaient bien à jour. La page de release affichait
        # donc DEUX commits différents — de quoi douter légitimement de la version qu'on vient
        # de télécharger. Le tag est désormais repositionné à chaque publication.
        run: |
          set -e
          git tag -f android-latest "${{ github.sha }}"
          git push -f origin refs/tags/android-latest

      - name: Publish the APK to the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Application Android — ${{ steps.apk.outputs.version }}
          prerelease: true
          files: quiz-aviation-ppl.apk
          body: |
            ## Version publiée : `${{ steps.apk.outputs.version }}`

            C'est le numéro qu'affiche **Configuration → Application Android**. S'il correspond
            à celui indiqué comme « installée », l'appli est à jour — inutile de retélécharger.

            Application Android autonome — questions et images embarquées, utilisable sans réseau.

            APK : ${{ steps.apk.outputs.size }} · compilé depuis le commit ${{ github.sha }}

            **Installation** : télécharge le fichier `.apk` ci-dessous depuis ton téléphone,
            puis ouvre-le. Android demandera d'autoriser l'installation depuis cette source —
            c'est normal pour une application distribuée hors Play Store.
