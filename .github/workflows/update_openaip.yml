name: Update OpenAIP

# Télécharge les données OpenAIP (espaces aériens, aérodromes, VOR/NDB/DME) de la zone
# Belgique + ~1 h de vol dans openaip_data.json, puis publie le site. Lancement manuel
# uniquement (bouton « Mettre à jour les données OpenAIP » de l'onglet Altitudes, ou onglet
# Actions) : ces données ne changent qu'aux cycles AIRAC (28 jours). Voir tools/fetch_openaip.py.
on:
  workflow_dispatch:

concurrency:
  group: update-openaip
  cancel-in-progress: false

jobs:
  update-openaip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests

      - name: Fetch OpenAIP data
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: python -u tools/fetch_openaip.py

      - name: Prepare site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: bash tools/prepare_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4

      - name: Commit and push
        run: |
          rm -rf site
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add openaip_data.json openaip_meta.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto-update OpenAIP data"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
