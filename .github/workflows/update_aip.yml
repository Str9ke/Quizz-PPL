name: Update AIP frequencies

# Fréquences radio OFFICIELLES (eAIP Belgique/Luxembourg de skeyes + eAIP France du SIA) ->
# aip_freqs.json, utilisé par le bouton 📻 des commentaires du Navlog (tools/aip_freqs.py).
# L'AIP change aux cycles AIRAC (28 jours) : une fois par semaine suffit, plus lancement manuel.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 4'   # chaque jeudi (jour des cycles AIRAC), 05:17 UTC

concurrency:
  group: update-aip
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Checkout (scripts et données OpenAIP)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fetch_notams.py
            /requirements.txt
            /openaip_data.json
            /aip_freqs.json
            /vfr_data.json
            /mef.json
            /aip_ad/
            /tools/

      # Même environnement (Python + Chromium pour le pare-feu de skeyes) que update_notams.yml
      - name: Env key
        id: envkey
        run: echo "key=fastenv-$(. /etc/os-release; echo $VERSION_ID)-py$(python3 -c 'import sys;print("%d.%d"%sys.version_info[:2])')-${{ hashFiles('requirements.txt') }}-v2" >> "$GITHUB_OUTPUT"

      - name: Restore Python env + Chromium
        id: env
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/venv
            ~/.cache/ms-playwright
          key: ${{ steps.envkey.outputs.key }}

      - name: Build env (first run only)
        if: steps.env.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install -q -r requirements.txt
          ~/venv/bin/python -m playwright install --only-shell chromium

      - name: Fetch AIP frequencies
        run: ~/venv/bin/python -u tools/aip_freqs.py

      # Points VFR (open flightmaps), obstacles (SIA, skeyes), cartes VAC belges -> vfr_data.json
      - name: Fetch VFR data
        env:
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: ~/venv/bin/python -u tools/fetch_vfrdata.py || echo "::warning::Données VFR non mises à jour"

      # Fiches AIP officielles des aérodromes (eAIP skeyes + SIA) -> aip_ad/<ICAO>.json
      - name: Fetch AIP aerodromes
        run: ~/venv/bin/python -u tools/aip_ad.py || echo "::warning::Fiches AIP non mises à jour"

      # MEF calculées par case de 30' (relief SRTM + obstacles de vfr_data.json) -> mef.json
      - name: Compute MEF
        run: ~/venv/bin/python -u tools/make_mef.py || echo "::warning::MEF non recalculées"

      - name: Publish (commit + push)
        id: push
        timeout-minutes: 15
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          bash tools/git_publish.sh "Auto-update fréquences AIP et données VFR" aip_freqs.json vfr_data.json mef.json aip_ad
          if [ "$(git rev-parse HEAD)" != "$before" ]; then echo "pushed=true" >> "$GITHUB_OUTPUT"; else echo "pushed=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: bash tools/prepare_site.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
