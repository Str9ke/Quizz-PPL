name: Deploy Firebase rules (Firestore & Storage)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write service account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore & Storage rules
        run: npx --yes firebase-tools@13 deploy --only firestore:rules,firestore:indexes,storage --project quizaviation-b79ff --non-interactive

      # Un déploiement qui affiche "deployed indexes successfully" ne prouve PAS qu'une exemption
      # d'indexation (fieldOverrides) a réellement été appliquée côté projet — la commande peut
      # réussir en ayant ignoré un override. Or ces exemptions sont le seul rempart contre
      # l'erreur d'écriture "too many index entries for entity" sur les documents responseShards,
      # qui contiennent une map `responses` de plusieurs centaines d'entrées imbriquées.
      # On imprime donc la configuration RÉELLEMENT active, pour pouvoir la vérifier.
      - name: Show the live Firestore index configuration
        run: npx --yes firebase-tools@13 firestore:indexes --project quizaviation-b79ff

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
