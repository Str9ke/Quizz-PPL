name: Update NOTAMs

on:
  schedule:
    - cron: '0 5-19/3 * * 0,3,5,6' # Toutes les 3h (5h,8h,11h,14h,17h UTC), uniquement Mer, Ven, Sam, Dim
  workflow_dispatch: # Lancement manuel

concurrency:
  group: update-notams
  cancel-in-progress: true

jobs:
  update-notams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          SKEYES_USER: ${{ secrets.SKEYES_USER }}
          SKEYES_PASS: ${{ secrets.SKEYES_PASS }}
        run: |
          python fetch_notams.py || true
          python fetch_meteo.py || true

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # git add -A (plutôt qu'une liste de motifs fixes) : la liste précédente ne couvrait
          # pas daily_warnings.json (ajouté par fetch_notams.py après coup), ce qui laissait ce
          # fichier modifié-non-indexé après le commit et faisait échouer `git pull --rebase`
          # ("You have unstaged changes") sur TOUTES les exécutions depuis son ajout — bloquant
          # au passage la mise à jour des NOTAMs/OPMET/cartes météo, pas seulement des avis du
          # jour. .gitignore exclut déjà tout ce qui ne doit pas être suivi (_debug_*, etc.).
          git add -A
          git commit -m "Auto-update NOTAMs & Daily Warnings & Meteo Maps & OPMET" || echo "No changes to commit"
          git pull --rebase
          git push
