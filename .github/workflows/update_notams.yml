name: Update NOTAMs

# Version RAPIDE (14/10/2026). Objectif : nouvelles données visibles en < 30 s après le clic.
#
# Job « fetch » (chemin critique) :
#   - copie PARTIELLE du dépôt (scripts seulement, sans les ~380 Mo d'images du site) ;
#   - environnement Python + Chromium restauré d'un seul cache (plus d'installation) ;
#   - cookie WAF Skeyes réutilisé d'une exécution à l'autre quand il est encore accepté ;
#   - récupération (Skeyes et Météo-France en parallèle) puis commit + push des seules données.
#   Dès le push, la page Briefing lit les nouveaux fichiers sur raw.githubusercontent.com à
#   l'adresse exacte de ce commit (voir js/remote-assets.js) : pas besoin d'attendre Pages.
# Job « deploy » (en arrière-plan) : déploiement complet du site GitHub Pages, comme avant.
#
# L'ancienne version (un seul job) est conservée dans update_notams_classic.yml ; la page
# Briefing permet de la choisir (« Mode de récupération »).

on:
  # Pas de déclenchement planifié : lancement manuel uniquement (page Briefing ou onglet Actions).
  workflow_dispatch:
    inputs:
      opmet_only:
        description: 'OPMET uniquement (rapide) — METAR+TAF+SIGMET+GAMET/AIRMET complets, ignore NOTAMs/images/TEMSI-WINTEM'
        type: boolean
        default: false

concurrency:
  group: update-notams
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Checkout (scripts uniquement)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fetch_notams.py
            /fetch_meteo.py
            /requirements.txt
            /.gitignore
            /tools/

      - name: Restore Python env + Chromium
        id: env
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/venv
            ~/.cache/ms-playwright
          key: fastenv-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('requirements.txt') }}-v1

      - name: Build env (first run only)
        if: steps.env.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install -q -r requirements.txt
          ~/venv/bin/python -m playwright install --only-shell chromium

      - name: Save env cache (first run only)
        if: steps.env.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/venv
            ~/.cache/ms-playwright
          key: fastenv-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('requirements.txt') }}-v1

      # Seul le cookie de dégagement du WAF Azure est conservé (jamais la session Skeyes).
      - name: Restore WAF cookie
        uses: actions/cache/restore@v4
        with:
          path: ~/waf
          key: waf-${{ github.run_id }}
          restore-keys: waf-

      - name: Run script
        env:
          SKEYES_USER: ${{ secrets.SKEYES_USER }}
          SKEYES_PASS: ${{ secrets.SKEYES_PASS }}
        run: |
          export WAF_COOKIE_FILE="$HOME/waf/cookie.json"
          PY=~/venv/bin/python
          if [ "${{ github.event.inputs.opmet_only }}" = "true" ]; then
            $PY -u fetch_notams.py --opmet-only || true
          else
            $PY -u fetch_meteo.py > _meteo.log 2>&1 &
            METEO_PID=$!
            $PY -u fetch_notams.py || true
            wait $METEO_PID || true
            cat _meteo.log; rm -f _meteo.log
          fi
          python3 -c "import json,time; json.dump({'ts': int(time.time()*1000), 'run': '${{ github.run_id }}', 'opmet_only': '${{ github.event.inputs.opmet_only }}' == 'true'}, open('fetch_stamp.json','w'))"

      - name: Publish data (commit + push)
        id: push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # --sparse : enregistre aussi les fichiers de données hors de la copie partielle.
          # Les fichiers du site absents de la copie ne sont PAS considérés comme supprimés.
          T0=$(date +%s.%N); lap() { echo "[publish] $1 $(echo "$(date +%s.%N) - $T0" | bc)s"; }
          git add --sparse -A
          lap add
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -q -m "Auto-update NOTAMs & Daily Warnings & Meteo Maps & OPMET"
          lap commit
          for attempt in 1 2 3 4 5; do
            # --no-thin : sans lui, git cherche les anciennes versions des fichiers comme base de
            # compression — absentes de la copie partielle, elles étaient téléchargées une à une
            # (~20 s). Le paquet envoyé est un peu plus gros mais part immédiatement.
            if git push -q --no-thin origin HEAD:main; then
              lap push
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Push réussi (tentative $attempt) : $(git rev-parse HEAD)"
              exit 0
            fi
            git fetch -q --depth=1 origin main
            git rebase origin/main || { git rebase --abort; sleep 2; }
          done
          echo "::error::Échec du push après plusieurs tentatives."
          exit 1

      - name: Save WAF cookie
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/waf
          key: waf-${{ github.run_id }}

      - name: Alert if Skeyes retrieval failed
        if: always()
        run: |
          if [ ! -f _skeyes_status.txt ]; then
            echo "::error::Statut Skeyes absent — le script a probablement planté."
            exit 1
          fi
          cat _skeyes_status.txt
          if grep -q '^FAIL' _skeyes_status.txt; then
            echo "::error::Récupération Skeyes en échec : $(grep '^FAIL' _skeyes_status.txt | tr '\n' ' ')"
            exit 1
          fi

  # Déploiement complet du site (copie locale, hors-ligne, appli) — hors du chemin critique.
  deploy:
    needs: fetch
    if: always() && needs.fetch.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: bash tools/prepare_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
