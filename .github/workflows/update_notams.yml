name: Update NOTAMs

# Version RAPIDE (14/10/2026). Objectif : nouvelles données visibles en < 30 s après le clic.
#
# Job « fetch » (chemin critique) :
#   - copie PARTIELLE du dépôt (scripts seulement, sans les ~380 Mo d'images du site) ;
#   - environnement Python + Chromium restauré d'un seul cache (plus d'installation) ;
#   - défi WAF Skeyes résolu par le Chromium de Playwright, restauré du cache (le Chrome
#     préinstallé du runner a été essayé : 22 s au lieu de 6, abandonné) ;
#   - récupération (Skeyes et Météo-France en parallèle) ; chaque partie est commitée et
#     poussée dès qu'elle est prête (OPMET d'abord), voir _Publisher dans fetch_notams.py.
#   Dès le push, la page Briefing lit les nouveaux fichiers sur raw.githubusercontent.com à
#   l'adresse exacte de ce commit (voir js/remote-assets.js) : pas besoin d'attendre Pages.
# Job « deploy » (en arrière-plan) : déploiement complet du site GitHub Pages, comme avant.
#
# L'ancienne version (un seul job) est conservée dans update_notams_classic.yml ; la page
# Briefing permet de la choisir (« Mode de récupération »).

on:
  # Pas de déclenchement planifié : lancement manuel uniquement (page Briefing ou onglet Actions).
  workflow_dispatch:
    inputs:
      opmet_only:
        description: 'OPMET uniquement (rapide) — METAR+TAF+SIGMET+GAMET/AIRMET complets, ignore NOTAMs/images/TEMSI-WINTEM'
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Une seule récupération à la fois — mais seulement pour ce job : un nouveau lancement
    # n'attend plus la fin (ou l'annulation) du déploiement Pages du précédent (+10 s mesurés).
    concurrency:
      group: update-notams
      cancel-in-progress: true
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - name: Checkout (scripts uniquement)
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /fetch_notams.py
            /fetch_aeroweb.py
            /fetch_meteo.py
            /skeyes_sfc_state.json
            /requirements.txt
            /.gitignore
            /tools/

      # Clé = version d'Ubuntu + de Python + requirements.txt : le venv pointe vers le Python du
      # système, il ne doit jamais être réutilisé sur une autre image (passage à Ubuntu 26…).
      - name: Env key
        id: envkey
        run: echo "key=fastenv-$(. /etc/os-release; echo $VERSION_ID)-py$(python3 -c 'import sys;print("%d.%d"%sys.version_info[:2])')-${{ hashFiles('requirements.txt') }}-v2" >> "$GITHUB_OUTPUT"

      - name: Restore Python env + Chromium
        id: env
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/venv
            ~/.cache/ms-playwright
          key: ${{ steps.envkey.outputs.key }}

      - name: Build env (first run only)
        if: steps.env.outputs.cache-hit != 'true'
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install -q -r requirements.txt
          ~/venv/bin/python -m playwright install --only-shell chromium

      - name: Save env cache (first run only)
        if: steps.env.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/venv
            ~/.cache/ms-playwright
          key: ${{ steps.envkey.outputs.key }}

      - name: Run script
        env:
          SKEYES_USER: ${{ secrets.SKEYES_USER }}
          SKEYES_PASS: ${{ secrets.SKEYES_PASS }}
          AEROWEB_USER: ${{ secrets.AEROWEB_USER }}
          AEROWEB_PASS: ${{ secrets.AEROWEB_PASS }}
          # Publication progressive : chaque partie (OPMET d'abord) est poussée dès qu'elle est
          # prête — voir _Publisher dans fetch_notams.py et tools/git_publish.sh.
          FAST_PUBLISH: '1'
          READY_DIR: _ready
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Images déjà compressées : inutile de les recompresser (gain de temps à chaque envoi)
          git config core.compression 0
          git config pack.compression 0
          # Anciennes versions des fichiers de données, préchargées en arrière-plan pendant la
          # connexion Skeyes : sans elles, chaque push les télécharge d'abord (git veut n'envoyer
          # que des différences) — 0,6 s pour l'OPMET, 1,5 s pour les images. Petits fichiers
          # d'abord (l'OPMET part vers t+7 s), puis les images (~125 Mo, ~2 s).
          prefetch() { git ls-tree HEAD | awk -v re="$1" '$2 == "blob" && $4 ~ re { print $3 }' \
            | git -c fetch.negotiationAlgorithm=noop fetch -q origin --no-tags --no-write-fetch-head --recurse-submodules=no --filter=blob:none --stdin; }
          { prefetch '^(opmet|daily_warnings|notams_belgique|notams_france|fetch_stamp|skeyes_images[.]json|.*_manifest[.]json)'
            prefetch '^(skeyes_|temsi_|wintem_).*[.](gif|jpg|jpeg|png)$'; } &
          PY=~/venv/bin/python
          if [ "${{ github.event.inputs.opmet_only }}" = "true" ]; then
            $PY -u fetch_notams.py --opmet-only || true
          else
            $PY -u fetch_meteo.py > _meteo.log 2>&1 &
            METEO_PID=$!
            $PY -u fetch_notams.py || true
            wait $METEO_PID || true
            cat _meteo.log; rm -f _meteo.log
          fi
          # Filet de sécurité : si le script n'a rien publié, horodatage « tout est là » pour que
          # la page cesse d'attendre (l'étape suivante pousse ce qui reste).
          [ -f fetch_stamp.json ] || python3 -c "import json,time; json.dump({'ts': int(time.time()*1000), 'run': '${{ github.run_id }}'}, open('fetch_stamp.json','w'))"

      # Normalement tout est déjà parti pendant l'étape précédente ; ceci rattrape un envoi
      # partiel qui aurait échoué.
      - name: Publish data (commit + push)
        id: push
        run: |
          if bash tools/git_publish.sh "Auto-update NOTAMs & Daily Warnings & Meteo Maps & OPMET" --all; then :; else
            echo "::error::Échec du push après plusieurs tentatives."; exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert if Skeyes retrieval failed
        if: always()
        run: |
          if [ ! -f _skeyes_status.txt ]; then
            echo "::error::Statut Skeyes absent — le script a probablement planté."
            exit 1
          fi
          cat _skeyes_status.txt
          if grep -q '^FAIL' _skeyes_status.txt; then
            echo "::error::Récupération Skeyes en échec : $(grep '^FAIL' _skeyes_status.txt | tr '\n' ' ')"
            exit 1
          fi

  # Déploiement complet du site (copie locale, hors-ligne, appli) — hors du chemin critique.
  deploy:
    needs: fetch
    if: always() && needs.fetch.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: bash tools/prepare_site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
