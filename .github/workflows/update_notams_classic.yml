name: Update NOTAMs (classique)

# Ancienne version (un seul job : copie complète du dépôt, récupération, déploiement Pages, commit),
# conservée telle quelle comme solution de repli du workflow rapide update_notams.yml. Sélectionnable
# depuis la page Briefing (« Mode de récupération : classique »).

on:
  # Plus de déclenchement planifié (supprimé le 13/10/2026 à la demande de l'utilisateur) :
  # la récupération ne se lance QUE manuellement, depuis la page Briefing (bouton
  # « Récupérer tout » / « OPMET seul ») ou l'onglet Actions de GitHub.
  workflow_dispatch: # Lancement manuel
    inputs:
      opmet_only:
        description: 'OPMET uniquement (rapide) — METAR+TAF+SIGMET+GAMET/AIRMET complets, ignore NOTAMs/images/TEMSI-WINTEM'
        type: boolean
        default: false

concurrency:
  group: update-notams
  cancel-in-progress: true

jobs:
  update-notams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write
    # Déploiement GitHub Pages fait DANS ce job (voir plus bas) : il faut l'environnement Pages.
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Chromium (défi JS du WAF Skeyes, voir _waf_clearance_cookies) : mis en cache entre les
      # exécutions et installé SANS « --with-deps » (les bibliothèques système nécessaires sont
      # déjà sur le runner, qui embarque Chrome) — auparavant ~20 s à chaque fois. Si le
      # lancement échouait quand même, fetch_notams.py réinstalle avec les dépendances.
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v1

      - name: Install Chromium (headless shell)
        run: python -m playwright install --only-shell chromium

      - name: Run script
        env:
          SKEYES_USER: ${{ secrets.SKEYES_USER }}
          SKEYES_PASS: ${{ secrets.SKEYES_PASS }}
        run: |
          if [ "${{ github.event.inputs.opmet_only }}" = "true" ]; then
            echo "OPMET-only fast run: full METAR+TAF+SIGMET+GAMET/AIRMET, skipping NOTAMs/images/TEMSI-WINTEM"
            python -u fetch_notams.py --opmet-only || true
          else
            # Skeyes et TEMSI/WINTEM (Météo-France) sont indépendants : en parallèle.
            python -u fetch_meteo.py > _meteo.log 2>&1 &
            METEO_PID=$!
            python -u fetch_notams.py || true
            wait $METEO_PID || true
            cat _meteo.log; rm -f _meteo.log
          fi
          # Horodatage de cette récupération : la page Briefing l'interroge pour se rafraîchir
          # d'elle-même dès que les nouvelles données sont en ligne.
          python3 -c "import json,time; json.dump({'ts': int(time.time()*1000), 'run': '${{ github.run_id }}', 'opmet_only': '${{ github.event.inputs.opmet_only }}' == 'true'}, open('fetch_stamp.json','w'))"

      # Déploiement immédiat du site avec les nouvelles données, AVANT le commit : c'est ce que
      # l'utilisateur attend. Auparavant, on poussait d'abord puis on déclenchait le workflow
      # deploy-pages.yml (nouveau runner, nouveau checkout) : ~45 s de plus.
      - name: Prepare site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          OPENAIP_API_KEY: ${{ secrets.OPENAIP_API_KEY }}
        run: bash tools/prepare_site.sh

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # git add -A (plutôt qu'une liste de motifs fixes) : la liste précédente ne couvrait
          # pas daily_warnings.json (ajouté par fetch_notams.py après coup), ce qui laissait ce
          # fichier modifié-non-indexé après le commit et faisait échouer `git pull --rebase`
          # ("You have unstaged changes") sur TOUTES les exécutions depuis son ajout — bloquant
          # au passage la mise à jour des NOTAMs/OPMET/cartes météo, pas seulement des avis du
          # jour. .gitignore exclut déjà tout ce qui ne doit pas être suivi (_debug_*, etc.).
          rm -rf site
          git checkout -- version.json 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Auto-update NOTAMs & Daily Warnings & Meteo Maps & OPMET"

          # Cause RÉELLE et récurrente (depuis des semaines) des échecs "! [rejected] main -> main
          # (fetch first)" : actions/checkout@v4 fait un clone SHALLOW (fetch-depth=1 par défaut),
          # donc un `git pull --rebase` classique (sans --depth) doit re-télécharger tout
          # l'historique complet pour "un-shallow" le dépôt — et cet historique est énorme ici car
          # chaque exécution (toutes les ~3h) committe des dizaines de Mo d'images météo binaires.
          # Ce fetch complet prenait 10 à 13 MINUTES (constaté dans les logs), une fenêtre pendant
          # laquelle un autre push sur main (dev actif, ou l'exécution planifiée suivante) atteint
          # presque à coup sûr le dépôt en premier → push rejeté, sans aucune tentative de
          # nouvelle synchronisation ensuite.
          # Solution testée localement (voir scratchpad) : ne récupérer QUE le dernier commit de
          # main à chaque tentative (fetch --depth=1, quasi instantané même sur un gros dépôt car
          # ça ne redemande jamais tout l'historique), puis `git rebase` par-dessus — un vrai
          # rebase (pas un reset --soft/--mixed, qui perdrait silencieusement les fichiers ajoutés
          # par les commits concurrents : testé et confirmé bogué) fonctionne correctement même
          # entre deux historiques shallow "sans ancêtre commun visible localement", grâce à la
          # détection par patch-id de Git (il retrouve/laisse tomber les commits déjà en amont et
          # rejoue proprement le reste).
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push réussi (tentative $attempt)."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push rejeté (tentative $attempt) — nouvelle synchronisation…"
            sleep 5
          done
          echo "::error::Échec du push après plusieurs tentatives."
          exit 1

      - name: Alert if Skeyes retrieval failed
        if: always()
        run: |
          # Les données partielles (NOTAMs, TEMSI…) ont déjà été publiées ci-dessus. Ici on rend
          # le job ROUGE si Skeyes a échoué, pour que GitHub envoie un e-mail d'alerte : la panne
          # de septembre 2026 est restée invisible 3 semaines parce que le job restait vert.
          if [ ! -f _skeyes_status.txt ]; then
            echo "::error::Statut Skeyes absent — le script a probablement planté."
            exit 1
          fi
          cat _skeyes_status.txt
          if grep -q '^FAIL' _skeyes_status.txt; then
            echo "::error::Récupération Skeyes en échec : $(grep '^FAIL' _skeyes_status.txt | tr '\n' ' ')"
            exit 1
          fi
